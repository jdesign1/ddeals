<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f4" />
    <title>Dodgy Deal unavailable</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        background: #faf8f4;
        color: #29251f;
      }
      body {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        text-align: center;
      }
      main { max-width: 320px; }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.1; }
      p { margin: 0 0 24px; color: #6b6258; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 14px;
        padding: 13px 20px;
        background: #17170f;
        color: white;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dodgy Deal is unavailable</h1>
      <p>Check your connection and try again. Your saved app data remains on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
