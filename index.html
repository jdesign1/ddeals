<script>
  /* Design tokens ported from the "Dodgy Deal · Mobile UI Kit" Claude Design
     artifact (brand guide, 2026-08-04 session) -- Paper/Ink/Fair Green/Dodgy
     Yellow/Alert Red/Stone palette + Manrope/Inter type system. Ink/Fair/
     Dodgy/Alert are full 50-950 ramps built from the artifact's sampled base
     hex (ink-600, fair-500, dodgy-500, alert-500 are the exact sampled
     values); Paper and Stone are used as flat tokens since the reference
     only showed one shade of each. Tailwind's built-in `stone-*` scale
     (already a close warm-neutral match) is reused directly for the old
     `slate-*` neutral usages rather than redefined here. */
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          display: ['Manrope', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          paper: '#faf8f4',
          /* Tailwind's built-in stone-* ramp (stone-50 #fafaf9 ... stone-900
             #1c1917) is reused as-is for the old slate-* neutral usages --
             already a close warm-grey match for the brand guide's Stone
             swatch (#eeeae1, ~stone-200) without needing an override here. */
          ink: {
            50: '#f6f5f3', 100: '#eae7e2', 200: '#d5d1c8', 300: '#b7b0a3',
            400: '#928a79', 500: '#6d6455', 600: '#171710', 700: '#141410',
            800: '#100f0c', 900: '#0c0b09', 950: '#060605',
          },
          fair: {
            50: '#f5fbf6', 100: '#d2efda', 200: '#b2e4bf', 300: '#96daa7',
            400: '#7dd193', 500: '#6ccb85', 600: '#56a26a', 700: '#4a8c5c',
            800: '#417a50', 900: '#386a45', 950: '#315b3c',
          },
          dodgy: {
            50: '#fdfbf4', 100: '#f6edcf', 200: '#f0e1ac', 300: '#ead58d',
            400: '#e5cc72', 500: '#e2c560', 600: '#b59d4d', 700: '#9c8842',
            800: '#88763a', 900: '#766732', 950: '#66592b',
          },
          alert: {
            50: '#fbf3f4', 100: '#edcbce', 200: '#e0a5ab', 300: '#d5848b',
            400: '#cb6770', 500: '#c4535d', 600: '#9d424a', 700: '#873940',
            800: '#763238', 900: '#662b31', 950: '#58252a',
          },
        },
        borderRadius: {
          '4xl': '2rem',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          scaleUp: { '0%': { opacity: 0, transform: 'scale(0.95)' }, '100%': { opacity: 1, transform: 'scale(1)' } },

          fadeIn: 'fadeIn 0.2s ease-out',

</script>

/* ===================== lib/supabase-live.ts ===================== */
/*
 * Live data layer. Replaces FALLBACK_PRODUCTS with real rows from the
 * Supabase project's `dodgy_deals` view -- current specials, pre-classified
 * DODGY/GENUINE/MARGINAL/UNKNOWN server-side (see dodgy_deals_view.sql).
 *
 * Was: fetched current_prices/products/price_history directly and ran the
 * DODGY/REAL_SAVER/FAIR/UNKNOWN classifier client-side (classifySpecial()
 * below), because the deployed view used to be stale -- missing columns,
 * returning zero rows. Fixed 2026-08-04, extended with display columns
 * 2026-08-07. Switched over the same day once Jay scoped the app down to
 * "search/browse current specials, use history only to rank them" (not
 * full-catalogue browsing) -- the old approach was pulling ~30-40MB/load
 * (effectively the whole catalogue) to re-derive, client-side, exactly what
 * this view already computes. See project.md's 2026-08-07 session entries
 * for the full egress investigation.
 *
 * Uses the public anon key directly, same pattern as matching-dashboard.html

// PostgREST caps responses (commonly 1000 rows) regardless of ?limit=, so
// anything that can exceed that must be paged with the Range header.
//
// Fetches page 1 with `Prefer: count=exact` to learn the true row count
// from the `Content-Range` response header, then fires every remaining
// page in parallel rather than one-at-a-time. This matters now that
// `current_prices` is fetched WITHOUT the is_special filter (~12.7k rows,
// full catalogue, not just the ~4.4k on-special subset) -- measured
// 2026-07-10: ~6s sequential vs ~1.5s parallel for the full table.
async function fetchAllRows(path) {
  const page = 1000;
  const MAX_PAGES = 100; // safety cap: 100k rows

  const fetchPage = async (start, extraHeaders) => {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Range-Unit': 'items',
        Range: `${start}-${start + page - 1}`,
        ...extraHeaders,
      },
    });
    if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
    return res;
  };

  const firstRes = await fetchPage(0, { Prefer: 'count=exact' });
  const firstData = await firstRes.json();
  const contentRange = firstRes.headers.get('content-range'); // e.g. "0-999/12702"
  const total = contentRange && contentRange.includes('/') ? parseInt(contentRange.split('/')[1], 10) : NaN;

  if (!Number.isFinite(total) || firstData.length < page) {
    return firstData; // no exact count available, or that one page was everything
  }

  const remainingPages = Math.min(Math.ceil((total - page) / page), MAX_PAGES - 1);
  const restResponses = await Promise.all(
    Array.from({ length: remainingPages }, (_, i) => fetchPage(page * (i + 1)))
  );
  const restData = await Promise.all(restResponses.map((res) => res.json()));
  return firstData.concat(...restData);
}

// Batched `in.(...)` lookups -- PostgREST/URL length gets risky past a few
// hundred UUIDs in one query string, so chunk the id list. Chunks are
// independent lookups (order doesn't matter, only used to build maps
// afterwards) so they're fired in parallel -- with the is_special filter
// gone, a page's worth of match groups can span several hundred product
// ids (several chunks), and this used to run them one at a time.
async function fetchByIds(path, column, select, ids, chunkSize = 100) {
  const chunks = [];
  for (let i = 0; i < ids.length; i += chunkSize) {
    chunks.push(ids.slice(i, i + chunkSize));
  }
  const results = await Promise.all(
    chunks.map(async (chunk) => {
      const url = `${SUPABASE_URL}/rest/v1/${path}?select=${select}&${column}=in.(${chunk.join(',')})`;
      const res = await fetch(url, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      });
      if (!res.ok) throw new Error(`${path} in-lookup -> HTTP ${res.status}`);
      return res.json();
    })
  );
  return results.flat();
}

// Client-side cache for the fully-built catalogue (post price_history/
// classification), keyed in IndexedDB rather than localStorage -- this
// payload is tens of MB (full products + price_history for every current
// special) and localStorage's per-origin cap (~5-10MB depending on browser)
// would silently throw/truncate. IndexedDB has real headroom.
//
// Added 2026-08-07: API logs showed the same ~48-page products/price_history
// fetch loop firing back-to-back with nothing else in between -- consistent
// with one browser reloading repeatedly during dev, not many distinct
// visitors -- and burning through the Supabase free tier's 5GB/mo egress
// cap. Prices only change via the nightly scrape, so a same-browser cache
// with a TTL well under 24h is safe: on a warm cache hit, this skips the
// Supabase fetch (and its egress) entirely for that load.
//
// CACHE_VERSION: bump this whenever the shape of the cached product objects
// changes (e.g. classifySpecial's output fields) so old cached shapes don't
// get served into code that expects new fields -- treated as a miss.
const CATALOGUE_CACHE_DB = 'dodgy_deals_cache';
const CATALOGUE_CACHE_STORE = 'catalogue';
const CATALOGUE_CACHE_KEY = 'live_products';
const CATALOGUE_CACHE_VERSION = 2; // bumped 2026-08-07: cached shape changed when loadLiveProducts moved to sourcing from the dodgy_deals view (priceHistory is now always [], see loadLiveProducts)
const CATALOGUE_CACHE_TTL_MS = 60 * 60 * 1000; // 1 hour

function openCatalogueCacheDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('indexedDB unavailable')); return; }
    const req = indexedDB.open(CATALOGUE_CACHE_DB, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(CATALOGUE_CACHE_STORE)) {
        req.result.createObjectStore(CATALOGUE_CACHE_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('indexedDB open failed'));
  });
}

// Returns the cached products array if present, version-matched, and within
// TTL -- otherwise null. Never throws: any failure (blocked storage, private
// browsing, corrupt record, etc.) is treated as a cache miss so the caller
// always has a working fallback to the normal network path.
async function readCatalogueCache() {
  try {
    const db = await openCatalogueCacheDB();
    const record = await new Promise((resolve, reject) => {
      const tx = db.transaction(CATALOGUE_CACHE_STORE, 'readonly');
      const req = tx.objectStore(CATALOGUE_CACHE_STORE).get(CATALOGUE_CACHE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    if (!record) return null;
    if (record.version !== CATALOGUE_CACHE_VERSION) return null;
    if (!Array.isArray(record.products) || !record.products.length) return null;
    if (Date.now() - record.savedAt > CATALOGUE_CACHE_TTL_MS) return null;
    return record.products;
  } catch (err) {
    console.warn('Catalogue cache read skipped:', err);
    return null;
  }
}

// Best-effort write -- failures (quota, blocked storage) are logged and
// swallowed, never surfaced to the caller. Caching is an optimization, not
// a requirement for the app to function.
async function writeCatalogueCache(products) {
  try {
    if (!Array.isArray(products) || !products.length) return;
    const db = await openCatalogueCacheDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(CATALOGUE_CACHE_STORE, 'readwrite');
      tx.objectStore(CATALOGUE_CACHE_STORE).put(
        { version: CATALOGUE_CACHE_VERSION, savedAt: Date.now(), products },
        CATALOGUE_CACHE_KEY
      );
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (err) {
    console.warn('Catalogue cache write skipped:', err);
  }
}

function median(nums) {
  if (!nums.length) return null;
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

const LOOKBACK_DAYS = 30;
const SEARCH_RESULTS_PAGE_SIZE = 30; // rendering hundreds+ of cards at once freezes the results list
const DODGY_THRESHOLD = 5;       // % pre-sale inflation to flag dodgy
const REAL_SAVER_THRESHOLD = 10; // % saving to count as a real saver
const FAIR_THRESHOLD = 3;        // % saving floor for "fair"
const SHRINKFLATION_THRESHOLD = 1; // min % the $/unit must actually drop
const DAY_MS = 24 * 60 * 60 * 1000;

// Classifies one (product_id, store_id) current special using its own
// price_history series (+ optional $/unit comparative pricing).
//   normal_price = median of pre-sale prices within the 30-day lookback
//   inflate_pct  = how much price was pumped in the 7 days before the sale
//   verdict, checked in order: UNKNOWN (no history) / DODGY (fake markup,
//   shrinkflation, or pump-and-discount) / REAL_SAVER (>=10% off) /
//   FAIR (3-10% off, or nothing better established)
// saleUnitPrice/saleUnitLabel are the current special's own $/unit (e.g.
// 5.00 / "per 1kg"), used only for the shrinkflation check in step 4.
//
// NOT CALLED by the live pipeline as of 2026-08-07 -- loadLiveProducts now
// sources classification straight from the dodgy_deals SQL view (same
// logic, computed server-side; see dodgy_deals_view.sql), so this never
// runs in production any more. Kept as the documented reference
// implementation -- this, dodgy_deals_view.sql, and analyser.py are the
// three places this formula is meant to stay in sync (see the "IMPORTANT"
// reference section this repo's project.md keeps updated), and deleting the
// live JS copy would break that convention even though nothing calls it.
function classifySpecial(salePrice, historyRows, saleUnitPrice, saleUnitLabel) {
  const sorted = [...historyRows].sort((a, b) => new Date(a.scraped_at) - new Date(b.scraped_at));

  // Walk backwards while is_special=true to find when the current streak began.
  let saleStartedAt = null;
  for (let i = sorted.length - 1; i >= 0; i--) {
    if (sorted[i].is_special) {
      saleStartedAt = new Date(sorted[i].scraped_at);
    } else {
      break;
    }
  }
  if (saleStartedAt === null) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice: null, savingPct: null, saleStartedAt: null };
  }

  const preSale = sorted.filter((r) => !r.is_special && new Date(r.scraped_at) < saleStartedAt && r.price != null);
  if (!preSale.length) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice: null, savingPct: null };
  }

  const lookbackCutoff = new Date(saleStartedAt.getTime() - LOOKBACK_DAYS * DAY_MS);
  const recentPreSale = preSale.filter((r) => new Date(r.scraped_at) >= lookbackCutoff);
  const normalPrice = median((recentPreSale.length ? recentPreSale : preSale).map((r) => r.price));

  const sevenDayCutoff = new Date(saleStartedAt.getTime() - 7 * DAY_MS);
  const veryEarly = preSale.filter((r) => new Date(r.scraped_at) < sevenDayCutoff).map((r) => r.price);
  const preSaleRecent = preSale.filter((r) => new Date(r.scraped_at) >= sevenDayCutoff).map((r) => r.price);
  let inflatePct = 0;
  if (veryEarly.length && preSaleRecent.length) {
    const baseline = median(veryEarly);
    const peak = Math.max(...preSaleRecent);
    inflatePct = baseline ? ((peak - baseline) / baseline) * 100 : 0;
  }

  const savingPct = normalPrice ? ((normalPrice - salePrice) / normalPrice) * 100 : 0;

  // Step 4 -- shrinkflation check. Only runs when both sides have a $/unit
  // figure under the SAME unit label (exact match: " /kg" is never compared
  // to "$/100g") -- live coverage is ~16%, so this silently no-ops otherwise.
  let unitPriceChangePct = null;
  if (saleUnitPrice != null && saleUnitLabel) {
    const baselineUnitRows = preSale.filter((r) => r.unit_price != null && r.unit_label === saleUnitLabel);
    if (baselineUnitRows.length) {
      const baselineUnitPrice = median(baselineUnitRows.map((r) => r.unit_price));
      if (baselineUnitPrice) {
        unitPriceChangePct = ((saleUnitPrice - baselineUnitPrice) / baselineUnitPrice) * 100;
      }
    }
  }

  if (normalPrice == null) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice, savingPct: null, saleStartedAt };
  }
  if (salePrice > normalPrice) {
    return {
      verdict: 'DODGY',
      reason: `Sale price ($${salePrice.toFixed(2)}) is HIGHER than the normal price ($${normalPrice.toFixed(2)}) -- fake deal`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
      saleStartedAt,
    };
  }
  if (unitPriceChangePct != null && unitPriceChangePct > -SHRINKFLATION_THRESHOLD) {
    return {
      verdict: 'DODGY',
      reason: `Pack size shrank -- the $/unit price barely moved (${unitPriceChangePct >= 0 ? '+' : ''}${unitPriceChangePct.toFixed(1)}%) despite the nominal ${savingPct.toFixed(1)}% saving`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
      saleStartedAt,
    };
  }
  if (inflatePct >= DODGY_THRESHOLD && savingPct < REAL_SAVER_THRESHOLD) {
    return {
      verdict: 'DODGY',
      reason: `Price was raised ${inflatePct.toFixed(1)}% just before the sale -- you're only saving ${savingPct.toFixed(1)}%`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
      saleStartedAt,
    };
  }
  if (savingPct >= REAL_SAVER_THRESHOLD) {
    return {
      verdict: 'REAL_SAVER',
      reason: `Saving ${savingPct.toFixed(1)}% vs the recent normal price`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
      saleStartedAt,
    };
  }
  if (savingPct >= FAIR_THRESHOLD) {
    return {
      verdict: 'FAIR',
      reason: `Only a ${savingPct.toFixed(1)}% saving -- barely worth it`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
      saleStartedAt,
    };
  }
  return {
    verdict: 'FAIR',
    reason: 'Minimal saving vs normal price',
    normalPrice,
    savingPct: Math.round(savingPct * 10) / 10,
    saleStartedAt,
  };
}

// ---- Real cross-store product matching --------------------------------
// Two reviewed/approved match tables already exist in the database (built
// by the identity-matching pipeline, see project.md):
//   products.canonical_product_id -- exact SKU matches (272 linked products
//     / 158 distinct cross-store groups at last count)
//   app_comparable_family_links   -- looser but manually-reviewed "fair to
//     compare" matches, e.g. same item different pack size (332 rows,
//     spans Pak'nSave/New World/Woolworths/Four Square, not just
//     within-Foodstuffs)
// Union-find over both edge sets turns these into connected components --
// e.g. Woolworths' "Heinz Ketchup" row and New World's "Heinz Ketchup" row
// (different products.id each, one per retailer catalogue) resolve to the
// same group id, so their current specials get merged onto one product
// card instead of showing up as two unrelated products.
async function buildMatchIndex() {
  const [canonicalRows, comparableRows] = await Promise.all([
    fetchAllRows('products?select=id,canonical_product_id&canonical_product_id=not.is.null'),
    fetchAllRows('app_comparable_family_links?select=left_product_id,right_product_id'),
  ]);

  const parent = new Map();
  const find = (x) => {
    if (!parent.has(x)) parent.set(x, x);
    let root = x;
    while (parent.get(root) !== root) root = parent.get(root);
    let cur = x;
    while (parent.get(cur) !== root) {
      const next = parent.get(cur);
      parent.set(cur, root);
      cur = next;
    }
    return root;
  };
  const union = (a, b) => {
    const ra = find(a);
    const rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };

  for (const row of canonicalRows) union(row.id, row.canonical_product_id);
  for (const row of comparableRows) union(row.left_product_id, row.right_product_id);

  return { find, edgeCount: canonicalRows.length + comparableRows.length };
}

// Field-by-field merge across every retailer's own product row in a match
// group, so a group still displays a full card even if e.g. only the
// Woolworths listing has an image_url or only the New World listing has a
// category set.
function mergeProductMeta(memberMetas) {
  const pick = (field) => memberMetas.map((m) => m && m[field]).find((v) => v != null && v !== '') || null;
  return {
    name: pick('name'),
    brand: pick('brand'),
    category: pick('category'),
    image_url: pick('image_url'),
    unit_size: pick('unit_size'),
  };
}

const titleCase = (s) => (s || '').replace(/\b\w/g, (c) => c.toUpperCase());

// shows up under several near-duplicate strings ("Beer & Wine" / "Beer,

const CATEGORY_GROUPS = [
  { label: 'Fruit & veg', match: /fruit|veg/i },
  { label: 'Meat & seafood', match: /meat|seafood|poultry|fish/i },
  { label: 'Fridge, deli & eggs', match: /fridge|deli|eggs/i },

// Product cards are tappable as a whole (onClick on the card's own <div>)
// now that the standalone "Check Deals" button has been removed from them.
// A plain onClick div isn't keyboard-operable on its own, so every tappable
// card also gets role="button"/tabIndex={0} and this onKeyDown handler --
// mirrors what a real <button> gets for free, activating on Enter/Space
// only (not e.g. arrow keys, which browsers don't treat as "activate"
// either) and preventing Space's default page-scroll behaviour.
const handleCardKeyActivate = (onActivate) => (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    onActivate();
  }
};

// current_prices.special_end_date is a plain `date` column (no time/zone),
// coming back over PostgREST as a bare "YYYY-MM-DD" string. `new
// Date("YYYY-MM-DD")` parses that as UTC midnight, and formatting it then
// converts back to the *browser's local* timezone -- for anyone west of
// UTC that shifts the displayed day back by one (e.g. a US-based dev
// checking this NZ-only app would see the 19th instead of the 20th).
// Parsing the y/m/d parts directly into a local-timezone Date sidesteps
// that entirely, since there's no real time-of-day to preserve anyway.
const formatDealEndDate = (dateStr) => {
  if (!dateStr) return '';
  const [year, month, day] = dateStr.split('-').map(Number);
  if (!year || !month || !day) return '';
  return new Date(year, month - 1, day).toLocaleDateString('en-NZ', { day: '2-digit', month: 'short', year: 'numeric' });
};

// Strips everything but letters/numbers before comparing search text, so
// punctuation/spacing differences between how a product is actually named
// in the database and how a shopper types it don't cause false misses --
// e.g. "Weetbix" (how most people type it) vs the DB's "Weet-Bix", or
// "PAK'nSAVE" vs "paknsave" (same normalisation already used for store-name
// matching elsewhere in this file, applied here to product search text too).
const normalizeSearchText = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

// Splits into normalised whole-word tokens, e.g. for telling an exact word
// match ("milk" in "Standard Milk") apart from an incidental substring
// inside a longer, unrelated word ("milk" inside "Milky", "butter" inside
// "Buttery"/"Butterscotch"/"Buttermilk-flavoured Chips").
const tokenizeSearchText = (s) => (s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

// Splits on *whitespace only* (punctuation within a word is stripped, not
// split on), so a hyphenated/punctuated real name stays glued together as
// one word for typo comparison -- same as normalizeSearchText already does
// for exact matches. Needed because tokenizeSearchText above splits
// "Weet-Bix" into two separate words ("weet", "bix"), which would stop a
// typo'd, un-hyphenated search like "weibix" (how people actually type it)
// from ever getting close enough to either half individually.
const tokenizeForFuzzy = (s) => (s || '').toLowerCase().split(/\s+/).map((w) => w.replace(/[^a-z0-9]/g, '')).filter(Boolean);

// Bounded Levenshtein (edit) distance -- how many single-character
// insertions/deletions/substitutions turn `a` into `b`. Capped at
// `maxDistance`: as soon as every cell in a DP row exceeds it, we bail out
// early (returning maxDistance + 1, i.e. "too far") instead of finishing the
// full O(len(a)*len(b)) table. That keeps a per-product typo check cheap
// even when it runs across the whole ~12.7k-item live catalogue.
function levenshteinDistance(a, b, maxDistance) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > maxDistance) return maxDistance + 1;
  let prev = new Array(b.length + 1);
  let curr = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    curr[0] = i;
    let rowMin = curr[0];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
      if (curr[j] < rowMin) rowMin = curr[j];
    }
    if (rowMin > maxDistance) return maxDistance + 1;
    [prev, curr] = [curr, prev];
  }
  return prev[b.length];
}

// How many typos we tolerate for a word of a given length. Short words
// (<=3 chars, e.g. "tea", "jam") get zero tolerance -- a 1-edit "correction"
// to a short word is just as likely to land on a different real word ("tea"
// vs "pea") as fix a typo, so allowing it would surface unrelated products.
// Longer words get proportionally more room, since a genuine typo in e.g.
// "weetbix" or "chocolate" is more likely to be 1-2 characters out of many.
const typoBudgetForLength = (len) => (len <= 3 ? 0 : len <= 5 ? 1 : len <= 9 ? 2 : 3);

// Whether `word` (as typed) is close enough to `candidate` (a real word from
// a product's name/brand/category) to count as a typo of it, e.g. "weibix"
// -> "weetbix", "bananna" -> "banana", "yoghurt" -> "yogurt".
//
// Budget is based on the *typed* word's length, not the candidate's -- using
// the longer of the two (an earlier version of this code did) let a short
// query piggyback on a longer candidate's bigger budget, e.g. "tea" (3
// chars, meant to get zero tolerance) fuzzy-matching "teal" or "team" purely
// because the *candidate* was 4+ chars. Keying off what the user actually
// typed keeps that zero-tolerance guarantee for short queries regardless of
// how long the product word happens to be.
const isFuzzyWordMatch = (word, candidate) => {
  if (!word || !candidate) return false;
  if (word === candidate) return true;
  const budget = typoBudgetForLength(word.length);
  if (budget === 0) return false;
  return levenshteinDistance(word, candidate, budget) <= budget;
};

// All searchable words for a product, pre-tokenized once per product per
// search rather than re-split on every candidate comparison. Uses
// tokenizeForFuzzy (whitespace-only split) so hyphenated names like
// "Weet-Bix" stay as one word ("weetbix") for typo comparison -- see note
// on tokenizeForFuzzy above. Cached per product object in a WeakMap since
// product identity is stable across re-renders (mockProducts only grows via
// appended pages, see productsVersion) -- avoids re-tokenizing every
// product's name/brand/category from scratch on every fuzzy-fallback scan.
const productSearchTokensCache = new WeakMap();
const getProductSearchTokens = (product) => {
  if (productSearchTokensCache.has(product)) return productSearchTokensCache.get(product);
  const tokens = [
    ...tokenizeForFuzzy(product.name),
    ...tokenizeForFuzzy(product.brand),
    ...tokenizeForFuzzy(product.category),
  ];
  productSearchTokensCache.set(product, tokens);
  return tokens;
};

// Typo-tolerant fallback match: every word the user typed has to be a close
// (or exact) match to *some* word in the product's name/brand/category, in
// any order -- so a misspelled multi-word query like "chocolat mlik" still
// finds "Milk Chocolate", not just single-word typos. `query` is the raw
// (untrimmed-tokenization-agnostic) search string, not pre-tokenized --
// tokenized here with tokenizeForFuzzy so it lines up with how the
// candidate words were tokenized above.
const isFuzzyProductMatch = (product, query, candidateTokens) => {
  const queryTokens = tokenizeForFuzzy(query);
  if (queryTokens.length === 0) return false;
  const tokens = candidateTokens || getProductSearchTokens(product);
  return queryTokens.every((qt) => tokens.some((ct) => isFuzzyWordMatch(qt, ct)));
};

// Relevance score for ranking search results -- without this, a plain
// substring match with no ranking left cheap incidental hits (a "Butter
// Chicken" simmer sauce, "Buttery" spread, "Milk Arrowroot" biscuits) sorted
// ahead of the actual milk/butter category items a shopper searching "milk"
// or "butter" is looking for, since the default sort is cheapest-price-first
// and snacks/sauces are usually cheaper than a carton of milk or block of
// butter. Category match (the product's real aisle/category) ranks highest,
// then an exact word match in the name, then brand, then a genuine (but not
// whole-word) substring match, and finally a typo-tolerant fuzzy match --
// ranked lowest so a correctly-spelled incidental match never loses to a
// misspelled query's best-guess correction.
const getSearchRelevance = (product, query) => {
  const queryTokens = tokenizeSearchText(query);
  if (queryTokens.length === 0) return 1;
  const isWholeWordMatch = (text) => {
    const tokens = tokenizeSearchText(text);
    return queryTokens.every((qt) => tokens.includes(qt));
  };
  if (isWholeWordMatch(product.category)) return 6;
  if (isWholeWordMatch(product.name)) return 5;
  if (isWholeWordMatch(product.brand)) return 4;
  const normalizedQuery = normalizeSearchText(query);
  const isRealSubstring = (text) => normalizeSearchText(text).includes(normalizedQuery);
  if (isRealSubstring(product.name) || isRealSubstring(product.brand) || isRealSubstring(product.category)) return 3;
  if (isFuzzyProductMatch(product, query)) return 2;
  return 1;
};

// Shared fallback used both when a product row has no image_url in the
// database and as an <img onError> safety net if a stored URL 404s/expires.
const FALLBACK_PRODUCT_IMAGE = 'https://placehold.co/300x300?text=No+Image';

// Renders a product's real photo (from products.image_url in Supabase) with
// a placeholder fallback. Used everywhere a card previously showed a static
// "Product Image" text box instead of an actual image.
// Woolworths' CDN serves images at whatever w/h the caller asks for via its
// `impolicy` query params, but the scraped image_url is pinned at a 65x65
// thumbnail size -- bumped up here to a real display size instead of
// stretching a tiny thumbnail. Other retailers' CDNs (fsimg.co.nz) aren't
// affected since their URLs don't match this host/param shape.
const upgradeImageQuality = (url) => {
  if (!url || !url.includes('assets.woolworths.com.au')) return url;
  return url.replace(/([?&])w=\d+/, '$1w=600').replace(/([?&])h=\d+/, '$1h=600');
};

function ProductImage({ src, alt, className }) {
  const upgradedSrc = upgradeImageQuality(src);
  return (
    <img
      src={upgradedSrc || FALLBACK_PRODUCT_IMAGE}
      alt={alt || 'Product'}
      loading="lazy"
      draggable="false"
      className={className}
      onError={(e) => {
        if (e.currentTarget.src !== FALLBACK_PRODUCT_IMAGE) {
          e.currentTarget.onerror = null;
          e.currentTarget.src = FALLBACK_PRODUCT_IMAGE;
        }
      }}
    />
  );
}

// Shared, pure store-name/logo helpers -- hoisted out of SearchTab (which
// used to define its own local copies) so TrackedTab, HistoryTab, and the
// shared ProductCard component below can all use the same logic instead of
// each maintaining a separate near-duplicate. `branchOverrides` is optional:
// pass a component's own personalised-branch-name lookup (see SearchTab's
// `usePersonalised`/`selectedBranches` local state) to get e.g. "Woolworths
// CBD" instead of the generic "Woolworths"; omit it for the plain generic
// name, which is what TrackedTab/HistoryTab/ProductCard use directly since
// neither of the first two currently has its own personalisation settings
// UI. Named with a "Global" suffix (rather than plain getStoreDisplayName)
// specifically so SearchTab can still define its own same-named, shadowing
// wrapper that binds in its local personalisation state -- every existing
// single-argument getStoreDisplayName(...) call site inside SearchTab then
// keeps resolving to that wrapper unchanged, rather than silently losing
// personalisation by resolving to this generic version instead.
const getStoreDisplayNameGlobal = (storeKey, branchOverrides) => {
  const generic = (() => {
    switch (storeKey.toLowerCase()) {
      case 'woolworths': return 'Woolworths';
      case 'paknsave': return "PAK'nSAVE";
      case 'newworld': return 'New World';
      case 'foursquare': return 'Four Square';
      default: return storeKey;
    }
  })();
  if (!branchOverrides) return generic;
  switch (storeKey.toLowerCase()) {
    case 'woolworths': return branchOverrides['Woolworths'] || generic;
    case 'paknsave': return branchOverrides["PAK'nSAVE"] || generic;
    case 'newworld': return branchOverrides['New World'] || generic;
    case 'foursquare': return branchOverrides['Four Square'] || generic;
    default: return generic;
  }
};

const getStoreLogoMeta = (storeName) => {
  const STORE_LOGOS = {
    'Woolworths': { short: 'WW', bg: 'bg-emerald-600', text: 'text-white' },
    "PAK'nSAVE": { short: 'PNS', bg: 'bg-amber-500', text: 'text-stone-950' },
    'New World': { short: 'NW', bg: 'bg-rose-600', text: 'text-white' },
    'Four Square': { short: 'FS', bg: 'bg-green-600', text: 'text-white' },
  };
  const norm = storeName.toLowerCase().replace(/[^a-z]/g, '');
  if (norm.includes('woolworth')) return STORE_LOGOS['Woolworths'];
  if (norm.includes('paknsave')) return STORE_LOGOS["PAK'nSAVE"];
  if (norm.includes('newworld')) return STORE_LOGOS['New World'];
  if (norm.includes('foursquare')) return STORE_LOGOS['Four Square'];
  return { short: storeName.substring(0, 2).toUpperCase(), bg: 'bg-stone-600', text: 'text-white' };
};

// Shared product-card layout used everywhere a product is shown as a card
// (SearchTab's main results, its "Your Items on Special" alert widget and
// "Popular Specials Right Now" row, TrackedTab's My List, and HistoryTab's
// check history) -- previously each of those 5 places had its own
// independently hand-built (and increasingly drifting) card layout. Five
// rows: deal-ends date + save/track icon; image + brand/name/size; price;
// a factual one-line callout about the store the price/deal shown belongs
// to (wording varies by context -- "Lowest at", "On special at", "Checked
// at" -- via `storeLinePrefix`, since not every card's displayed deal is
// actually the cheapest option, and mislabelling one as "Lowest" would be
// exactly the kind of fabricated-looking claim this project explicitly
// avoids elsewhere); and a badges row for any other stores also running a
// special right now.
//
// Props:
// - id: DOM id for the outer card (kept from each call site's previous
//   button/card id so nothing else that referenced it by id breaks).
// - product: { name, brand, unit, image }.
// - price: number shown in the big price row.
// - storeKey: the raw store key the price/storeLinePrefix line is about.
// - storeLinePrefix: text before the store name, e.g. "Lowest at".
// - branchOverrides: optional personalised-branch-name lookup (see
//   getStoreDisplayNameGlobal) -- omit for the generic store name.
// - dealEndsText: precomputed "Deal ends ..." string, or '' to show nothing
//   (never fabricated here -- callers only pass a real value when they
//   actually have one).
// - alsoSpecialStores: raw store keys (not display names) for the badges
//   row; empty array hides the row entirely.
// - isTracked / onToggleTrack: track/save icon state + handler. Passing no
//   onToggleTrack hides the icon entirely (matches the previous
//   `isLoggedIn &&` gating at each call site).
// - onActivate: card tap/Enter handler. Passing none makes the card fully
//   inert (used for TrackedTab's compare-mode cards, which have no single
//   "check this deal" action while comparing total list cost).
// - variant: 'full' (default) or 'peek' -- 'peek' renders the same content
//   but clipped to a short, faded, fully inert preview height (used for the
//   collapsed 3rd item in SearchTab's alert widget), matching the old
//   isPartiallyVisible treatment.
// - emphasizeBorder: ink-tinted border instead of the default stone one
//   (used where the card set already conveys "something here is genuinely
//   on special" at a glance, e.g. the main search results grid).
function ProductCard({
  id,
  product,
  price,
  storeKey,
  storeLinePrefix = 'Lowest at',
  branchOverrides,
  dealEndsText = '',
  alsoSpecialStores = [],
  isTracked = false,
  onToggleTrack,
  onActivate,
  variant = 'full',
  emphasizeBorder = false,
  children,
}) {
  const isPeek = variant === 'peek';
  const tappable = !isPeek && !!onActivate;
  const storeLabel = getStoreDisplayNameGlobal(storeKey, branchOverrides);
  const matchedDeal = product.currentDeals && product.currentDeals.find((d) => d.store === storeKey);
  const isDodgy = matchedDeal && matchedDeal.dealType === 'Dodgy Deal';
  const isRealSaver = matchedDeal && matchedDeal.dealType === 'Real Deal';
  const isFairDeal = matchedDeal && matchedDeal.dealType === 'Fair Price';

  return (
    <div
      id={id}
      onClick={tappable ? onActivate : undefined}
      onKeyDown={tappable ? handleCardKeyActivate(onActivate) : undefined}
      role={tappable ? 'button' : undefined}
      tabIndex={tappable ? 0 : undefined}
      aria-label={tappable ? `Check deals for ${product.name}` : undefined}
      className={`relative bg-white border rounded-2xl overflow-hidden flex flex-col group transition-all duration-200 ${
        isPeek
          ? 'h-24 pointer-events-none select-none border-dashed border-stone-300'
          : `${isDodgy ? 'border-alert-300' : isRealSaver ? 'border-fair-300' : isFairDeal ? 'border-dodgy-300' : emphasizeBorder ? 'border-ink-200' : 'border-stone-200'} ${tappable ? 'cursor-pointer hover:shadow-lg hover:shadow-stone-100 active:scale-[0.99]' : ''}`
      }`}
    >
      {/* Peek cards are meant to be a fully inert preview -- pointer-events-none
          on the outer container already blocks mouse clicks, but that alone
          doesn't stop keyboard Tab focus or a synthetic .click(), so the
          button itself has to be omitted here too, not just visually hidden. */}
      {!isPeek && onToggleTrack && (
        <button
          onClick={(e) => { e.stopPropagation(); onToggleTrack(); }}
          id={`track-${id}`}
          aria-label={isTracked ? 'Remove from list' : 'Add to list'}
          title={isTracked ? 'Remove from list' : 'Add to list'}
          className={`absolute top-3 right-3 z-10 p-1.5 rounded-lg transition-colors active:scale-97 cursor-pointer ${
            isTracked ? 'text-alert-600 hover:bg-alert-50' : 'text-ink-600 hover:bg-ink-50'
          }`}
        >
          {isTracked ? <Check className="w-5 h-5" /> : <Plus className="w-5 h-5" />}
        </button>
      )}

      {/* Row 2: product image + title/brand/size, with the save/track toggle
          aligned to the title's top line and pinned to the card's right edge. */}
      <div className="flex gap-4 px-5 pt-5">
        <div className="w-24 h-24 rounded-xl flex items-center justify-center overflow-hidden select-none flex-shrink-0">
          <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
        </div>
        <div className="flex flex-col justify-center min-w-0 flex-1 pr-9">
          <span className="text-[10px] font-bold text-stone-500 uppercase tracking-widest">
            {product.brand}
          </span>
          <h3 className="font-bold text-base text-stone-900 leading-snug mt-0.5 font-display line-clamp-2">
            {product.name}
          </h3>
          {product.unit && (
            <span className="text-xs font-medium text-stone-500 mt-0.5">{product.unit}</span>
          )}
          <span className="text-2xl font-black text-stone-900 font-display mt-1.5">
            ${price.toFixed(2)}
          </span>
          <div className="flex items-center gap-1.5 mt-0.5">
            <span className="text-xs font-bold text-stone-600">
              {storeLinePrefix} {storeLabel}.
            </span>
          </div>
          {alsoSpecialStores.length > 0 && (
            <div className="flex items-center gap-2 flex-wrap mt-7">
              <span className="text-[10px] font-bold text-stone-600 tracking-wider">Also on special at:</span>
              <div className="flex items-center gap-1.5 flex-wrap">
                {alsoSpecialStores.map((store) => {
                  const meta = getStoreLogoMeta(store);
                  return (
                    <div
                      key={store}
                      title={getStoreDisplayNameGlobal(store)}
                      className={`px-2 py-1 rounded-md text-[9px] font-black select-none ${meta.bg} ${meta.text}`}
                    >
                      {meta.short}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* This spacer only supplies the card's bottom padding when nothing
          else (caller children) will supply it instead -- the also-on-
          special-at badges now live in the title column above. */}
      <div className={!children ? 'pb-5' : ''} />

      {/* Optional extra content below the standard 5 rows -- currently only
          used by TrackedTab's My List card for its compare-mode weight/
          quantity controls, which need to live inside the same card but
          aren't part of the shared wireframe layout itself. */}
      {children}

      {isDodgy && !isPeek && (
        <span className="absolute bottom-5 right-3 z-10 bg-alert-600 text-white text-[9px] font-black px-2 py-1 rounded-md uppercase tracking-wider select-none shadow-xs">
          Dodgy
        </span>
      )}

      {isRealSaver && !isPeek && (
        <span className="absolute bottom-5 right-3 z-10 bg-fair-600 text-white text-[9px] font-black px-2 py-1 rounded-md uppercase tracking-wider select-none shadow-xs">
          Real
        </span>
      )}

      {isFairDeal && !isPeek && (
        <span className="absolute bottom-5 right-3 z-10 bg-dodgy-600 text-white text-[9px] font-black px-2 py-1 rounded-md uppercase tracking-wider select-none shadow-xs">
          Fair
        </span>
      )}

      {!isPeek && (() => {
        const meta = getStoreLogoMeta(storeKey);
        return (
          <span className={`absolute bottom-5 left-3 z-10 px-2 py-1 rounded-md text-[9px] font-black select-none shadow-xs ${meta.bg} ${meta.text}`}>
            {meta.short}
          </span>
        );
      })()}

      {isPeek && (
        <div className="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-white to-transparent pointer-events-none" />
      )}
    </div>
  );
}

// Maps the dodgy_deals SQL view's verdict vocabulary (DODGY/GENUINE/
// MARGINAL/UNKNOWN) onto the same dealType/short-reason strings the old
// client-side classifySpecial() produced (DODGY/REAL_SAVER/FAIR/UNKNOWN) --
// GENUINE<->REAL_SAVER and MARGINAL<->FAIR are the same concepts, just
// named differently between the two implementations (verified: same
// thresholds, saving_pct >=10 / >=3, see dodgy_deals_view.sql). Every
// downstream consumer (ProductCard badges, search results, HISTORY_DEAL_TYPE
// in the "All Checks" tab) keys off these exact output strings, so this
// mapping keeps them working unchanged even though the source of the
// verdict moved from the client to the view.
const VIEW_VERDICT_TO_DEAL_TYPE = { DODGY: 'Dodgy Deal', GENUINE: 'Real Deal', MARGINAL: 'Fair Price' };
const VIEW_VERDICT_SHORT_REASON = { DODGY: 'Artificial Discount (Was-Is Trap)', GENUINE: 'Genuine Sale', UNKNOWN: 'Not Enough History' };

// Builds full product cards straight from dodgy_deals view rows -- no
// separate products/price_history fetch, no client-side classification.
// The view already computed verdict/saving_pct/reason server-side (see
// dodgy_deals_view.sql) and already joins product_name/brand/category/
// image_url/unit_size/store_name, so this is just reshaping rows into the
// card shape the UI expects, then grouping into cross-store match groups.
function buildProductCardsFromSpecials(groupEntries) {
  const products = [];
  for (const [groupId, rows] of groupEntries) {
    const meta = mergeProductMeta(rows.map((r) => ({
      name: r.product_name, brand: r.brand, category: r.category, image_url: r.image_url, unit_size: r.unit_size,
    })));
    if (!meta.name) continue;

    const currentDeals = rows.map((row) => ({
      store: row.store_name || STORE_DISPLAY_FALLBACK[row.store_id] || titleCase(row.store_id),
      price: row.sale_price,
      originalPrice: row.normal_price ?? row.was_price ?? row.sale_price,
      discountPercentage: Math.max(0, Math.round(row.saving_pct ?? 0)),
      dealType: row.verdict === 'UNKNOWN' ? 'Unverified Deal' : VIEW_VERDICT_TO_DEAL_TYPE[row.verdict],
      wasArtificiallyInflated: row.verdict === 'DODGY',
      reason: VIEW_VERDICT_SHORT_REASON[row.verdict] || 'Standard Special',
      explanation: row.reason,
      isOnSpecial: true,
      // When this special began (from the view's sale_start CTE) -- used by
      // the Trending tab to surface only recently-started genuine savings,
      // not specials that have been running for months.
      saleStartedAt: row.sale_started_at || null,
      // Retailer-advertised end date for this special, when the source
      // actually supplied one.
      specialEndDate: row.special_end_date || null,
    }));

    // The identity-matching pipeline occasionally links two distinct
    // retailer catalogue rows from the *same* store into one match group
    // (a known upstream data-quality quirk) -- collapse to the best
    // (lowest) price per store rather than showing contradictory duplicate
    // rows for the same shop.
    const bestDealByStore = new Map();
    for (const deal of currentDeals) {
      const existing = bestDealByStore.get(deal.store);
      if (!existing || deal.price < existing.price) bestDealByStore.set(deal.store, deal);
    }
    const dedupedDeals = [...bestDealByStore.values()];
    if (!dedupedDeals.length) continue;

    const normalPrices = rows.map((r) => r.normal_price).filter((p) => p != null);

    products.push({
      id: groupId,
      brand: titleCase(meta.brand) || 'Unbranded',
      name: titleCase(meta.name),
      category: meta.category || 'Grocery',
      image: meta.image_url || FALLBACK_PRODUCT_IMAGE,
      standardPrice: normalPrices.length ? Math.min(...normalPrices) : Math.min(...rows.map((r) => r.sale_price)),
      unit: meta.unit_size || '',
      currentDeals: dedupedDeals,
      // No raw time-series any more -- nothing in the UI renders one (the
      // per-store bar chart and pricing-stats table both read aggregate
      // originalPrice/normal_price, not a day-by-day series; confirmed by
      // reading getRealAveragePrice/getPricingStatsForStore before this
      // change). dodgy_deals' normal_price already *is* that aggregate.
      priceHistory: [],
      description: '',
    });
  }
  return products;
}

// Small on-demand lookup for products NOT covered by the specials-only
// dataset above -- specifically, tracked/list items that have rolled off
// special (see TrackedTab's lapsed-tracking hydration). No price_history
// involved (nothing renders a raw series, see note above) -- builds the
// same 'Fair Price'/non-special card shape the old full-catalogue fetch
// used to produce for regular-priced rows, just fetched lazily for a
// specific handful of ids instead of eagerly for the whole catalogue.
// Simplification: looks up each id as its own single-store card rather
// than reconstructing its full original cross-store match group (that
// would need a reverse index over the union-find groups built once during
// loadLiveProducts and not persisted) -- real data, just possibly missing
// a second store's row if the id was part of a multi-store group. Flagged
// for Jay; fine for the common case of one tracked listing at one store.
async function fetchNonSpecialProductCards(productIds) {
  const ids = [...new Set(productIds)].filter(Boolean);
  if (!ids.length) return [];
  const [priceRows, productRows] = await Promise.all([
    fetchByIds('current_prices', 'product_id', 'product_id,store_id,price', ids),
    fetchByIds('products', 'id', 'id,name,brand,category,image_url,unit_size', ids),
  ]);
  const productById = new Map(productRows.map((p) => [p.id, p]));

  return priceRows.map((row) => {
    const meta = productById.get(row.product_id);
    if (!meta || !meta.name) return null;
    return {
      id: row.product_id,
      brand: titleCase(meta.brand) || 'Unbranded',
      name: titleCase(meta.name),
      category: meta.category || 'Grocery',
      image: meta.image_url || FALLBACK_PRODUCT_IMAGE,
      standardPrice: row.price,
      unit: meta.unit_size || '',
      currentDeals: [{
        store: STORE_DISPLAY_FALLBACK[row.store_id] || titleCase(row.store_id),
        price: row.price,
        originalPrice: row.price,
        discountPercentage: 0,
        dealType: 'Fair Price',
        wasArtificiallyInflated: false,
        reason: 'Regular Price',
        explanation: 'Not currently on special -- this is the regular shelf price.',
        isOnSpecial: false,
      }],
      priceHistory: [],
      description: '',
    };
  }).filter(Boolean);
}

// Loads current specials only -- per the 2026-08-07 scope decision with
// Jay, the app searches/browses current specials, using history purely to
// rank them (dodgy/fair/genuine), not full-catalogue browsing. Sourced
// entirely from the dodgy_deals view (~6,200 rows, already classified and
// joined against products/stores server-side) grouped into real cross-store
// match groups via the same union-find matchIndex as before. Replaces the
// old current_prices + products + price_history three-table fetch
// (~30-40MB/load, effectively the whole catalogue every time) with one
// ~6,200-row query -- no more per-page pagination loop needed, the whole
// specials set is small enough to load in one shot.
async function loadLiveProducts(onUpdate) {
  const [specialRows, matchIndex] = await Promise.all([
    fetchAllRows('dodgy_deals?select=product_id,store_id,product_name,brand,category,store_name,sale_price,normal_price,saving_pct,special_label,was_price,special_end_date,image_url,unit_size,sale_started_at,verdict,reason'),
    buildMatchIndex(),
  ]);
  if (!specialRows.length) return [];

  const byGroup = new Map();
  for (const row of specialRows) {
    const groupId = matchIndex.find(row.product_id);
    if (!byGroup.has(groupId)) byGroup.set(groupId, []);
    byGroup.get(groupId).push(row);
  }

  const allProducts = buildProductCardsFromSpecials([...byGroup.entries()]);
  if (onUpdate) onUpdate(allProducts);
  return allProducts;
}

// Builds working demo content for the tracked-items/history/alerts tabs out
// of whatever real products actually loaded, since those tabs stay local
// mock state (per project scope) but previously pointed at the old
// hardcoded mock product ids -- which no longer exist once real UUIDs are
// in play.
function buildSeedLists(products) {
  const ids = products.slice(0, 6).map((p) => p.id);
  if (!ids.length) return [{ id: 'list-1', name: 'List 1', itemIds: [] }];
  return [
    { id: 'list-1', name: 'List 1', itemIds: ids.slice(0, 3) },
    { id: 'list-2', name: 'List 2', itemIds: ids.slice(2, 5) },
    { id: 'list-3', name: 'List 3', itemIds: ids.length > 3 ? [ids[0], ids[3], ids[ids.length - 1]] : ids },
  ];
}

const HISTORY_DEAL_TYPE = { 'Dodgy Deal': 'Dodgy Deal', 'Real Deal': 'Real Saver', 'Fair Price': 'Fair Deal' };

function buildSeedHistory(products) {
  return products.slice(0, 9).map((p, idx) => {
    const deal = p.currentDeals[0];
    return {
      id: `hist-${idx + 1}`,
      productId: p.id,
      checkedAt: idx < 3 ? ['10:24 AM', '08:15 AM', '4:45 PM'][idx] : `Jul ${Math.max(1, 9 - idx)}`,
      store: deal.store,
      price: deal.price,
      dealType: HISTORY_DEAL_TYPE[deal.dealType] || 'Fair Deal',
    };
  });
}

function buildSeedAlerts(products) {
  return products.slice(0, 4).map((p, idx) => {
    const deal = p.currentDeals[0];
    return {
      id: `alert-${idx + 1}`,
      productId: p.id,
      store: deal.store,
      oldPrice: deal.originalPrice,
      newPrice: deal.price,
      alertType: deal.dealType,
      timestamp: idx === 0 ? 'Today' : idx === 1 ? 'Yesterday' : `${idx} days ago`,
      read: idx > 1,
    };
  });
}

/* ===================== components/SearchTab.tsx ===================== */

function SearchTab({
  onCheckDeal,
  onTrackToggle,
  trackedProductIds,
  lists = [],
  showSnackbar,
  searchInputValue,
  setSearchInputValue,
  activeSearchQuery,
  setActiveSearchQuery,
  selectedStores,
  setSelectedStores,
  sortBy,
  setSortBy,
  isAllDealsExpanded,
  setIsAllDealsExpanded,
  homeTab,
  setHomeTab,
  storeFilter,
  setStoreFilter,
  categoryFilter,
  setCategoryFilter,
  homeSortBy,
  setHomeSortBy,
  onNavigateToSettings,
  onOpenScanner,
  onOpenLogin,
  isLoggedIn = true,
  productsVersion = 0,
  startInSearchMode = false,
}) {
  // Shown in the full-screen search view before the user has typed 3+
  // characters (the "Keep typing..." state) so there's something to browse
  // rather than a dead end -- the biggest current specials across the whole
  // live catalogue, ranked by discount, same "best deal per product" idea
  // used by the results list below.
  const popularSpecials = React.useMemo(() => {
    const dealMatchesSelectedStores = (deal) => {
      if (selectedStores.includes('all')) return true;
      return selectedStores.some((selected) => storeMatchesFilter(deal.store, selected));
    };
    return mockProducts
      .map((product) => {
        const specialDeals = (product.currentDeals || []).filter((d) => d.isOnSpecial !== false && dealMatchesSelectedStores(d));
        if (specialDeals.length === 0) return null;
        const bestDeal = specialDeals.reduce((best, d) =>
          (d.discountPercentage || 0) > (best.discountPercentage || 0) ? d : best
        , specialDeals[0]);
        return { product, bestDeal };
      })
      .filter(Boolean)
      .sort((a, b) => (b.bestDeal.discountPercentage || 0) - (a.bestDeal.discountPercentage || 0));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [productsVersion, selectedStores]);
  const [popularSortBy, setPopularSortBy] = React.useState('discount');
  const [popularTab, setPopularTab] = React.useState('specials');
  const [popularCategoryFilter, setPopularCategoryFilter] = React.useState([]);
  const [resultsCategoryFilter, setResultsCategoryFilter] = React.useState([]);
  const [categorySheetTarget, setCategorySheetTarget] = React.useState(null);
  const activeCategoryFilter = categorySheetTarget === 'results' ? resultsCategoryFilter : popularCategoryFilter;
  const setActiveCategoryFilter = categorySheetTarget === 'results' ? setResultsCategoryFilter : setPopularCategoryFilter;
  const toggleActiveCategory = (cat) => {
    setActiveCategoryFilter((prev) => prev.includes(cat) ? prev.filter((c) => c !== cat) : [...prev, cat]);
  };
  const togglePopularCategory = (cat) => {
    setPopularCategoryFilter((prev) => prev.includes(cat) ? prev.filter((c) => c !== cat) : [...prev, cat]);
  };
  const sortedPopularSpecials = React.useMemo(() => {
    const filtered = popularSpecials.filter(({ product, bestDeal }) =>
      (popularTab !== 'dodgy' || bestDeal.dealType === 'Dodgy Deal') &&
      (popularCategoryFilter.length === 0 || popularCategoryFilter.includes(groupCategory(product.category)))
    );
    const sorted = [...filtered];
    if (popularTab === 'dodgy') {
      if (popularSortBy === 'recent') {
        sorted.sort((a, b) => new Date(b.bestDeal.saleStartedAt || 0) - new Date(a.bestDeal.saleStartedAt || 0));
      } else if (popularSortBy === 'price-desc') {
        sorted.sort((a, b) => b.bestDeal.price - a.bestDeal.price);
      } else if (popularSortBy === 'price-asc') {
        sorted.sort((a, b) => a.bestDeal.price - b.bestDeal.price);
      }
    } else if (popularSortBy === 'dodgy') {
      sorted.sort((a, b) => (b.bestDeal.dealType === 'Dodgy Deal' ? 1 : 0) - (a.bestDeal.dealType === 'Dodgy Deal' ? 1 : 0));
    }
    return sorted;
  }, [popularSpecials, popularSortBy, popularTab, popularCategoryFilter]);
  const [isPopularExpanded, setIsPopularExpanded] = React.useState(false);
  const POPULAR_PAGE_SIZE = popularTab === 'dodgy' ? 24 : 6;
  const visiblePopularSpecials = isPopularExpanded ? sortedPopularSpecials : sortedPopularSpecials.slice(0, POPULAR_PAGE_SIZE);

  const [railSortBy, setRailSortBy] = React.useState('discount');
  const railProducts = React.useMemo(() => {
    if (homeTab === 'related') {
      return popularSpecials
        .filter(({ product, bestDeal }) => storeMatchesFilter(bestDeal.store, storeFilter) && (categoryFilter === 'all' || groupCategory(product.category) === categoryFilter))
        .map(({ product, bestDeal }) => ({ product, bestDeal }));
    }
    // Trending = genuine, real-money-saving deals that started within the
    // last 7 days -- not just anything on special. saleStartedAt is missing
    // on FALLBACK_PRODUCTS demo data (no live history to derive it from),
    // so those still pass.
    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const isRecentRealDeal = (d) =>
      d.dealType === 'Real Deal' && (!d.saleStartedAt || new Date(d.saleStartedAt).getTime() >= weekAgo);
    return mockProducts
      .filter((product) => (categoryFilter === 'all' || groupCategory(product.category) === categoryFilter) && (product.currentDeals || []).some((d) => isRecentRealDeal(d) && storeMatchesFilter(d.store, storeFilter)))
      .map((product) => ({
        product,
        bestDeal: product.currentDeals
          .filter((d) => isRecentRealDeal(d) && storeMatchesFilter(d.store, storeFilter))
          .reduce((best, d) => (d.price < best.price ? d : best)),
      }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [homeTab, popularSpecials, productsVersion, storeFilter, categoryFilter]);
  // Cap the rendered list -- Trending/Related can have thousands of matches
  // against the live catalogue with no filter applied, and rendering every
  // ProductCard at once freezes the tab. Sort by biggest discount (or
  // dodgy-first) and only render a page at a time. Memoized -- this used to
  // resort/refilter a multi-thousand-item array inline on every render,
  // including renders triggered elsewhere in the app (like opening the
  // deal-assessment modal), which is what was freezing the UI on tap.
  const sortedRailProducts = React.useMemo(() => {
    return [...railProducts].sort((a, b) => {
      if (railSortBy === 'dodgy') {
        const aDodgy = a.bestDeal.dealType === 'Dodgy Deal' ? 1 : 0;
        const bDodgy = b.bestDeal.dealType === 'Dodgy Deal' ? 1 : 0;
        if (bDodgy !== aDodgy) return bDodgy - aDodgy;
      }
      return (b.bestDeal.discountPercentage || 0) - (a.bestDeal.discountPercentage || 0);
    });
  }, [railProducts, railSortBy]);
  const homeCategories = React.useMemo(
    () => [...new Set(mockProducts.map((p) => groupCategory(p.category)).filter(Boolean))].sort(),
    // eslint-disable-next-line react-hooks/exhaustive-deps
    [productsVersion]
  );

  React.useEffect(() => {
    setIsAllDealsExpanded(false);
  }, [homeTab, storeFilter, categoryFilter]);

  // Full-screen search view -- opens as soon as the search bar is tapped
  // (onFocus, see renderSearchBar below) or as soon as a character is typed.
  // Closing is now explicit only: the back arrow and the full-screen bar's
  // dedicated close button both call handleClearSearch (clears text + exits).
  // Deliberately does NOT auto-close just because the query goes back to
  // empty (via backspacing or the inline field's clear-X) -- that used to
  // double as "close", which is what made the inline X feel like it was
  // closing search instead of just clearing the text typed so far. Native
  // search screens keep you in the full-screen view (showing "Keep
  // typing...") until you explicitly back out.
  const [isSearchActive, setIsSearchActive] = React.useState(() => startInSearchMode);
  const [priceFilter, setPriceFilter] = React.useState('specials');

  const [usePersonalised, setUsePersonalised] = React.useState(() => {
    return localStorage.getItem('use_personalised_settings') === 'true';
  });

  const [selectedBranches] = React.useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    const defaults = {
      'Woolworths': 'Woolworths CBD',
      "PAK'nSAVE": "PAK'nSAVE Mt Albert",
      'New World': 'New World Victoria Park',
      'Four Square': 'Four Square Ellerslie',
    };
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square'].forEach(brand => {
            loaded[brand] = parsed[brand] || defaults[brand];
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    return defaults;
  });

  // The query actually used for filtering/sorting is debounced ~150ms behind
  // what's typed. searchInputValue/activeSearchQuery still update on every
  // keystroke (so the input itself and the "Results for '...'" heading never
  // lag), but the expensive full-catalogue scan below only re-runs once
  // typing pauses -- previously it ran synchronously on every single
  // keystroke, which is what caused the noticeable suggestion lag on mobile.
  const [debouncedQuery, setDebouncedQuery] = React.useState(activeSearchQuery);
  const [isSearchResultsExpanded, setIsSearchResultsExpanded] = React.useState(false);
  React.useEffect(() => {
    setIsSearchResultsExpanded(false);
  }, [debouncedQuery, selectedStores, sortBy, priceFilter]);
  React.useEffect(() => {
    const timer = setTimeout(() => setDebouncedQuery(activeSearchQuery), 150);
    return () => clearTimeout(timer);
  }, [activeSearchQuery]);

  // Filter -> store-match -> relevance-sort, all in one memo. Previously this
  // whole pipeline (filter over every product in mockProducts, a second
  // filter, then a sort whose comparator re-tokenised each product's
  // name/brand/category from scratch on every pairwise comparison) re-ran on
  // *every* render of SearchTab -- not just when the query changed, but also
  // on unrelated re-renders like the background pagination tick that lands
  // more of the live catalogue. With ~12.7k products live, that's what made
  // typing feel laggy: the main thread was re-scanning the whole catalogue
  // before the input's own updated value could paint.
  // - Skips the scan entirely below 3 characters, matching the "Keep
  //   typing..." UI gate that already hides results below that length --
  //   no point filtering/sorting thousands of products just to throw the
  //   result away unrendered.
  // - Relevance (getSearchRelevance) is now computed once per product up
  //   front instead of being recomputed inside the sort comparator on every
  //   comparison (was O(n log n) re-tokenisations, now O(n)).
  // - Depends on productsVersion (a tick bumped by App() each time a new
  //   page of live products lands) rather than reading the mutable
  //   `mockProducts` global directly, so the memo only recomputes when the
  //   data, query, store filter, or sort mode actually changed.
  const sortedProducts = React.useMemo(() => {
    const trimmedQuery = debouncedQuery.trim();
    if (trimmedQuery.length < 3) return [];

    const query = normalizeSearchText(trimmedQuery);
    const filteredProducts = mockProducts.filter((p) => (
      normalizeSearchText(p.name).includes(query) ||
      normalizeSearchText(p.brand).includes(query) ||
      normalizeSearchText(p.category).includes(query) ||
      // Typo-tolerant fallback -- only reached when the query isn't a real
      // substring anywhere, so this never adds cost for a correctly spelled
      // search (the three .includes() checks above short-circuit first).
      isFuzzyProductMatch(p, trimmedQuery)
    ));

    // Filter products matching selected stores. Every item the supermarkets
    // stock is browsable here now, not just ones currently on special --
    // "all stores" just needs the product to be sold/priced somewhere.
    const matchedByStore = filteredProducts.filter((product) => {
      if (selectedStores.includes('all')) {
        return product.currentDeals.length > 0;
      }
      return product.currentDeals.some((deal) => selectedStores.some((selected) => storeMatchesFilter(deal.store, selected)));
    });

    // The results screen only ever shows on-special items now (browsing
    // regular-priced items lives in the plain catalogue search, not this
    // deals-focused list) -- "All specials" vs "Dodgy" narrows to just the
    // deals flagged dodgy by the classifier.
    const matched = matchedByStore.filter((product) => {
      const hasSpecial = product.currentDeals.some((deal) => deal.isOnSpecial !== false);
      if (!hasSpecial) return false;
      if (priceFilter === 'dodgy') {
        if (!product.currentDeals.some((deal) => deal.dealType === 'Dodgy Deal')) return false;
      }
      if (resultsCategoryFilter.length > 0 && !resultsCategoryFilter.includes(groupCategory(product.category))) return false;
      return true;
    });

    const getBestPrice = (p) => Math.min(...p.currentDeals.map((d) => d.price));
    const getMaxDiscount = (p) => Math.max(...p.currentDeals.map((d) => d.discountPercentage));
    const getDodgyScore = (p) =>
      p.currentDeals.some((d) => d.dealType === 'Dodgy Deal')
        ? 2
        : p.currentDeals.some((d) => d.dealType === 'Fair Price')
        ? 1
        : 0;

    // Sort products. Relevance to the search query comes first (see
    // getSearchRelevance -- category matches beat name matches beat brand
    // matches beat incidental substring-only matches), so the actual "Milk"
    // or "Butter" category items surface ahead of things that merely
    // mention the word in passing (a "Butter Chicken" sauce, "Milky"
    // candy). The user's chosen sort (cheapest / biggest discount / dodgy
    // rating) still applies, just as the tiebreaker *within* each relevance
    // tier rather than overriding it -- otherwise a 99c snack that happens
    // to match the query would keep beating the actual product being
    // searched for.
    return matched
      .map((product) => ({ product, relevance: getSearchRelevance(product, trimmedQuery) }))
      .sort((a, b) => {
        if (b.relevance !== a.relevance) return b.relevance - a.relevance;
        if (sortBy === 'cheapest') return getBestPrice(a.product) - getBestPrice(b.product);
        if (sortBy === 'discount') return getMaxDiscount(b.product) - getMaxDiscount(a.product);
        if (sortBy === 'dodgy-rating') return getDodgyScore(b.product) - getDodgyScore(a.product);
        return 0;
      })
      .map((x) => x.product);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [productsVersion, debouncedQuery, selectedStores, sortBy, priceFilter, resultsCategoryFilter]);

  // Unique count of retailers offering these deals
  const totalRetailersCount = new Set(
    sortedProducts.flatMap((p) => p.currentDeals.map((d) => d.store))
  ).size;

  // No more explicit "Search" submit button (it's been replaced by the
  // barcode-scan button below) -- results now live-filter as the user
  // types, so form submission is just swallowed to stop a stray Enter key
  // press from reloading the page.
  const handleSearchFormSubmit = (e) => {
    e.preventDefault();
  };

  const handleSearchInputChange = (e) => {
    const value = e.target.value;
    setSearchInputValue(value);
    setActiveSearchQuery(value);
    if (value.length > 0) {
      setIsSearchActive(true);
    }
  };

  // Closes the full-screen search view entirely (back arrow, and the
  // dedicated close button in the full-screen bar) -- resets the query too,
  // same as leaving a native search screen.
  // Dedicated close button in the full-screen bar just drops focus/keyboard
  // -- it stays on the search screen. Exiting the screen entirely is the
  // back arrow's job (handleClearSearch below).
  const handleBlurSearchInput = () => {
    document.getElementById('search-input')?.blur();
  };

  const handleClearSearch = () => {
    setSearchInputValue('');
    setActiveSearchQuery('');
    setPriceFilter('specials');
    setIsSearchActive(false);
    showSnackbar('Cleared search results');
  };

  // Clears just the typed text, staying on the full-screen search view --
  // this is what the inline X inside the search field itself does. Kept
  // distinct from handleClearSearch above: that one also backs out of the
  // full-screen view, which the inline field X should not do.
  const handleClearSearchText = () => {
    setSearchInputValue('');
    setActiveSearchQuery('');
    showSnackbar('Cleared search results');
  };

  // Thin, personalisation-aware wrapper around the shared top-level
  // getStoreDisplayName -- delegates the actual name-lookup logic, just
  // binding in this component's own usePersonalised/selectedBranches local
  // state. Deliberately shadows the top-level function under the same name
  // (rather than a differently-named wrapper) so every existing single-
  // argument getStoreDisplayName(...) call site elsewhere in this component
  // keeps resolving to this personalisation-aware version unchanged.
  const getStoreDisplayName = (storeKey) =>
    getStoreDisplayNameGlobal(storeKey, usePersonalised ? selectedBranches : null);

  const handleStoreToggle = (storeId) => {
    if (storeId === 'all') {
      setSelectedStores(['all']);
    } else {
      let nextStores = [...selectedStores];
      if (nextStores.includes('all')) {
        nextStores = [storeId];
      } else {
        if (nextStores.includes(storeId)) {
          nextStores = nextStores.filter((id) => id !== storeId);
          if (nextStores.length === 0) {
            nextStores = ['all'];
          }
        } else {
          nextStores.push(storeId);
        }
      }
      setSelectedStores(nextStores);
    }
  };

  const handleTrackClick = (productId, productName) => {
    onTrackToggle(productId);
    const isCurrentlyTracked = trackedProductIds.includes(productId);
    if (!isCurrentlyTracked) {
      showSnackbar(`Tracking enabled for ${productName}`);
    } else {
      showSnackbar(`Removed tracking for ${productName}`);
    }
  };

  // Rendered both inline on the home screen and pinned to the top of the
  // full-screen search view once active -- same controlled input/state
  // either way, just a plain helper (not a nested component) so re-renders
  // on every keystroke don't remount the <input> and steal focus.
  // `isFullScreen` (distinct from `autoFocus`, even though today both call
  // sites happen to pass the same boolean) swaps the trailing icon: the
  // scan-barcode button only makes sense on the home bar, and the
  // full-screen bar gets a close button in its place instead.
  const renderSearchBar = (autoFocus, isFullScreen) => (
    <form
      onSubmit={handleSearchFormSubmit}
      className={`flex items-center rounded-full transition-all ${
        isFullScreen
          ? 'bg-ink-50 pl-5 pr-2 py-2 focus-within:ring-2 focus-within:ring-ink-200'
          : 'bg-white pl-5 pr-2 py-2.5 border border-stone-300 focus-within:ring-2 focus-within:ring-ink-200'
      }`}
    >
      <Search className={`w-5 h-5 mr-3 flex-shrink-0 ${isFullScreen ? 'text-stone-400' : 'text-stone-400'}`} />
      <input
        id="search-input"
        autoFocus={autoFocus}
        className={`bg-transparent border-none focus:outline-none w-full text-sm font-medium font-sans h-10 ${
          isFullScreen ? 'text-stone-500 placeholder:text-stone-400' : 'text-stone-500 placeholder:text-stone-400'
        }`}
        placeholder="Search for supermarket products"
        type="text"
        value={searchInputValue}
        onChange={handleSearchInputChange}
        onFocus={() => setIsSearchActive(true)}
        enterKeyHint="search"
      />
      {searchInputValue && (
        <button
          onClick={handleClearSearchText}
          id="clear-search-btn"
          title="Clear search"
          aria-label="Clear search"

        const isDealDodgy = (p) => (p.currentDeals || []).some((d) => d.dealType === 'Dodgy Deal');

          return sorted;
