// Real barcode/OCR recognition isn't feasible in a static prototype, so this
// no longer fabricates a scan result. It captures a photo (via the device's
// real camera, using a file input with capture="environment" -- the
// standard way a web page triggers the native camera app rather than a
// canvas/getUserMedia live-preview) or an uploaded photo, then hands the
// user off to the real search flow (which does run the genuine dodgy/fair/
// real-saver classifier against the live database) to look the item up.
function ScannerModal({ isOpen, onClose, onSearchForItem }) {
  const [capturedImage, setCapturedImage] = useState(null);
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);

  const handleImageSelected = (event) => {
    const file = event.target.files?.[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => setCapturedImage(reader.result);
      reader.readAsDataURL(file);
    }
    // Reset so choosing the same file again still fires onChange.
    event.target.value = '';
  };

  const handleRetake = () => setCapturedImage(null);

  const handleClose = () => {
    setCapturedImage(null);
    onClose();
  };

  const handleSearchForItem = () => {
    setCapturedImage(null);
    onClose();
    onSearchForItem && onSearchForItem();
  };

  return (
    <AnimatePresence>
      {isOpen && (
        <>
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            onClick={handleClose}
            className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"
          />

          <motion.div
            initial={{ y: '100%', opacity: 0.5 }}
            animate={{ y: 0, opacity: 1 }}
            exit={{ y: '100%', opacity: 0.5 }}
            transition={{ type: 'spring', damping: 25, stiffness: 220 }}
            className="fixed bottom-0 left-0 right-0 max-w-md mx-auto w-full bg-white rounded-t-3xl shadow-2xl z-[51] max-h-[92dvh] flex flex-col overflow-hidden border-t border-x border-slate-200"
          >
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200">
              <div className="flex items-center gap-3">
                <div className="w-5 h-5 bg-indigo-600 rounded-[2px] transform rotate-45 flex items-center justify-center shadow-md">
                  <Camera className="w-3 h-3 text-white transform -rotate-45" />
                </div>
                <h3 className="font-bold text-base text-slate-900 uppercase tracking-wider font-display">Price Tag Scanner</h3>
              </div>
              <button
                onClick={handleClose}
                className="p-1 rounded-full hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {!capturedImage && (
                <div className="space-y-4">
                  <p className="text-xs text-slate-500 leading-relaxed font-medium">
                    Point your camera at a shelf price tag or barcode to check it in-store, or upload a photo you've already taken.
                  </p>

                  <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    ref={cameraInputRef}
                    onChange={handleImageSelected}
                    className="hidden"
                  />
                  <button
                    onClick={() => cameraInputRef.current?.click()}
                    className="w-full py-8 border-2 border-dashed border-indigo-200 bg-indigo-50/30 hover:bg-indigo-50 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all cursor-pointer"
                  >
                    <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-md">
                      <Camera className="w-6 h-6 text-white" />
                    </div>
                    <p className="text-xs font-bold text-slate-800 uppercase tracking-wider">Scan Barcode</p>
                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Opens your camera</p>
                  </button>

                  <div className="flex items-center my-4">
                    <div className="flex-grow border-t border-slate-200" />
                    <span className="text-[9px] font-black text-slate-400 mx-3 uppercase tracking-widest">Or</span>
                    <div className="flex-grow border-t border-slate-200" />
                  </div>

                  <input
                    type="file"
                    accept="image/*"
                    ref={galleryInputRef}
                    onChange={handleImageSelected}
                    className="hidden"
                  />
                  <button
                    onClick={() => galleryInputRef.current?.click()}
                    className="w-full py-6 border-2 border-dashed border-slate-300 hover:border-slate-400 hover:bg-slate-50 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all cursor-pointer"
                  >
                    <Upload className="w-8 h-8 text-slate-400" />
                    <p className="text-xs font-bold text-slate-800 uppercase tracking-wider">Upload Photo</p>
                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Supports JPG, PNG, WEBP</p>
                  </button>
                </div>
              )}

              {capturedImage && (
                <div className="space-y-6">
                  <div className="w-full aspect-square rounded-2xl overflow-hidden border border-slate-200 bg-slate-50">
                    <img
                      src={capturedImage}
                      alt="Captured price tag"
                      className="w-full h-full object-cover"
                    />
                  </div>
                  <p className="text-xs text-slate-500 leading-relaxed font-medium text-center">
                    Now search for this item to see its real price history and whether the current price is a genuine deal.
                  </p>
                </div>
              )}
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-200 flex gap-3">
              {capturedImage ? (
                <>
                  <button
                    onClick={handleRetake}
                    className="flex-1 border border-slate-200 py-3 px-4 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-slate-100 transition-colors cursor-pointer"
                  >
                    Retake
                  </button>
                  <button
                    onClick={handleSearchForItem}
                    className="flex-1 bg-slate-900 hover:bg-indigo-600 text-white py-3 px-4 rounded-xl text-xs font-black uppercase tracking-widest shadow-md cursor-pointer"
                  >
                    Search for This Item
                  </button>
                </>
              ) : (
                <button
                  onClick={handleClose}
                  className="flex-1 border border-slate-200 py-3 px-4 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-slate-100 transition-colors cursor-pointer"
                >
                  Cancel
                </button>
              )}
            </div>
          </motion.div>
        </>
      )}
    </AnimatePresence>
  );
}

/* ===================== components/ManageAccountTab.tsx ===================== */

function ManageAccountTab({ onBackToSearch, onLogout, showSnackbar }) {
  const [name, setName] = useState('');
  const [ageGroup, setAgeGroup] = useState('');
  const [zipCode, setZipCode] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmNewPassword, setConfirmNewPassword] = useState('');

  const [isNameEditable, setIsNameEditable] = useState(false);
  const [originalName, setOriginalName] = useState('');
  const [isAgeGroupEditable, setIsAgeGroupEditable] = useState(false);
  const [originalAgeGroup, setOriginalAgeGroup] = useState('');
  const [isZipCodeEditable, setIsZipCodeEditable] = useState(false);
  const [originalZipCode, setOriginalZipCode] = useState('');
  const [isEmailEditable, setIsEmailEditable] = useState(false);
  const [originalEmail, setOriginalEmail] = useState('');
  const [isPasswordEditable, setIsPasswordEditable] = useState(false);

  const [showExistingPassword, setShowExistingPassword] = useState(false);
  const [showNewPassword, setShowNewPassword] = useState(false);
  const [showConfirmNewPassword, setShowConfirmNewPassword] = useState(false);

  const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
  const [isPasswordSaved, setIsPasswordSaved] = useState(false);
  const [accountType, setAccountType] = useState('free');

  const [isPaymentFormOpen, setIsPaymentFormOpen] = useState(false);
  const [cardName, setCardName] = useState('');
  const [cardNumber, setCardNumber] = useState('');
  const [cardExpiry, setCardExpiry] = useState('');
  const [cardCvc, setCardCvc] = useState('');
  const [isPaying, setIsPaying] = useState(false);
  const [paymentErrors, setPaymentErrors] = useState({});

  useEffect(() => {
    setName(localStorage.getItem('user_name') || 'John Doe');
    setAgeGroup(localStorage.getItem('user_ageGroup') || '25-34');
    setZipCode(localStorage.getItem('user_zipCode') || '6011');
    setEmail(localStorage.getItem('user_email') || 'john@example.com');
    setAccountType(localStorage.getItem('user_accountType') || 'free');
    const pass = localStorage.getItem('user_password') || 'password123';
    setPassword(pass);
    setNewPassword('');
    setConfirmNewPassword('');
  }, []);

  const handleConfirmPasswordChange = (e) => {
    e.preventDefault();
    if (!newPassword) {
      showSnackbar('Please enter your new password');
      return;
    }
    if (newPassword !== confirmNewPassword) {
      showSnackbar('New passwords do not match');
      return;
    }

    localStorage.setItem('user_password', newPassword);
    setPassword(newPassword);
    setNewPassword('');
    setConfirmNewPassword('');

    setIsPasswordSaved(true);
    setIsPasswordEditable(false);
    showSnackbar('Password updated successfully');

    setTimeout(() => {
      setIsPasswordSaved(false);
    }, 4000);
  };

  const handleAccountTypeChange = (type) => {
    if (accountType === type) return;
    if (type === 'free') {
      localStorage.setItem('user_accountType', 'free');
      setAccountType('free');
      setIsPaymentFormOpen(false);
      showSnackbar('Successfully switched to Free account.');
    } else {
      setIsPaymentFormOpen(true);
    }
  };

  const handleCardNumberChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    const formatted = value.match(/.{1,4}/g)?.join(' ') || value;
    setCardNumber(formatted.substring(0, 19));
  };

  const handleCardExpiryChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    let formatted = value;
    if (value.length > 2) {
      formatted = `${value.substring(0, 2)}/${value.substring(2, 4)}`;
    }
    setCardExpiry(formatted.substring(0, 5));
  };

  const handleCardCvcChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    setCardCvc(value.substring(0, 4));
  };

  const handleSubmitPayment = (e) => {
    e.preventDefault();
    const errors = {};
    if (!cardName.trim()) {
      errors.cardName = 'Cardholder name is required';
    }

    const cleanNum = cardNumber.replace(/\s+/g, '');
    if (!cleanNum) {
      errors.cardNumber = 'Card number is required';
    } else if (!/^\d{16}$/.test(cleanNum)) {
      errors.cardNumber = 'Card number must be 16 digits';
    }

    if (!cardExpiry) {
      errors.cardExpiry = 'Expiry date is required';
    } else if (!/^(0[1-9]|1[0-2])\/[0-9]{2}$/.test(cardExpiry)) {
      errors.cardExpiry = 'Must be MM/YY';
    }

    if (!cardCvc) {
      errors.cardCvc = 'CVC is required';
    } else if (!/^\d{3,4}$/.test(cardCvc)) {
      errors.cardCvc = 'CVC must be 3 or 4 digits';
    }

    if (Object.keys(errors).length > 0) {
      setPaymentErrors(errors);
      return;
    }

    setPaymentErrors({});
    setIsPaying(true);

    setTimeout(() => {
      localStorage.setItem('user_accountType', 'paid');
      setAccountType('paid');
      setIsPaying(false);
      setIsPaymentFormOpen(false);
      setCardName('');
      setCardNumber('');
      setCardExpiry('');
      setCardCvc('');
      showSnackbar('Successfully upgraded to Paid account! Enjoy unlimited list tracking and instant alerts.');
    }, 1500);
  };

  const handleCancelAccount = () => {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('user_name');
    localStorage.removeItem('user_ageGroup');
    localStorage.removeItem('user_zipCode');
    localStorage.removeItem('user_email');
    localStorage.removeItem('user_password');

    setIsConfirmModalOpen(false);
    showSnackbar('Your account has been cancelled.');
    onLogout();
  };

  return (
    <div className="space-y-6 animate-fadeIn pb-24 max-w-md mx-auto px-1">
      <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
        <div className="space-y-1 pb-1">
          <h3 className="text-sm font-black text-slate-900 uppercase tracking-wider">
            Personal Info
          </h3>
          <p className="text-[11px] text-slate-500 font-semibold leading-normal">
            Manage your profile details and preferences.
          </p>
        </div>

        <div className="space-y-1.5">
          <div className="flex items-center justify-between">
            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <User className="w-3.5 h-3.5 text-slate-400" />
              Full Name
            </label>
            <button
              type="button"
              onClick={() => {
                if (isNameEditable) {
                  setName(originalName);
                  setIsNameEditable(false);
                } else {
                  setOriginalName(name);
                  setIsNameEditable(true);
                }
              }}
              className={`text-[10px] font-black uppercase tracking-wider transition-colors cursor-pointer flex items-center gap-1 ${
                isNameEditable ? 'text-rose-500 hover:text-rose-700' : 'text-indigo-600 hover:text-indigo-800'
              }`}
            >
              {isNameEditable ? (
                <>
                  <X className="w-2.5 h-2.5" />
                  cancel
                </>
              ) : (
                <>
                  <Edit2 className="w-2.5 h-2.5" />
                  edit
                </>
              )}
            </button>
          </div>
          <input
            type="text"
            required
            disabled={!isNameEditable}
            placeholder="John Doe"
            value={name}
            onChange={(e) => setName(e.target.value)}
            className={`w-full px-4 py-3 border rounded-xl text-xs font-bold transition-all ${
              isNameEditable
                ? 'border-slate-200 text-slate-800 bg-slate-50/50 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600'
                : 'border-slate-100 bg-slate-100/30 text-slate-400 cursor-not-allowed select-none'
            }`}
          />
          {isNameEditable && (
            <button
              type="button"
              onClick={() => {
                const trimmed = name.trim();
                if (!trimmed) {
                  showSnackbar('Name cannot be empty');
                  return;
                }
                localStorage.setItem('user_name', trimmed);
                setName(trimmed);
                setIsNameEditable(false);
                showSnackbar('Full name updated successfully');
              }}
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-1.5 shadow-xs border border-indigo-600 mt-2"
            >
              <Check className="w-3.5 h-3.5 stroke-[3]" />
              Confirm Name Change
            </button>
          )}
        </div>

        <div className="space-y-1.5">
          <div className="flex items-center justify-between">
            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <Calendar className="w-3.5 h-3.5 text-slate-400" />
              Age Group
            </label>
            <button
              type="button"
              onClick={() => {
                if (isAgeGroupEditable) {
                  setAgeGroup(originalAgeGroup);
                  setIsAgeGroupEditable(false);
                } else {
                  setOriginalAgeGroup(ageGroup);
                  setIsAgeGroupEditable(true);
                }
              }}
              className={`text-[10px] font-black uppercase tracking-wider transition-colors cursor-pointer flex items-center gap-1 ${
                isAgeGroupEditable ? 'text-rose-500 hover:text-rose-700' : 'text-indigo-600 hover:text-indigo-800'
              }`}
            >
              {isAgeGroupEditable ? (
                <>
                  <X className="w-2.5 h-2.5" />
                  cancel
                </>
              ) : (
                <>
                  <Edit2 className="w-2.5 h-2.5" />
                  edit
                </>
              )}
            </button>
          </div>
          <select
            required
            disabled={!isAgeGroupEditable}
            value={ageGroup}
            onChange={(e) => setAgeGroup(e.target.value)}
            className={`w-full px-4 py-3 border rounded-xl text-xs font-bold transition-all ${
              isAgeGroupEditable
                ? 'border-slate-200 text-slate-800 bg-slate-50/50 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 cursor-pointer'
                : 'border-slate-100 bg-slate-100/30 text-slate-400 cursor-not-allowed select-none appearance-none'
            }`}
          >
            <option value="under-18">Under 18</option>
            <option value="18-24">18 - 24</option>
            <option value="25-34">25 - 34</option>
            <option value="35-44">35 - 44</option>
            <option value="45-54">45 - 54</option>
            <option value="55-64">55 - 64</option>
            <option value="65-plus">65 or older</option>
          </select>
          {isAgeGroupEditable && (
            <button
              type="button"
              onClick={() => {
                localStorage.setItem('user_ageGroup', ageGroup);
                setIsAgeGroupEditable(false);
                showSnackbar('Age group updated successfully');
              }}
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-1.5 shadow-xs border border-indigo-600 mt-2"
            >
              <Check className="w-3.5 h-3.5 stroke-[3]" />
              Confirm Age Group Change
            </button>
          )}
        </div>

        <div className="space-y-1.5 font-sans">
          <div className="flex items-center justify-between">
            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <MapPin className="w-3.5 h-3.5 text-slate-400" />
              NZ ZIP Code
            </label>
            <button
              type="button"
              onClick={() => {
                if (isZipCodeEditable) {
                  setZipCode(originalZipCode);
                  setIsZipCodeEditable(false);
                } else {
                  setOriginalZipCode(zipCode);
                  setIsZipCodeEditable(true);
                }
              }}
              className={`text-[10px] font-black uppercase tracking-wider transition-colors cursor-pointer flex items-center gap-1 ${
                isZipCodeEditable ? 'text-rose-500 hover:text-rose-700' : 'text-indigo-600 hover:text-indigo-800'
              }`}
            >
              {isZipCodeEditable ? (
                <>
                  <X className="w-2.5 h-2.5" />
                  cancel
                </>
              ) : (
                <>
                  <Edit2 className="w-2.5 h-2.5" />
                  edit
                </>
              )}
            </button>
          </div>
          <input
            type="text"
            required
            disabled={!isZipCodeEditable}
            pattern="[0-9]{4}"
            maxLength={4}
            placeholder="e.g. 6011"
            value={zipCode}
            onChange={(e) => setZipCode(e.target.value.replace(/\D/g, ''))}
            className={`w-full px-4 py-3 border rounded-xl text-xs font-bold transition-all ${
              isZipCodeEditable
                ? 'border-slate-200 text-slate-800 bg-slate-50/50 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600'
                : 'border-slate-100 bg-slate-100/30 text-slate-400 cursor-not-allowed select-none'
            }`}
          />
          {isZipCodeEditable && (
            <button
              type="button"
              onClick={() => {
                if (!/^\d{4}$/.test(zipCode)) {
                  showSnackbar('ZIP code must be exactly 4 digits');
                  return;
                }
                localStorage.setItem('user_zipCode', zipCode);
                setIsZipCodeEditable(false);
                showSnackbar('ZIP code updated successfully');
              }}
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-1.5 shadow-xs border border-indigo-600 mt-2"
            >
              <Check className="w-3.5 h-3.5 stroke-[3]" />
              Confirm ZIP Code Change
            </button>
          )}
        </div>

        <div className="space-y-1.5">
          <div className="flex items-center justify-between">
            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <Mail className="w-3.5 h-3.5 text-slate-400" />
              Email Address
            </label>
            <button
              type="button"
              onClick={() => {
                if (isEmailEditable) {
                  setEmail(originalEmail);
                  setIsEmailEditable(false);
                } else {
                  setOriginalEmail(email);
                  setIsEmailEditable(true);
                }
              }}
              className={`text-[10px] font-black uppercase tracking-wider transition-colors cursor-pointer flex items-center gap-1 ${
                isEmailEditable ? 'text-rose-500 hover:text-rose-700' : 'text-indigo-600 hover:text-indigo-800'
              }`}
            >
              {isEmailEditable ? (
                <>
                  <X className="w-2.5 h-2.5" />
                  cancel
                </>
              ) : (
                <>
                  <Edit2 className="w-2.5 h-2.5" />
                  edit
                </>
              )}
            </button>
          </div>
          <input
            type="email"
            required
            disabled={!isEmailEditable}
            placeholder="name@example.com"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            className={`w-full px-4 py-3 border rounded-xl text-xs font-bold transition-all ${
              isEmailEditable
                ? 'border-slate-200 text-slate-800 bg-slate-50/50 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600'
                : 'border-slate-100 bg-slate-100/30 text-slate-400 cursor-not-allowed select-none'
            }`}
          />
          {isEmailEditable && (
            <button
              type="button"
              onClick={() => {
                const trimmed = email.trim();
                if (!trimmed || !trimmed.includes('@')) {
                  showSnackbar('Please enter a valid email address');
                  return;
                }
                localStorage.setItem('user_email', trimmed);
                setEmail(trimmed);
                setIsEmailEditable(false);
                showSnackbar('Email address updated successfully');
              }}
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-1.5 shadow-xs border border-indigo-600 mt-2"
            >
              <Check className="w-3.5 h-3.5 stroke-[3]" />
              Confirm Email Change
            </button>
          )}
        </div>

        {!isPasswordEditable ? (
          <div className="space-y-1.5">
            <div className="flex items-center justify-between">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                <Lock className="w-3.5 h-3.5 text-slate-400" />
                Password
                {isPasswordSaved && (
                  <span className="text-emerald-600 font-black ml-2 px-2 py-0.5 bg-emerald-50 border border-emerald-100 rounded-full text-[9px] uppercase tracking-wider animate-pulse flex items-center gap-1">
                    <Check className="w-2.5 h-2.5 stroke-[3]" />
                    Changed!
                  </span>
                )}
              </label>
              <button
                type="button"
                onClick={() => {
                  setIsPasswordEditable(true);
                  setNewPassword('');
                  setConfirmNewPassword('');
                }}
                className="text-[10px] font-black uppercase tracking-wider text-indigo-600 hover:text-indigo-800 transition-colors cursor-pointer flex items-center gap-1"
              >
                <Edit2 className="w-2.5 h-2.5" />
                edit
              </button>
            </div>
            <div className="relative">
              <input
                type="password"
                disabled
                value="••••••••"
                className="w-full pl-4 pr-10 py-3 border border-slate-100 bg-slate-100/30 text-slate-400 cursor-not-allowed select-none rounded-xl text-xs font-bold"
              />
            </div>
          </div>
        ) : (
          <div className="space-y-4 border border-slate-100 rounded-2xl p-4 bg-slate-50/40">
            <div className="flex items-center justify-between">
              <span className="text-[10px] font-black text-indigo-600 uppercase tracking-widest flex items-center gap-1.5">
                <Lock className="w-3.5 h-3.5 text-indigo-600" />
                Change Password
              </span>
              <button
                type="button"
                onClick={() => {
                  setIsPasswordEditable(false);
                  setNewPassword('');
                  setConfirmNewPassword('');
                }}
                className="text-[10px] font-black uppercase tracking-wider text-rose-500 hover:text-rose-700 transition-colors cursor-pointer"
              >
                cancel
              </button>
            </div>

            <div className="space-y-1.5">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                Existing Password
              </label>
              <div className="relative">
                <input
                  type={showExistingPassword ? "text" : "password"}
                  readOnly
                  value={password}
                  className="w-full pl-4 pr-10 py-3 border border-slate-100 bg-slate-100/50 text-slate-500 cursor-not-allowed select-none rounded-xl text-xs font-bold"
                />
                <button
                  type="button"
                  onClick={() => setShowExistingPassword(!showExistingPassword)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer p-1"
                  title={showExistingPassword ? "Hide password" : "Show password"}
                >
                  {showExistingPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                </button>
              </div>
            </div>

            <div className="space-y-1.5">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                Type New Password
              </label>
              <div className="relative">
                <input
                  type={showNewPassword ? "text" : "password"}
                  required
                  placeholder="Type new password"
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                  className="w-full pl-4 pr-10 py-3 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 bg-slate-50/50 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all"
                />
                <button
                  type="button"
                  onClick={() => setShowNewPassword(!showNewPassword)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer p-1"
                  title={showNewPassword ? "Hide password" : "Show password"}
                >
                  {showNewPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                </button>
              </div>
            </div>

            <div className="space-y-1.5">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                Confirm New Password
              </label>
              <div className="relative">
                <input
                  type={showConfirmNewPassword ? "text" : "password"}
                  required
                  placeholder="Confirm new password"
                  value={confirmNewPassword}
                  onChange={(e) => setConfirmNewPassword(e.target.value)}
                  className="w-full pl-4 pr-10 py-3 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 bg-slate-50/50 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all"
                />
                <button
                  type="button"
                  onClick={() => setShowConfirmNewPassword(!showConfirmNewPassword)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer p-1"
                  title={showConfirmNewPassword ? "Hide password" : "Show password"}
                >
                  {showConfirmNewPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                </button>
              </div>
            </div>

            <button
              type="button"
              onClick={handleConfirmPasswordChange}
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all cursor-pointer flex items-center justify-center gap-1.5 mt-2 shadow-xs border border-indigo-600"
            >
              <Check className="w-3.5 h-3.5 stroke-[3]" />
              Confirm Password Change
            </button>
          </div>
        )}
      </div>

      <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
        <div className="space-y-1">
          <h3 className="text-sm font-black text-slate-900 uppercase tracking-wider">
            Account Plan
          </h3>
          <p className="text-[11px] text-slate-500 font-semibold leading-normal">
            Choose between our plans to maximize your weekly grocery savings.
          </p>
        </div>

        <div className="grid grid-cols-1 gap-4 pt-2">
          <div
            onClick={() => handleAccountTypeChange('free')}
            className={`border rounded-2xl p-5 transition-all duration-200 cursor-pointer relative flex flex-col justify-between ${
              accountType === 'free'
                ? 'border-slate-900 bg-slate-950 text-white shadow-md'
                : 'border-slate-200 bg-white text-slate-800 hover:border-slate-300'
            }`}
          >
            {accountType === 'free' && (
              <span className="absolute top-4 right-4 bg-indigo-600 text-white text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full">
                Active Plan
              </span>
            )}
            <div className="space-y-3">
              <div>
                <h4 className="font-extrabold text-sm uppercase tracking-wider">Free Account</h4>
                <p className={`text-[10px] ${accountType === 'free' ? 'text-slate-400' : 'text-slate-500'} font-semibold mt-0.5`}>
                  Essential features for casual shopping
                </p>
              </div>
              <div className="text-2xl font-black tracking-tight flex items-baseline gap-1">
                <span>$0</span>
                <span className={`text-[10px] font-bold ${accountType === 'free' ? 'text-slate-400' : 'text-slate-500'}`}>/forever</span>
              </div>
              <ul className="space-y-2 pt-3 border-t border-slate-200/10 text-[10px] font-bold">
                <li className="flex items-center gap-2">
                  <Check className={`w-3.5 h-3.5 flex-shrink-0 ${accountType === 'free' ? 'text-emerald-400' : 'text-emerald-600'}`} />
                  <span>Scan and search products</span>
                </li>
                <li className="flex items-center gap-2">

  },

};

function SettingsTab({ onBack, showSnackbar }) {
  const [initialBranches, setInitialBranches] = useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
            const val = parsed[brand];
            if (Array.isArray(val)) {
              loaded[brand] = val.length > 0 ? val[0] : BRANCHES_BY_BRAND[brand][0];
            } else if (typeof val === 'string' && val) {
              loaded[brand] = val;
            } else {
              loaded[brand] = BRANCHES_BY_BRAND[brand][0];
            }
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    const defaults = {};
    Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
      defaults[brand] = BRANCHES_BY_BRAND[brand][0];
    });
    return defaults;
  });

  const [selectedBranches, setSelectedBranches] = useState(() => ({ ...initialBranches }));

  const [flashingBrands, setFlashingBrands] = useState({});

  const [activeChangeBrand, setActiveChangeBrand] = useState(null);

  const [brandSearchQueries, setBrandSearchQueries] = useState({
    'Woolworths': '',
    "PAK'nSAVE": '',
    'New World': '',
    'Four Square': '',
    'FreshChoice': ''
  });

  const inputRef = useRef(null);

  useEffect(() => {
    if (activeChangeBrand && inputRef.current) {
      inputRef.current.focus();
    }
  }, [activeChangeBrand]);

  const handleSelectStore = (brand, branch) => {
    setSelectedBranches(prev => ({
      ...prev,
      [brand]: branch
    }));

    setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }));
    setActiveChangeBrand(null);
  };

  const handleResetDefaults = () => {
    const defaults = {};
    Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
      defaults[brand] = BRANCHES_BY_BRAND[brand][0];
    });
    setSelectedBranches(defaults);
    setBrandSearchQueries({
      'Woolworths': '',
      "PAK'nSAVE": '',
      'New World': '',
      'Four Square': '',
      'FreshChoice': ''
    });
    setActiveChangeBrand(null);
  };

  const isModified = Object.keys(BRANCHES_BY_BRAND).some(
    brand => selectedBranches[brand] !== initialBranches[brand]
  );

  return (
    <div className="space-y-6 animate-fadeIn pb-24 max-w-md mx-auto px-1">
      <div className="px-1 py-1 space-y-1.5">
        <h2 className="text-xl font-black tracking-tight text-slate-900 uppercase font-display">
          Personalise your experience
        </h2>
        <p className="text-xs text-slate-500 leading-relaxed font-medium">
          Select which specific store for each supermarket you want to search deals at. By default, you have been assigned to the ones closest to the zip code you provided when creating your account.
        </p>
      </div>

      <div className="space-y-4">
        {Object.keys(BRANCHES_BY_BRAND).map((brand) => {
          const selectedStore = selectedBranches[brand];
          const query = brandSearchQueries[brand] || '';
          const isChanging = activeChangeBrand === brand;

          const matches = BRANCHES_BY_BRAND[brand].filter(branch =>
            branch.toLowerCase().includes(query.toLowerCase())
          );

          const meta = BRAND_METADATA[brand] || { bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-100', accent: 'indigo' };

          return (
            <div
              key={brand}
              className={`bg-white border rounded-3xl p-5 shadow-xs space-y-4 relative transition-all duration-700 ${
                flashingBrands[brand]
                  ? 'border-indigo-500 bg-indigo-50/25 ring-4 ring-indigo-500/15 scale-[1.015] shadow-md z-10'
                  : 'border-slate-200 bg-white'
              }`}
            >
              <div className="flex justify-between items-center pb-2.5 border-b border-slate-100">
                <div className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider ${meta.bg} ${meta.text} border ${meta.border} flex items-center gap-1.5`}>
                  <Store className="w-3 h-3" />
                  {brand}
                </div>
              </div>

              {!isChanging ? (
                <div className="flex items-center justify-between p-3.5 bg-indigo-50/20 border border-indigo-100/60 rounded-2xl animate-fadeIn">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className="p-2 bg-indigo-600 text-white rounded-xl flex-shrink-0">
                      <MapPin className="w-4 h-4 stroke-[2.5]" />
                    </div>
                    <div className="min-w-0">
                      <p className="text-[9px] text-indigo-600 font-black uppercase tracking-wider">Selected Store</p>
                      <h4 className="text-xs font-black text-slate-800 truncate">{selectedStore || 'None Selected'}</h4>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setActiveChangeBrand(brand);
                      setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }));
                    }}
                    className="flex items-center gap-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-[10px] uppercase tracking-wider rounded-lg transition-colors cursor-pointer shadow-3xs flex-shrink-0"
                  >
                    <Edit2 className="w-3 h-3" />
                    <span>Change</span>
                  </button>
                </div>
              ) : (
                <div className="space-y-3 animate-fadeIn">
                  <div className="space-y-1.5 relative">
                    <div className="flex justify-between items-center">
                      <label className="text-[9px] font-black uppercase tracking-widest text-indigo-600 block">
                        Search and change {brand} branch
                      </label>
                      <button
                        type="button"
                        onClick={() => setActiveChangeBrand(null)}
                        className="text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-600 cursor-pointer flex items-center gap-0.5"
                      >
                        <X className="w-3 h-3" />
                        Cancel
                      </button>
                    </div>
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <Search className="w-3.5 h-3.5" />
                      </span>
                      <input
                        ref={inputRef}
                        type="text"
                        placeholder={`Type location (e.g. CBD, Eden, Wellington)...`}
                        value={query}
                        onChange={(e) => setBrandSearchQueries(prev => ({ ...prev, [brand]: e.target.value }))}
                        className="w-full pl-9 pr-9 py-2.5 bg-slate-50 focus:bg-white border border-indigo-500 rounded-xl text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-hidden focus:ring-1 focus:ring-indigo-600 transition-all shadow-3xs"
                      />
                      {query && (
                        <button
                          type="button"
                          onClick={() => setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }))}
                          className="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer"
                        >
                          <X className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="border border-slate-150 rounded-2xl overflow-hidden bg-white shadow-md divide-y divide-slate-100 max-h-48 overflow-y-auto">
                    <div className="px-3.5 py-1.5 bg-slate-50 text-[9px] font-black uppercase tracking-wider text-slate-400">
                      Quick Results ({matches.length})
                    </div>
                    {matches.length > 0 ? (
                      matches.map((branch) => {
                        const isCurrentSelection = selectedStore === branch;
                        return (
                          <button
                            key={branch}
                            type="button"
                            onClick={() => handleSelectStore(brand, branch)}
                            className={`w-full text-left px-3.5 py-2.5 text-xs font-bold transition-all duration-150 flex items-center justify-between cursor-pointer ${
                              isCurrentSelection
                                ? 'bg-indigo-50/50 text-indigo-700'
                                : 'hover:bg-slate-50/60 text-slate-600 hover:text-slate-900'
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              <MapPin className={`w-3.5 h-3.5 ${isCurrentSelection ? 'text-indigo-600' : 'text-slate-400'}`} />
                              <span>{branch}</span>
                            </div>
                            {isCurrentSelection && (
                              <span className="flex items-center gap-1 text-[9px] font-black text-indigo-600 uppercase tracking-widest bg-indigo-50 px-2 py-0.5 rounded-md">
                                <Check className="w-3 h-3 stroke-[3]" />
                                Active
                              </span>
                            )}
                          </button>
                        );
                      })
                    ) : (
                      <div className="px-3.5 py-4 text-center text-xs font-bold text-slate-400 flex flex-col items-center gap-1 bg-slate-50/30">
                        <Building2 className="w-5 h-5 text-slate-300" />
                        <span>No branches match "{query}"</span>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="pt-2">
        <button
          disabled={!isModified}
          onClick={() => {
            const modifiedBrands = {};
            Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
              if (selectedBranches[brand] !== initialBranches[brand]) {
                modifiedBrands[brand] = true;
              }
            });

            localStorage.setItem('user_selected_branches', JSON.stringify(selectedBranches));
            setInitialBranches({ ...selectedBranches });
            setFlashingBrands(modifiedBrands);

            setTimeout(() => {
              setFlashingBrands({});
            }, 1500);
          }}
          className={`w-full py-4 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2 font-display ${
            isModified
              ? 'bg-slate-900 hover:bg-indigo-600 text-white cursor-pointer shadow-md shadow-slate-200'
              : 'bg-slate-200 text-slate-400 cursor-not-allowed'
          }`}
        >
          Apply Changes
        </button>
      </div>
    </div>
  );
}

/* ===================== App.tsx ===================== */

function App() {
  // The live product loader streams results in page-by-page (see
  // loadLiveProducts's onUpdate callback in the boot sequence below) and
  // mutates the module-level `mockProducts` array directly rather than
  // holding it in React state, since ~30 places in this component already
  // read `mockProducts` as a plain closure variable. This tick is just a
  // signal to re-render after each page lands so those reads pick up the
  // new data; it carries no value of its own.
  const [, forceLiveProductsTick] = useState(0);
  useEffect(() => {
    const bump = () => forceLiveProductsTick((t) => t + 1);
    (window.__liveProductListeners = window.__liveProductListeners || []).push(bump);
    return () => {
      window.__liveProductListeners = (window.__liveProductListeners || []).filter((fn) => fn !== bump);
    };
  }, []);

  const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
  const [currentTab, setCurrentTab] = useState('search');
  const [previousTab, setPreviousTab] = useState('search');
  const [lastExternalTab, setLastExternalTab] = useState('search');
  const [selectedListId, setSelectedListId] = useState(null);
  const [lists, setLists] = useState(() => buildSeedLists(mockProducts));

  const activeList = lists.find(l => l.id === selectedListId) || lists[0];
  const trackedProductIds = activeList ? activeList.itemIds : [];
  const [isScannerOpen, setIsScannerOpen] = useState(false);
  const [isDealModalOpen, setIsDealModalOpen] = useState(false);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [selectedStore, setSelectedStore] = useState(null);
  const [snackbarMessage, setSnackbarMessage] = useState(null);
  const [listSelectorProduct, setListSelectorProduct] = useState(null);

  const [searchInputValue, setSearchInputValue] = useState('');
  const [activeSearchQuery, setActiveSearchQuery] = useState('');
  const [selectedStores, setSelectedStores] = useState(['all']);
  const [sortBy, setSortBy] = useState('cheapest');

  const [history, setHistory] = useState(() => buildSeedHistory(mockProducts));

  const [alerts, setAlerts] = useState(() => buildSeedAlerts(mockProducts));

  const showSnackbar = (message) => {
    // All floating feedback has been disabled across the entire application.
  };

  useEffect(() => {
    const isDropDownPage = currentTab === 'howitworks' || currentTab === 'manageaccount' || currentTab === 'settings';
    if (!isDropDownPage) {
      setLastExternalTab(currentTab);
    }
  }, [currentTab]);

  const handleTrackToggle = (productId) => {
    const product = mockProducts.find((p) => p.id === productId);
    if (product) {
      setListSelectorProduct(product);
    }
  };

  const renderListSelectorModal = () => {
    if (!listSelectorProduct) return null;
    return (
      <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div className="bg-white border border-slate-200 rounded-3xl max-w-xs w-full p-6 space-y-5 shadow-2xl animate-scaleUp">
          <div className="flex flex-col items-center text-center space-y-3">
            <div className="w-12 h-12 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
              <Bookmark className="w-6 h-6 stroke-[2]" />
            </div>
            <div className="space-y-1">
              <h3 className="text-lg font-black text-slate-900 tracking-tight uppercase">
                Add to Lists
              </h3>
              <p className="text-xs text-slate-500 font-medium leading-relaxed">
                Select lists for <span className="font-extrabold text-slate-800">{listSelectorProduct.name}</span>. You can select more than one list.
              </p>
            </div>
          </div>

          <div className="space-y-2 max-h-48 overflow-y-auto py-1 pr-1">
            {lists.map((list) => {
              const isInList = list.itemIds.includes(listSelectorProduct.id);
              return (
                <button
                  key={list.id}
                  onClick={() => {
                    setLists((prevLists) =>
                      prevLists.map((l) => {
                        if (l.id === list.id) {
                          const itemIds = isInList
                            ? l.itemIds.filter((id) => id !== listSelectorProduct.id)
                            : [...l.itemIds, listSelectorProduct.id];
                          return { ...l, itemIds };
                        }
                        return l;
                      })
                    );

                      isInList
                        ? `Removed from ${list.name}`
                        : `Added to ${list.name}`

                  }}

                    isInList
                      ? 'bg-indigo-50/50 border-indigo-200 text-indigo-950 font-extrabold'
                      : 'bg-white border-slate-200 text-slate-700 font-medium hover:bg-slate-50'
                  }`}
                >
                  <span className="text-xs uppercase tracking-wider">{list.name}</span>
                  <div className={`w-5 h-5 rounded-md border flex items-center justify-center transition-all ${
                    isInList
                      ? 'border-indigo-600 bg-indigo-600 text-white'
                      : 'border-slate-300 bg-white'
                  }`}>
                    {isInList && (
                      <svg className="w-3.5 h-3.5 stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </div>
                </button>
              );
            })}
          </div>

          <button
            onClick={() => setListSelectorProduct(null)}
            className="w-full bg-slate-900 hover:bg-indigo-600 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all cursor-pointer active:scale-95 shadow-md shadow-slate-200"
          >
            Done
          </button>
        </div>
      </div>
    );
  };

  const handleClearList = () => {
    const activeId = selectedListId || 'list-1';
    setLists((prevLists) =>
      prevLists.map((list) => (list.id === activeId ? { ...list, itemIds: [] } : list))
    );
    const activeListName = lists.find((l) => l.id === activeId)?.name || 'List';
    showSnackbar(`Cleared all items from ${activeListName}`);
  };

  const handleDeleteList = (listId) => {
    const listName = lists.find((l) => l.id === listId)?.name || 'List';
    setLists((prevLists) => prevLists.filter((list) => list.id !== listId));
    if (selectedListId === listId) {
      setSelectedListId(null);
    }
    showSnackbar(`Deleted ${listName} successfully`);
  };

  const handleResetLists = () => {
    setLists([
      { id: 'list-1', name: 'List 1', itemIds: ['avalanche-sachets-10pk', 'fresh-apples-1kg', 'cadbury-milk-110g'] },
      { id: 'list-2', name: 'List 2', itemIds: ['meadow-fresh-milk-2l', 'lurpak-butter-250g', 'fresh-apples-1kg'] },
      { id: 'list-3', name: 'List 3', itemIds: ['avalanche-sachets-10pk', 'meadow-fresh-milk-2l', 'lurpak-butter-250g', 'cadbury-milk-110g'] },
    ]);
    setSelectedListId(null);
    showSnackbar('Restored default lists');
  };

  const handleCreateList = (name) => {
    const newId = `list-${Date.now()}`;
    setLists((prev) => [...prev, { id: newId, name, itemIds: [] }]);
    showSnackbar(`Created list "${name}" successfully`);
  };

  const handleLogin = () => {
    localStorage.setItem('isLoggedIn', 'true');
    setIsLoggedIn(true);
    showSnackbar('Welcome to Dodgy Deal!');
  };

  const handleLogout = () => {
    localStorage.removeItem('isLoggedIn');
    setIsLoggedIn(false);
    showSnackbar('Logged out successfully');
  };

  const handleCheckDeal = (product, store) => {
    setSelectedProduct(product);
    setSelectedStore(store);
    setIsDealModalOpen(true);

    const alreadyLogged = history.some(h => h.productId === product.id && h.store === store);
    if (!alreadyLogged) {
      const deal = product.currentDeals.find(d => d.store === store);
      const newHistoryItem = {
        id: `hist-${Date.now()}`,
        productId: product.id,
        checkedAt: 'Just Now',
        store,
        price: deal ? deal.price : product.standardPrice,
        dealType: deal ? deal.dealType : 'Fair Price',
      };
      setHistory(prev => [newHistoryItem, ...prev]);
    }
  };

  const handleMarkAsRead = (id) => {
    setAlerts((prev) =>
      prev.map((alert) => (alert.id === id ? { ...alert, read: true } : alert))
    );
  };

  const handleClearAllAlerts = () => {
    setAlerts([]);
  };

  const stats = {
    totalChecked: history.length,
    realSavers: history.filter((h) => h.dealType === 'Real Saver' || h.dealType === 'Real Deal').length,
    dodgySpotted: history.filter((h) => h.dealType === 'Dodgy Deal').length,
    moneySaved: history.reduce((sum, h) => {
      const product = mockProducts.find((p) => p.id === h.productId);
      if (product) {
        const prices = [
          product.standardPrice,
          ...product.currentDeals.map((d) => d.price),
          ...product.currentDeals.map((d) => d.originalPrice),
          ...product.priceHistory.map((ph) => ph.price)
        ].filter((price) => typeof price === 'number' && price > 0);

        if (prices.length > 0) {
          const maxPrice = Math.max(...prices);
          const minPrice = Math.min(...prices);
          return sum + (maxPrice - minPrice);
        }
      }
      return sum;
    }, 0),
  };

  const getHeaderTitle = () => {
    switch (currentTab) {
      case 'search':
        return 'Dodgy Deal';
      case 'saved':
        return 'My List';
      case 'alerts':
        return 'Deal Warnings';
      case 'history':
        return 'All your checks';
      case 'profile':
        return 'Deal Stats';
      case 'howitworks':
        return 'How It Works';
      case 'manageaccount':
        return 'Manage Account';
      case 'settings':
        return 'Store Settings';
      default:
        return 'Dodgy Deal';
    }
  };

  if (!isLoggedIn) {
    return (
      <div className="bg-slate-100 min-h-screen w-full flex justify-center items-start overflow-y-auto">
        <div className="bg-slate-50 min-h-screen w-full max-w-md relative shadow-2xl border-x border-slate-200/80 flex flex-col justify-between">
          <LoginPage onLogin={handleLogin} />
        </div>
      </div>
    );
  }

  if (isDealModalOpen && selectedProduct && selectedStore) {
    return (
      <div className="bg-slate-100 min-h-screen w-full flex justify-center items-start overflow-y-auto">
        <div className="bg-slate-50 min-h-screen w-full max-w-md relative shadow-2xl border-x border-slate-200/80 flex flex-col">

                setActiveSearchQuery('');
                setCurrentTab('search');

            product={selectedProduct}
            dealStore={selectedStore}
            onTrackToggle={handleTrackToggle}
            isTracked={selectedProduct ? trackedProductIds.includes(selectedProduct.id) : false}
            trackedProductIds={trackedProductIds}
            onNavigateToSettings={() => {
              setIsDealModalOpen(false);
              setCurrentTab('settings');

            onNavigateToHowItWorks={() => {
              setIsDealModalOpen(false);
              setPreviousTab(currentTab);
              setCurrentTab('howitworks');

            onNavigateToManageAccount={() => {
              setIsDealModalOpen(false);
              setPreviousTab(currentTab);
              setCurrentTab('manageaccount');

            onLogout={() => {
              setIsDealModalOpen(false);

          onOpenSettings={() => {

            setCurrentTab('settings');
          }}
          onLogout={handleLogout}
        />

        <main className="w-full px-4 pt-4 flex-1">
          {currentTab === 'search' && (
            <SearchTab
              onCheckDeal={handleCheckDeal}
              onTrackToggle={handleTrackToggle}
              trackedProductIds={trackedProductIds}
              lists={lists}
              showSnackbar={showSnackbar}
              searchInputValue={searchInputValue}
              setSearchInputValue={setSearchInputValue}
              activeSearchQuery={activeSearchQuery}
              setActiveSearchQuery={setActiveSearchQuery}
              selectedStores={selectedStores}
              setSelectedStores={setSelectedStores}
              sortBy={sortBy}
              setSortBy={setSortBy}
              onNavigateToSettings={() => setCurrentTab('settings')}
              onOpenScanner={() => setIsScannerOpen(true)}
            />
          )}

          {currentTab === 'saved' && (
            <TrackedTab
              lists={lists}
              selectedListId={selectedListId}
              setSelectedListId={setSelectedListId}
              trackedProductIds={trackedProductIds}
              onTrackToggle={handleTrackToggle}
              onCheckDeal={handleCheckDeal}
              showSnackbar={showSnackbar}
              onClearList={handleClearList}
              onDeleteList={handleDeleteList}
              onResetLists={handleResetLists}
              onCreateList={handleCreateList}
            />
          )}

          {currentTab === 'alerts' && (
            <AlertsTab
              alerts={alerts}
              onMarkAsRead={handleMarkAsRead}
              onClearAll={handleClearAllAlerts}
              showSnackbar={showSnackbar}
            />
          )}

          {currentTab === 'history' && (
            <HistoryTab
              history={history}
              onRecheck={handleCheckDeal}
              onTrackToggle={handleTrackToggle}

              lists={lists}
              showSnackbar={showSnackbar}
            />
          )}

          {currentTab === 'profile' && (
            <ProfileTab stats={stats} history={history} />

          {currentTab === 'howitworks' && (
            <HowItWorksTab />

          {currentTab === 'manageaccount' && (
            <ManageAccountTab

          {currentTab === 'settings' && (
            <SettingsTab
              onBack={() => setCurrentTab(lastExternalTab)}
              showSnackbar={showSnackbar}
            />

        </main>

        <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 flex justify-around items-center px-4 py-2.5 bg-white border-t border-slate-200 shadow-md">

          <button
            onClick={() => setCurrentTab('search')}
            className={`flex flex-col items-center justify-center py-1 transition-all duration-150 active:scale-95 cursor-pointer ${
              currentTab === 'search'
                ? 'text-indigo-600'

          >
            <Search className="w-5 h-5" />
            <span className="text-[9px] font-bold uppercase tracking-[0.12em] mt-1">Check deals</span>
            <span className={`w-4 h-0.5 mt-0.5 rounded-full transition-all duration-200 ${currentTab === 'search' ? 'bg-indigo-600' : 'bg-transparent'}`} />
          </button>

          <button
            onClick={() => {

            className={`flex flex-col items-center justify-center py-1 transition-all duration-150 active:scale-95 cursor-pointer ${
              currentTab === 'saved'
                ? 'text-indigo-600'
                : 'text-slate-400 hover:text-slate-600'
            }`}
          >
            <Bookmark className="w-5 h-5" />
            <span className="text-[9px] font-bold uppercase tracking-[0.12em] mt-1">My List</span>
            <span className={`w-4 h-0.5 mt-0.5 rounded-full transition-all duration-200 ${currentTab === 'saved' ? 'bg-indigo-600' : 'bg-transparent'}`} />

          <button

          <button
            onClick={() => setCurrentTab('profile')}
            className={`flex flex-col items-center justify-center py-1 transition-all duration-150 active:scale-95 cursor-pointer ${
              currentTab === 'profile'
                ? 'text-indigo-600'
                : 'text-slate-400 hover:text-slate-600'
            }`}
          >
            <BarChart3 className="w-5 h-5" />
            <span className="text-[9px] font-bold uppercase tracking-[0.12em] mt-1">Deal stats</span>
            <span className={`w-4 h-0.5 mt-0.5 rounded-full transition-all duration-200 ${currentTab === 'profile' ? 'bg-indigo-600' : 'bg-transparent'}`} />
          </button>
        </nav>

        <ScannerModal
          isOpen={isScannerOpen}
          onClose={() => setIsScannerOpen(false)}
          onSearchForItem={() => setCurrentTab('search')}
        />
        {renderListSelectorModal()}
      </div>
    </div>
  );
}

/* ===================== boot ===================== */

(async () => {
  // loadLiveProducts streams results page by page instead of loading the
  // whole live catalogue before anything can render. We only block the
  // *first* render on the first page landing (or on the whole load
  // failing/finishing with nothing) -- every later page arrives via
  // onUpdate, mutates `mockProducts` in place, and pings whatever
  // `forceLiveProductsTick` listeners App() has registered so the already-
  // mounted UI picks up the new rows without a full remount.
  let resolveFirstPage;
  const firstPageReady = new Promise((resolve) => { resolveFirstPage = resolve; });
  let sawAnyPage = false;

  const finalLoad = loadLiveProducts((pageSoFar) => {
    mockProducts = pageSoFar;
    if (!sawAnyPage) {
      sawAnyPage = true;
      resolveFirstPage();
    }
    (window.__liveProductListeners || []).forEach((fn) => fn());
  }).catch((err) => {
    console.error('Live Supabase fetch failed, falling back to demo data:', err);
    return [];
  }).then((finalProducts) => {
    if (!sawAnyPage && !finalProducts.length) {
      console.warn('Supabase returned no usable current specials -- falling back to demo data.');
    }
    return finalProducts;
  });

  // Whichever comes first: the first page of real data, or the whole load
  // settling (covers both "zero current specials" and "fetch threw before
  // a single page completed") -- either way we stop blocking first render.
  await Promise.race([firstPageReady, finalLoad]);

  const root = createRoot(document.getElementById('root'));
  root.render(<App />);
})();
</script>

<script>
  const source = document.getElementById('app-source').textContent;
  const output = Babel.transform(source, {
    presets: [
      ["typescript", { isTSX: true, allExtensions: true }],
      ["react", { runtime: 'classic' }],
    ],
    filename: 'app.tsx',
  }).code;
  const blob = new Blob([output], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  import(url).catch((err) => {
    console.error(err);
    document.getElementById('root').innerHTML =
      '<pre style="padding:24px;color:#b91c1c;white-space:pre-wrap;font-family:monospace;">' +
      String(err && err.stack || err) + '</pre>';
  });
</script>
