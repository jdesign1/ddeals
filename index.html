  /* Design tokens ported from the "Dodgy Deal · Mobile UI Kit" Claude Design
     artifact (brand guide, 2026-08-04 session) -- Paper/Ink/Fair Green/Dodgy
     Yellow/Alert Red/Stone palette + Manrope/Inter type system. Ink/Fair/
     Dodgy/Alert are full 50-950 ramps built from the artifact's sampled base
     hex (ink-600, fair-500, dodgy-500, alert-500 are the exact sampled
     values); Paper and Stone are used as flat tokens since the reference
     only showed one shade of each. Tailwind's built-in `stone-*` scale
     (already a close warm-neutral match) is reused directly for the old
     `slate-*` neutral usages rather than redefined here. */

    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          display: ['Manrope', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          paper: '#faf8f4',
          /* Tailwind's built-in stone-* ramp (stone-50 #fafaf9 ... stone-900
             #1c1917) is reused as-is for the old slate-* neutral usages --
             already a close warm-grey match for the brand guide's Stone
             swatch (#eeeae1, ~stone-200) without needing an override here. */
          ink: {
            50: '#f6f5f3', 100: '#eae7e2', 200: '#d5d1c8', 300: '#b7b0a3',
            400: '#928a79', 500: '#6d6455', 600: '#171710', 700: '#141410',
            800: '#100f0c', 900: '#0c0b09', 950: '#060605',
          },
          fair: {
            50: '#f5fbf6', 100: '#d2efda', 200: '#b2e4bf', 300: '#96daa7',
            400: '#7dd193', 500: '#6ccb85', 600: '#56a26a', 700: '#4a8c5c',
            800: '#417a50', 900: '#386a45', 950: '#315b3c',
          },
          dodgy: {
            50: '#fdfbf4', 100: '#f6edcf', 200: '#f0e1ac', 300: '#ead58d',
            400: '#e5cc72', 500: '#e2c560', 600: '#b59d4d', 700: '#9c8842',
            800: '#88763a', 900: '#766732', 950: '#66592b',
          },
          alert: {
            50: '#fbf3f4', 100: '#edcbce', 200: '#e0a5ab', 300: '#d5848b',
            400: '#cb6770', 500: '#c4535d', 600: '#9d424a', 700: '#873940',

// PostgREST caps responses (commonly 1000 rows) regardless of ?limit=, so
// anything that can exceed that must be paged with the Range header.
//
// Fetches page 1 with `Prefer: count=exact` to learn the true row count
// from the `Content-Range` response header, then fires every remaining
// page in parallel rather than one-at-a-time. This matters now that
// `current_prices` is fetched WITHOUT the is_special filter (~12.7k rows,
// full catalogue, not just the ~4.4k on-special subset) -- measured
// 2026-07-10: ~6s sequential vs ~1.5s parallel for the full table.
async function fetchAllRows(path) {
  const page = 1000;
  const MAX_PAGES = 100; // safety cap: 100k rows

  const fetchPage = async (start, extraHeaders) => {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Range-Unit': 'items',
        Range: `${start}-${start + page - 1}`,
        ...extraHeaders,
      },
    });
    if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
    return res;
  };

  const firstRes = await fetchPage(0, { Prefer: 'count=exact' });
  const firstData = await firstRes.json();
  const contentRange = firstRes.headers.get('content-range'); // e.g. "0-999/12702"
  const total = contentRange && contentRange.includes('/') ? parseInt(contentRange.split('/')[1], 10) : NaN;

  if (!Number.isFinite(total) || firstData.length < page) {
    return firstData; // no exact count available, or that one page was everything
  }

  const remainingPages = Math.min(Math.ceil((total - page) / page), MAX_PAGES - 1);
  const restResponses = await Promise.all(
    Array.from({ length: remainingPages }, (_, i) => fetchPage(page * (i + 1)))
  );
  const restData = await Promise.all(restResponses.map((res) => res.json()));
  return firstData.concat(...restData);
}

// Batched `in.(...)` lookups -- PostgREST/URL length gets risky past a few
// hundred UUIDs in one query string, so chunk the id list. Chunks are
// independent lookups (order doesn't matter, only used to build maps
// afterwards) so they're fired in parallel -- with the is_special filter
// gone, a page's worth of match groups can span several hundred product
// ids (several chunks), and this used to run them one at a time.
async function fetchByIds(path, column, select, ids, chunkSize = 100) {
  const chunks = [];
  for (let i = 0; i < ids.length; i += chunkSize) {
    chunks.push(ids.slice(i, i + chunkSize));
  }
  const results = await Promise.all(
    chunks.map(async (chunk) => {
      const url = `${SUPABASE_URL}/rest/v1/${path}?select=${select}&${column}=in.(${chunk.join(',')})`;
      const res = await fetch(url, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      });
      if (!res.ok) throw new Error(`${path} in-lookup -> HTTP ${res.status}`);
      return res.json();
    })
  );
  return results.flat();
}

function median(nums) {
  if (!nums.length) return null;
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

const LOOKBACK_DAYS = 30;
const DODGY_THRESHOLD = 5;    // % pre-sale inflation to flag dodgy
const GENUINE_THRESHOLD = 10; // % saving to count as genuine
const MARGINAL_THRESHOLD = 3; // % saving floor for "marginal"
const DAY_MS = 24 * 60 * 60 * 1000;

// Classifies one (product_id, store_id) current special using its own
// price_history series. Mirrors dodgy_deals_view.sql exactly:
//   normal_price = median of pre-sale prices within the 30-day lookback
//   inflate_pct  = how much price was pumped in the 7 days before the sale
//   verdict: UNKNOWN (no history) / DODGY (fake markup) / GENUINE (>=10% off)
//            / MARGINAL (3-10% off, or nothing better established)
function classifySpecial(salePrice, historyRows) {
  const sorted = [...historyRows].sort((a, b) => new Date(a.scraped_at) - new Date(b.scraped_at));

  // Walk backwards while is_special=true to find when the current streak began.
  let saleStartedAt = null;
  for (let i = sorted.length - 1; i >= 0; i--) {
    if (sorted[i].is_special) {
      saleStartedAt = new Date(sorted[i].scraped_at);
    } else {
      break;
    }
  }
  if (saleStartedAt === null) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice: null, savingPct: null };
  }

  const preSale = sorted.filter((r) => !r.is_special && new Date(r.scraped_at) < saleStartedAt && r.price != null);
  if (!preSale.length) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice: null, savingPct: null };
  }

  const lookbackCutoff = new Date(saleStartedAt.getTime() - LOOKBACK_DAYS * DAY_MS);
  const recentPreSale = preSale.filter((r) => new Date(r.scraped_at) >= lookbackCutoff);
  const normalPrice = median((recentPreSale.length ? recentPreSale : preSale).map((r) => r.price));

  const sevenDayCutoff = new Date(saleStartedAt.getTime() - 7 * DAY_MS);
  const veryEarly = preSale.filter((r) => new Date(r.scraped_at) < sevenDayCutoff).map((r) => r.price);
  const preSaleRecent = preSale.filter((r) => new Date(r.scraped_at) >= sevenDayCutoff).map((r) => r.price);
  let inflatePct = 0;
  if (veryEarly.length && preSaleRecent.length) {
    const baseline = median(veryEarly);
    const peak = Math.max(...preSaleRecent);
    inflatePct = baseline ? ((peak - baseline) / baseline) * 100 : 0;
  }

  const savingPct = normalPrice ? ((normalPrice - salePrice) / normalPrice) * 100 : 0;

  if (normalPrice == null) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice, savingPct: null };
  }
  if (salePrice > normalPrice) {
    return {
      verdict: 'DODGY',
      reason: `Sale price ($${salePrice.toFixed(2)}) is HIGHER than the normal price ($${normalPrice.toFixed(2)}) -- fake deal`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  if (inflatePct >= DODGY_THRESHOLD && savingPct < GENUINE_THRESHOLD) {
    return {
      verdict: 'DODGY',
      reason: `Price was raised ${inflatePct.toFixed(1)}% just before the sale -- you're only saving ${savingPct.toFixed(1)}%`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  if (savingPct >= GENUINE_THRESHOLD) {
    return {
      verdict: 'GENUINE',
      reason: `Saving ${savingPct.toFixed(1)}% vs the recent normal price`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  if (savingPct >= MARGINAL_THRESHOLD) {
    return {
      verdict: 'MARGINAL',
      reason: `Only a ${savingPct.toFixed(1)}% saving -- barely worth it`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  return {
    verdict: 'MARGINAL',
    reason: 'Minimal saving vs normal price',
    normalPrice,
    savingPct: Math.round(savingPct * 10) / 10,
  };
}

// ---- Real cross-store product matching --------------------------------
// Two reviewed/approved match tables already exist in the database (built
// by the identity-matching pipeline, see project.md):
//   products.canonical_product_id -- exact SKU matches (272 linked products
//     / 158 distinct cross-store groups at last count)
//   app_comparable_family_links   -- looser but manually-reviewed "fair to
//     compare" matches, e.g. same item different pack size (332 rows,
//     spans Pak'nSave/New World/Woolworths/Four Square, not just
//     within-Foodstuffs)
// Union-find over both edge sets turns these into connected components --
// e.g. Woolworths' "Heinz Ketchup" row and New World's "Heinz Ketchup" row
// (different products.id each, one per retailer catalogue) resolve to the
// same group id, so their current specials get merged onto one product
// card instead of showing up as two unrelated products.
async function buildMatchIndex() {
  const [canonicalRows, comparableRows] = await Promise.all([
    fetchAllRows('products?select=id,canonical_product_id&canonical_product_id=not.is.null'),
    fetchAllRows('app_comparable_family_links?select=left_product_id,right_product_id'),
  ]);

  const parent = new Map();
  const find = (x) => {
    if (!parent.has(x)) parent.set(x, x);
    let root = x;
    while (parent.get(root) !== root) root = parent.get(root);
    let cur = x;
    while (parent.get(cur) !== root) {
      const next = parent.get(cur);
      parent.set(cur, root);
      cur = next;
    }
    return root;
  };
  const union = (a, b) => {
    const ra = find(a);
    const rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };

  for (const row of canonicalRows) union(row.id, row.canonical_product_id);
  for (const row of comparableRows) union(row.left_product_id, row.right_product_id);

  return { find, edgeCount: canonicalRows.length + comparableRows.length };
}

// Field-by-field merge across every retailer's own product row in a match
// group, so a group still displays a full card even if e.g. only the

function mergeProductMeta(memberMetas) {
  const pick = (field) => memberMetas.map((m) => m && m[field]).find((v) => v != null && v !== '') || null;
  return {

}

// current_prices.special_end_date is a plain `date` column (no time/zone),
// coming back over PostgREST as a bare "YYYY-MM-DD" string. `new
// Date("YYYY-MM-DD")` parses that as UTC midnight, and formatting it then
// converts back to the *browser's local* timezone -- for anyone west of
// UTC that shifts the displayed day back by one (e.g. a US-based dev
// checking this NZ-only app would see the 19th instead of the 20th).
// Parsing the y/m/d parts directly into a local-timezone Date sidesteps
// that entirely, since there's no real time-of-day to preserve anyway.
const formatDealEndDate = (dateStr) => {
  if (!dateStr) return '';
  const [year, month, day] = dateStr.split('-').map(Number);
  if (!year || !month || !day) return '';
  return new Date(year, month - 1, day).toLocaleDateString('en-NZ', { day: '2-digit', month: 'short', year: 'numeric' });
};

// Strips everything but letters/numbers before comparing search text, so
// punctuation/spacing differences between how a product is actually named
// in the database and how a shopper types it don't cause false misses --
// e.g. "Weetbix" (how most people type it) vs the DB's "Weet-Bix", or
// "PAK'nSAVE" vs "paknsave" (same normalisation already used for store-name
// matching elsewhere in this file, applied here to product search text too).
const normalizeSearchText = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

// Splits into normalised whole-word tokens, e.g. for telling an exact word
// match ("milk" in "Standard Milk") apart from an incidental substring
// inside a longer, unrelated word ("milk" inside "Milky", "butter" inside
// "Buttery"/"Butterscotch"/"Buttermilk-flavoured Chips").
const tokenizeSearchText = (s) => (s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

// Splits on *whitespace only* (punctuation within a word is stripped, not
// split on), so a hyphenated/punctuated real name stays glued together as
// one word for typo comparison -- same as normalizeSearchText already does
// for exact matches. Needed because tokenizeSearchText above splits
// "Weet-Bix" into two separate words ("weet", "bix"), which would stop a
// typo'd, un-hyphenated search like "weibix" (how people actually type it)
// from ever getting close enough to either half individually.
const tokenizeForFuzzy = (s) => (s || '').toLowerCase().split(/\s+/).map((w) => w.replace(/[^a-z0-9]/g, '')).filter(Boolean);

// Bounded Levenshtein (edit) distance -- how many single-character
// insertions/deletions/substitutions turn `a` into `b`. Capped at
// `maxDistance`: as soon as every cell in a DP row exceeds it, we bail out
// early (returning maxDistance + 1, i.e. "too far") instead of finishing the
// full O(len(a)*len(b)) table. That keeps a per-product typo check cheap
// even when it runs across the whole ~12.7k-item live catalogue.
function levenshteinDistance(a, b, maxDistance) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > maxDistance) return maxDistance + 1;
  let prev = new Array(b.length + 1);
  let curr = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    curr[0] = i;
    let rowMin = curr[0];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
      if (curr[j] < rowMin) rowMin = curr[j];
    }
    if (rowMin > maxDistance) return maxDistance + 1;
    [prev, curr] = [curr, prev];
  }
  return prev[b.length];
}

// How many typos we tolerate for a word of a given length. Short words
// (<=3 chars, e.g. "tea", "jam") get zero tolerance -- a 1-edit "correction"
// to a short word is just as likely to land on a different real word ("tea"
// vs "pea") as fix a typo, so allowing it would surface unrelated products.
// Longer words get proportionally more room, since a genuine typo in e.g.
// "weetbix" or "chocolate" is more likely to be 1-2 characters out of many.
const typoBudgetForLength = (len) => (len <= 3 ? 0 : len <= 5 ? 1 : len <= 9 ? 2 : 3);

// Whether `word` (as typed) is close enough to `candidate` (a real word from
// a product's name/brand/category) to count as a typo of it, e.g. "weibix"
// -> "weetbix", "bananna" -> "banana", "yoghurt" -> "yogurt".
//
// Budget is based on the *typed* word's length, not the candidate's -- using
// the longer of the two (an earlier version of this code did) let a short
// query piggyback on a longer candidate's bigger budget, e.g. "tea" (3
// chars, meant to get zero tolerance) fuzzy-matching "teal" or "team" purely
// because the *candidate* was 4+ chars. Keying off what the user actually
// typed keeps that zero-tolerance guarantee for short queries regardless of
// how long the product word happens to be.
const isFuzzyWordMatch = (word, candidate) => {
  if (!word || !candidate) return false;
  if (word === candidate) return true;
  const budget = typoBudgetForLength(word.length);
  if (budget === 0) return false;
  return levenshteinDistance(word, candidate, budget) <= budget;
};

// All searchable words for a product, pre-tokenized once per product per
// search rather than re-split on every candidate comparison. Uses
// tokenizeForFuzzy (whitespace-only split) so hyphenated names like
// "Weet-Bix" stay as one word ("weetbix") for typo comparison -- see note
// on tokenizeForFuzzy above. Cached per product object in a WeakMap since
// product identity is stable across re-renders (mockProducts only grows via
// appended pages, see productsVersion) -- avoids re-tokenizing every
// product's name/brand/category from scratch on every fuzzy-fallback scan.
const productSearchTokensCache = new WeakMap();
const getProductSearchTokens = (product) => {
  if (productSearchTokensCache.has(product)) return productSearchTokensCache.get(product);
  const tokens = [
    ...tokenizeForFuzzy(product.name),
    ...tokenizeForFuzzy(product.brand),
    ...tokenizeForFuzzy(product.category),
  ];
  productSearchTokensCache.set(product, tokens);
  return tokens;
};

// Typo-tolerant fallback match: every word the user typed has to be a close
// (or exact) match to *some* word in the product's name/brand/category, in
// any order -- so a misspelled multi-word query like "chocolat mlik" still
// finds "Milk Chocolate", not just single-word typos. `query` is the raw
// (untrimmed-tokenization-agnostic) search string, not pre-tokenized --
// tokenized here with tokenizeForFuzzy so it lines up with how the
// candidate words were tokenized above.
const isFuzzyProductMatch = (product, query, candidateTokens) => {
  const queryTokens = tokenizeForFuzzy(query);
  if (queryTokens.length === 0) return false;
  const tokens = candidateTokens || getProductSearchTokens(product);
  return queryTokens.every((qt) => tokens.some((ct) => isFuzzyWordMatch(qt, ct)));
};

// Relevance score for ranking search results -- without this, a plain
// substring match with no ranking left cheap incidental hits (a "Butter
// Chicken" simmer sauce, "Buttery" spread, "Milk Arrowroot" biscuits) sorted
// ahead of the actual milk/butter category items a shopper searching "milk"
// or "butter" is looking for, since the default sort is cheapest-price-first
// and snacks/sauces are usually cheaper than a carton of milk or block of
// butter. Category match (the product's real aisle/category) ranks highest,
// then an exact word match in the name, then brand, then a genuine (but not
// whole-word) substring match, and finally a typo-tolerant fuzzy match --
// ranked lowest so a correctly-spelled incidental match never loses to a
// misspelled query's best-guess correction.
const getSearchRelevance = (product, query) => {
  const queryTokens = tokenizeSearchText(query);
  if (queryTokens.length === 0) return 1;
  const isWholeWordMatch = (text) => {
    const tokens = tokenizeSearchText(text);
    return queryTokens.every((qt) => tokens.includes(qt));
  };
  if (isWholeWordMatch(product.category)) return 6;
  if (isWholeWordMatch(product.name)) return 5;
  if (isWholeWordMatch(product.brand)) return 4;
  const normalizedQuery = normalizeSearchText(query);
  const isRealSubstring = (text) => normalizeSearchText(text).includes(normalizedQuery);
  if (isRealSubstring(product.name) || isRealSubstring(product.brand) || isRealSubstring(product.category)) return 3;
  if (isFuzzyProductMatch(product, query)) return 2;
  return 1;
};

// Shared fallback used both when a product row has no image_url in the
// database and as an <img onError> safety net if a stored URL 404s/expires.
const FALLBACK_PRODUCT_IMAGE = 'https://placehold.co/300x300?text=No+Image';

// Renders a product's real photo (from products.image_url in Supabase) with
// a placeholder fallback. Used everywhere a card previously showed a static
// "Product Image" text box instead of an actual image.
function ProductImage({ src, alt, className }) {
  return (
    <img
      src={src || FALLBACK_PRODUCT_IMAGE}
      alt={alt || 'Product'}
      loading="lazy"
      draggable="false"
      className={className}
      onError={(e) => {
        if (e.currentTarget.src !== FALLBACK_PRODUCT_IMAGE) {
          e.currentTarget.onerror = null;
          e.currentTarget.src = FALLBACK_PRODUCT_IMAGE;
        }
      }}
    />
  );
}

// Shared, pure store-name/logo helpers -- hoisted out of SearchTab (which
// used to define its own local copies) so TrackedTab, HistoryTab, and the
// shared ProductCard component below can all use the same logic instead of
// each maintaining a separate near-duplicate. `branchOverrides` is optional:
// pass a component's own personalised-branch-name lookup (see SearchTab's
// `usePersonalised`/`selectedBranches` local state) to get e.g. "Woolworths
// CBD" instead of the generic "Woolworths"; omit it for the plain generic
// name, which is what TrackedTab/HistoryTab/ProductCard use directly since
// neither of the first two currently has its own personalisation settings
// UI. Named with a "Global" suffix (rather than plain getStoreDisplayName)
// specifically so SearchTab can still define its own same-named, shadowing
// wrapper that binds in its local personalisation state -- every existing
// single-argument getStoreDisplayName(...) call site inside SearchTab then
// keeps resolving to that wrapper unchanged, rather than silently losing
// personalisation by resolving to this generic version instead.
const getStoreDisplayNameGlobal = (storeKey, branchOverrides) => {
  const generic = (() => {
    switch (storeKey.toLowerCase()) {
      case 'woolworths': return 'Woolworths';
      case 'paknsave': return "PAK'nSAVE";
      case 'newworld': return 'New World';
      case 'foursquare': return 'Four Square';
      case 'freshchoice': return 'FreshChoice';
      default: return storeKey;
    }
  })();
  if (!branchOverrides) return generic;
  switch (storeKey.toLowerCase()) {
    case 'woolworths': return branchOverrides['Woolworths'] || generic;
    case 'paknsave': return branchOverrides["PAK'nSAVE"] || generic;
    case 'newworld': return branchOverrides['New World'] || generic;
    case 'foursquare': return branchOverrides['Four Square'] || generic;
    case 'freshchoice': return branchOverrides['FreshChoice'] || generic;
    default: return generic;
  }
};

// Shared product-card layout used everywhere a product is shown as a card
// (SearchTab's main results, its "Your Items on Special" alert widget and
// "Popular Specials Right Now" row, TrackedTab's My List, and HistoryTab's
// check history) -- previously each of those 5 places had its own
// independently hand-built (and increasingly drifting) card layout. Five
// rows: deal-ends date + save/track icon; image + brand/name/size; price;
// a factual one-line callout about the store the price/deal shown belongs
// to (wording varies by context -- "Lowest at", "On special at", "Checked
// at" -- via `storeLinePrefix`, since not every card's displayed deal is
// actually the cheapest option, and mislabelling one as "Lowest" would be
// exactly the kind of fabricated-looking claim this project explicitly
// avoids elsewhere); and a badges row for any other stores also running a
// special right now.
//
// Props:
// - id: DOM id for the outer card (kept from each call site's previous
//   button/card id so nothing else that referenced it by id breaks).
// - product: { name, brand, unit, image }.
// - price: number shown in the big price row.
// - storeKey: the raw store key the price/storeLinePrefix line is about.
// - storeLinePrefix: text before the store name, e.g. "Lowest at".
// - branchOverrides: optional personalised-branch-name lookup (see
//   getStoreDisplayNameGlobal) -- omit for the generic store name.
// - dealEndsText: precomputed "Deal ends ..." string, or '' to show nothing
//   (never fabricated here -- callers only pass a real value when they
//   actually have one).
// - alsoSpecialStores: raw store keys (not display names) for the badges
//   row; empty array hides the row entirely.
// - isTracked / onToggleTrack: track/save icon state + handler. Passing no
//   onToggleTrack hides the icon entirely (matches the previous
//   `isLoggedIn &&` gating at each call site).
// - onActivate: card tap/Enter handler. Passing none makes the card fully
//   inert (used for TrackedTab's compare-mode cards, which have no single
//   "check this deal" action while comparing total list cost).
// - variant: 'full' (default) or 'peek' -- 'peek' renders the same content
//   but clipped to a short, faded, fully inert preview height (used for the
//   collapsed 3rd item in SearchTab's alert widget), matching the old
//   isPartiallyVisible treatment.
// - emphasizeBorder: ink-tinted border instead of the default stone one
//   (used where the card set already conveys "something here is genuinely
//   on special" at a glance, e.g. the main search results grid).
function ProductCard({
  id,
  product,
  price,
  storeKey,
  storeLinePrefix = 'Lowest at',
  branchOverrides,
  dealEndsText = '',
  alsoSpecialStores = [],
  isTracked = false,
  onToggleTrack,
  onActivate,
  variant = 'full',
  emphasizeBorder = false,
  children,
}) {
  const isPeek = variant === 'peek';
  const tappable = !isPeek && !!onActivate;
  const storeLabel = getStoreDisplayNameGlobal(storeKey, branchOverrides);

  return (
    <div
      id={id}
      onClick={tappable ? onActivate : undefined}
      onKeyDown={tappable ? handleCardKeyActivate(onActivate) : undefined}
      role={tappable ? 'button' : undefined}
      tabIndex={tappable ? 0 : undefined}
      aria-label={tappable ? `Check deals for ${product.name}` : undefined}
      className={`relative bg-white border rounded-2xl overflow-hidden flex flex-col group transition-all duration-200 ${
        isPeek
          ? 'h-24 pointer-events-none select-none border-dashed border-stone-300'
          : `${emphasizeBorder ? 'border-ink-200' : 'border-stone-200'} ${tappable ? 'cursor-pointer hover:shadow-lg hover:shadow-stone-100 active:scale-[0.99]' : ''}`
      }`}
    >
      {/* Row 1: deal-ends date (left) + save/track toggle (right) */}
      <div className="flex items-start justify-between px-5 pt-5 gap-3">
        <span className="text-[10px] font-bold text-stone-400 uppercase tracking-wider">
          {dealEndsText}
        </span>
        {/* Peek cards are meant to be a fully inert preview -- pointer-events-none
            on the outer container already blocks mouse clicks, but that alone
            doesn't stop keyboard Tab focus or a synthetic .click(), so the
            button itself has to be omitted here too, not just visually hidden. */}
        {!isPeek && onToggleTrack && (
          <button
            onClick={(e) => { e.stopPropagation(); onToggleTrack(); }}
            id={`track-${id}`}
            aria-label={isTracked ? 'Remove from list' : 'Add to list'}
            title={isTracked ? 'Remove from list' : 'Add to list'}
            className={`flex-shrink-0 -m-1.5 p-1.5 rounded-lg transition-colors active:scale-97 cursor-pointer ${
              isTracked ? 'text-alert-600 hover:bg-alert-50' : 'text-ink-600 hover:bg-ink-50'
            }`}
          >
            {isTracked ? <Check className="w-5 h-5" /> : <Plus className="w-5 h-5" />}
          </button>
        )}
      </div>

      {/* Row 2: product image + title/brand/size */}
      <div className="flex gap-4 px-5 pt-3">
        <div className="w-20 h-20 rounded-xl flex items-center justify-center overflow-hidden select-none flex-shrink-0">
          <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
        </div>
        <div className="flex flex-col justify-center min-w-0">
          <span className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">
            {product.brand}
          </span>
          <h3 className="font-bold text-base text-stone-900 leading-snug mt-0.5 font-display truncate">
            {product.name}
          </h3>
          {product.unit && (
            <span className="text-xs font-medium text-stone-500 mt-0.5">{product.unit}</span>
          )}
        </div>
      </div>

      {/* Row 3: price */}
      <div className="px-5 pt-3">
        <span className="text-2xl font-black text-stone-900 font-mono">
          ${price.toFixed(2)}
        </span>
      </div>

      {/* Row 4: store callout. Bottom padding (pb-5) only belongs here when
          this is genuinely the card's last row -- not when Row 5 is coming,
          and not when the caller passed extra `children` content (e.g.
          TrackedTab's compare-mode weight/quantity controls) that supplies
          its own trailing padding instead. */}
      <div className={`px-5 pt-1 ${alsoSpecialStores.length === 0 && !children ? 'pb-5' : ''}`}>
        <span className="text-xs font-bold text-stone-600">
          {storeLinePrefix} {storeLabel}.
        </span>
      </div>

      {/* Row 5: also-on-special-at store badges -- same trailing-padding
          logic as Row 4 above. */}
      {alsoSpecialStores.length > 0 && (
        <div className={`flex items-center gap-2 px-5 pt-3 flex-wrap ${children ? '' : 'pb-5'}`}>
          <span className="text-[10px] font-bold text-stone-400 uppercase tracking-wider">Also on special at:</span>
          <div className="flex items-center gap-1.5 flex-wrap">
            {alsoSpecialStores.map((store) => {
              const meta = getStoreLogoMeta(store);
              return (
                <div
                  key={store}
                  title={getStoreDisplayNameGlobal(store)}
                  className={`px-2 py-1 rounded-md text-[9px] font-black select-none ${meta.bg} ${meta.text}`}
                >
                  {meta.short}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Optional extra content below the standard 5 rows -- currently only
          used by TrackedTab's My List card for its compare-mode weight/
          quantity controls, which need to live inside the same card but
          aren't part of the shared wireframe layout itself. */}
      {children}

      {isPeek && (
        <div className="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-white to-transparent pointer-events-none" />
      )}
    </div>
  );
}

// Builds full product cards (metadata + classified deals + price history)
// for one page's worth of match-groups. Kept separate from the pagination
// loop below so each page only fetches products/price_history for the
// group members actually in that page, not the whole live set at once.
async function buildProductCardsForGroups(pageGroups, storeNameById) {
  const allProductIds = [...new Set(pageGroups.flatMap(([, rows]) => rows.map((r) => r.product_id)))];
  const [productRows, historyRows] = await Promise.all([
    fetchByIds('products', 'id', 'id,name,brand,category,image_url,unit_size', allProductIds),
    fetchByIds('price_history', 'product_id', 'product_id,store_id,price,is_special,scraped_at', allProductIds),
  ]);

  const productById = new Map(productRows.map((p) => [p.id, p]));
  const historyByPair = new Map();
  for (const row of historyRows) {
    const key = `${row.product_id}::${row.store_id}`;
    if (!historyByPair.has(key)) historyByPair.set(key, []);
    historyByPair.get(key).push(row);
  }
  const storeName = (id) => storeNameById.get(id) || STORE_DISPLAY_FALLBACK[id] || titleCase(id);

  const products = [];
  for (const [groupId, rows] of pageGroups) {
    const memberIds = [...new Set(rows.map((r) => r.product_id))];
    const meta = mergeProductMeta(memberIds.map((id) => productById.get(id)));
    if (!meta.name) continue;

    const currentDeals = [];
    const priceHistory = [];
    const normalPrices = [];

    for (const row of rows) {
      const pairHistory = historyByPair.get(`${row.product_id}::${row.store_id}`) || [];

      if (row.is_special) {
        // Actively promoted special -- run it through the real DODGY/
        // GENUINE/MARGINAL/UNKNOWN classifier, same as before.
        const verdict = classifySpecial(row.price, pairHistory);
        if (verdict.verdict !== 'UNKNOWN') {
          if (verdict.normalPrice != null) normalPrices.push(verdict.normalPrice);
          currentDeals.push({
            store: storeName(row.store_id),
            price: row.price,
            originalPrice: verdict.normalPrice ?? row.was_price ?? row.price,
            discountPercentage: Math.max(0, Math.round(verdict.savingPct ?? 0)),
            dealType: VERDICT_TO_DEAL_TYPE[verdict.verdict],
            wasArtificiallyInflated: verdict.verdict === 'DODGY',
            reason: verdict.verdict === 'DODGY' ? 'Artificial Discount (Was-Is Trap)' : verdict.verdict === 'GENUINE' ? 'Genuine Sale' : 'Standard Special',
            explanation: verdict.reason,
            isOnSpecial: true,
            // Retailer-advertised end date for this special, when the
            // source actually supplied one (see the 2026-07-29 migration --
            // there's no matching advertised *start* date in the schema, so
            // this can only ever show "ends", never a full date range).
            specialEndDate: row.special_end_date || null,
          });
        }
        // UNKNOWN (no usable history) still falls through with no deal
        // entry for this store -- unchanged behaviour from before.
      } else {
        // Not currently on special -- no verdict to render (there's no
        // "deal" to judge), but the item still belongs in the catalogue so
        // it's browsable/searchable and its price history is visible.
        currentDeals.push({
          store: storeName(row.store_id),
          price: row.price,
          originalPrice: row.price,
          discountPercentage: 0,
          dealType: 'Fair Price',
          wasArtificiallyInflated: false,
          reason: 'Regular Price',
          explanation: 'Not currently on special -- this is the regular shelf price.',
          isOnSpecial: false,
        });
      }

      for (const h of pairHistory) {
        priceHistory.push({
          date: new Date(h.scraped_at).toLocaleDateString('en-NZ', { month: 'short', day: '2-digit' }),
          price: h.price,
          isPromo: h.is_special,
          store: storeName(row.store_id),
        });
      }
    }

    if (!currentDeals.length) continue; // no usable row in this group (e.g. only UNKNOWN specials, no plain price)

    // The identity-matching pipeline occasionally links two distinct
    // retailer catalogue rows from the *same* store into one match group
    // (a known upstream data-quality quirk, not something to silently
    // trust) -- e.g. two separate Pak'nSave product rows both canonical-
    // linked to the same Woolworths item. The UI (and its React keys)
    // assumes one deal per store per card, so collapse to the best
    // (lowest) price per store here rather than showing contradictory
    // duplicate rows for the same shop.
    const bestDealByStore = new Map();
    for (const deal of currentDeals) {
      const existing = bestDealByStore.get(deal.store);
      if (!existing || deal.price < existing.price) bestDealByStore.set(deal.store, deal);
    }
    const dedupedDeals = [...bestDealByStore.values()];

    products.push({
      id: groupId,
      brand: titleCase(meta.brand) || 'Unbranded',
      name: titleCase(meta.name),
      category: meta.category || 'Grocery',
      image: meta.image_url || FALLBACK_PRODUCT_IMAGE,
      standardPrice: normalPrices.length ? Math.min(...normalPrices) : Math.min(...rows.map((r) => r.price)),
      unit: meta.unit_size || '',
      currentDeals: dedupedDeals,
      priceHistory,
      description: '',
    });
  }
  return products;
}

// Groups per page, not products -- a group can span several product_ids
// (real cross-store matches), so this keeps each page's products/
// price_history fetch bounded regardless of total catalogue size.
const GROUPS_PER_PAGE = 250;

// Loads EVERY current-priced item (no cap, no is_special filter -- per
// 2026-07-10 discussion: users should be able to find any item the
// supermarkets stock, not just ones currently on special, so they can see
// an item's price history even when it isn't discounted right now),
// grouped into real cross-store match groups, and streams results back in
// pages via `onUpdate(cumulativeProductsSoFar)` so the app can render the
// first page immediately and keep filling in the rest in the background
// rather than blocking on one giant fetch. Groups with more distinct real
// stores AND an active special are processed first so the richest,
// most-actionable comparisons show up in the earliest, fastest-rendering
// page; plain (non-special) items still load, just later.
async function loadLiveProducts(onUpdate) {
  const [allCurrentPrices, storeRows, matchIndex] = await Promise.all([
    fetchAllRows('current_prices?select=product_id,store_id,price,was_price,is_special,special_label,special_end_date'),
    fetchAllRows('stores?select=id,name'),
    buildMatchIndex(),
  ]);
  if (!allCurrentPrices.length) return [];
  const storeNameById = new Map(storeRows.map((s) => [s.id, s.name]));

  const byGroup = new Map();
  for (const row of allCurrentPrices) {
    const groupId = matchIndex.find(row.product_id);
    if (!byGroup.has(groupId)) byGroup.set(groupId, []);
    byGroup.get(groupId).push(row);
  }

  // Groups with an active special first (most immediately useful), then
  // richest (most real cross-store) comparisons, product-count as a stable
  // tiebreaker so page contents are reproducible run to run. Plain
  // (non-special) groups still load, just in later pages.
  const groups = [...byGroup.entries()].sort((a, b) => {
    const specialA = a[1].some((r) => r.is_special) ? 1 : 0;
    const specialB = b[1].some((r) => r.is_special) ? 1 : 0;
    const storesA = new Set(a[1].map((r) => r.store_id)).size;
    const storesB = new Set(b[1].map((r) => r.store_id)).size;
    return specialB - specialA || storesB - storesA || b[1].length - a[1].length;
  });

  const allProducts = [];
  for (let i = 0; i < groups.length; i += GROUPS_PER_PAGE) {
    const page = groups.slice(i, i + GROUPS_PER_PAGE);
    const pageProducts = await buildProductCardsForGroups(page, storeNameById);
    allProducts.push(...pageProducts);
    if (onUpdate) onUpdate(allProducts.slice());
    // Yield to the event loop between pages so the UI thread isn't blocked
    // and already-rendered pages stay interactive while the rest loads.
    await new Promise((resolve) => setTimeout(resolve, 0));
  }

  return allProducts;
}

// Builds working demo content for the tracked-items/history/alerts tabs out
// of whatever real products actually loaded, since those tabs stay local
// mock state (per project scope) but previously pointed at the old
// hardcoded mock product ids -- which no longer exist once real UUIDs are
// in play.
function buildSeedLists(products) {
  const ids = products.slice(0, 6).map((p) => p.id);
  if (!ids.length) return [{ id: 'list-1', name: 'List 1', itemIds: [] }];
  return [
    { id: 'list-1', name: 'List 1', itemIds: ids.slice(0, 3) },
    { id: 'list-2', name: 'List 2', itemIds: ids.slice(2, 5) },
    { id: 'list-3', name: 'List 3', itemIds: ids.length > 3 ? [ids[0], ids[3], ids[ids.length - 1]] : ids },
  ];
}

const HISTORY_DEAL_TYPE = { 'Dodgy Deal': 'Dodgy Deal', 'Real Deal': 'Real Saver', 'Fair Price': 'Fair Deal' };

function buildSeedHistory(products) {
  return products.slice(0, 9).map((p, idx) => {
    const deal = p.currentDeals[0];
    return {
      id: `hist-${idx + 1}`,
      productId: p.id,
      checkedAt: idx < 3 ? ['10:24 AM', '08:15 AM', '4:45 PM'][idx] : `Jul ${Math.max(1, 9 - idx)}`,
      store: deal.store,
      price: deal.price,
      dealType: HISTORY_DEAL_TYPE[deal.dealType] || 'Fair Deal',
    };
  });
}

function buildSeedAlerts(products) {
  return products.slice(0, 4).map((p, idx) => {
    const deal = p.currentDeals[0];
    return {
      id: `alert-${idx + 1}`,
      productId: p.id,
      store: deal.store,
      oldPrice: deal.originalPrice,
      newPrice: deal.price,
      alertType: deal.dealType,
      timestamp: idx === 0 ? 'Today' : idx === 1 ? 'Yesterday' : `${idx} days ago`,
      read: idx > 1,
    };
  });
}
