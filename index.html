function DealModal({
  isOpen,
  onClose,
  product,
  dealStore,
  onTrackToggle,
  isTracked,
  trackedProductIds = [],
  isLoggedIn = true,
  onNavigateToSettings,
  onNavigateToHowItWorks,
  onNavigateToManageAccount,
  onNavigateToLogin,
  onLogout,
}) {
  if (!product || !dealStore) return null;

  const deal = product.currentDeals.find((d) => d.store === dealStore);
  if (!deal) return null;

  // Real per-store "today" price -- from currentDeals only, which (since
  // the full-catalogue change) holds an entry for every store this item
  // actually has live data at, special or regular. No fallback: if a store
  // has no entry, this item genuinely isn't tracked there, and null lets
  // callers drop it instead of guessing a price.
  const getRealPriceToday = (store) => {
    const activeDeal = product.currentDeals.find((d) => d.store === store);
    return activeDeal ? activeDeal.price : null;
  };

  // Real per-store baseline to compare today's price against. Sourced from
  // that same currentDeals entry's originalPrice, which classifySpecial()
  // already computed correctly at load time -- the real day-windowed normal
  // price for an active special, or the flat real regular price otherwise.
  // Not a fabricated multiplier, not a hardcoded 3-point "90 day" average.
  const getRealAveragePrice = (store) => {
    const activeDeal = product.currentDeals.find((d) => d.store === store);
    return activeDeal ? activeDeal.originalPrice : null;
  };

  const storesList = ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square', 'FreshChoice'];

  const barChartData = storesList
    .map((store) => {
      const current = getRealPriceToday(store);
      const avg = getRealAveragePrice(store);
      if (current == null || avg == null) return null; // no real data for this store -- skip, don't fabricate a bar

      const shortNames = {
        'Woolworths': 'WW',
        "PAK'nSAVE": 'PNS',
        'New World': 'NW',
        'Four Square': 'FS',
        'FreshChoice': 'FC',
      };

      const orangeUnder = current < avg ? current : 0;
      const blueBody = current < avg ? (avg - current) : avg;
      const orangeOver = current >= avg ? (current - avg) : 0;

      return {
        name: shortNames[store] || store,
        storeName: store,
        currentPrice: current,
        averagePrice: avg,
        orangeUnder,
        blueBody,
        orangeOver,
      };
    })
    .filter(Boolean);

  const rankingList = storesList
    .map((store) => ({ store, price: getRealPriceToday(store) }))
    .filter((item) => item.price != null)
    .sort((a, b) => a.price - b.price);

  const [showPricingDetails, setShowPricingDetails] = React.useState(false);
  const [currentView, setCurrentView] = React.useState('assessment');
  const [selectedStores, setSelectedStores] = React.useState(['all']);

  const [usePersonalised, setUsePersonalised] = React.useState(() => {
    return localStorage.getItem('use_personalised_settings') === 'true';
  });

  const [selectedBranches] = React.useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    const defaults = {
      'Woolworths': 'Woolworths CBD',
      "PAK'nSAVE": "PAK'nSAVE Mt Albert",
      'New World': 'New World Victoria Park',
      'Four Square': 'Four Square Ellerslie',
      'FreshChoice': 'FreshChoice Half Moon Bay',
    };
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square', 'FreshChoice'].forEach(brand => {
            loaded[brand] = parsed[brand] || defaults[brand];
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    return defaults;
  });

  const getStoreDisplayName = (storeKey) => {
    if (usePersonalised) {
      switch (storeKey.toLowerCase()) {
        case 'woolworths': return selectedBranches['Woolworths'] || 'Woolworths';
        case 'paknsave': return selectedBranches["PAK'nSAVE"] || "PAK'nSAVE";
        case 'newworld': return selectedBranches['New World'] || 'New World';
        case 'foursquare': return selectedBranches['Four Square'] || 'Four Square';
        case 'freshchoice': return selectedBranches['FreshChoice'] || 'FreshChoice';
        default: return storeKey;
      }
    }
    switch (storeKey.toLowerCase()) {
      case 'woolworths': return 'Woolworths';
      case 'paknsave': return "PAK'nSAVE";
      case 'newworld': return 'New World';
      case 'foursquare': return 'Four Square';
      case 'freshchoice': return 'FreshChoice';
      default: return storeKey;
    }
  };

  const handleStoreToggle = (storeId) => {
    if (storeId === 'all') {
      setSelectedStores(['all']);
    } else {
      let nextStores = [...selectedStores];
      if (nextStores.includes('all')) {
        nextStores = [storeId];
      } else {
        if (nextStores.includes(storeId)) {
          nextStores = nextStores.filter((id) => id !== storeId);
          if (nextStores.length === 0) {
            nextStores = ['all'];
          }
        } else {
          nextStores.push(storeId);
        }
      }
      setSelectedStores(nextStores);
    }
  };

  React.useEffect(() => {
    if (!isOpen) {
      setShowPricingDetails(false);
      setCurrentView('assessment');
      setSelectedStores(['all']);
    } else {
      setUsePersonalised(localStorage.getItem('use_personalised_settings') === 'true');
    }
  }, [isOpen]);

  React.useEffect(() => {
    setCurrentView('assessment');
    setSelectedStores(['all']);
  }, [product, dealStore]);

  // Only ever return a price this product/store combo actually has real
  // data for -- currentDeals (today's live price, special or regular) first,
  // then the most recent real price_history row for that store. Never
  // fabricate one: this used to fall back to hardcoded mock-era store
  // multipliers (and a date-string check for "Jun 28"/"Today" that can
  // never match a real scraped_at value), silently rendering a guessed
  // price with no visual difference from a real one -- exactly the kind of
  // quiet fabrication this app exists to catch, not commit. Returns null
  // when there's genuinely no data, so the caller can drop the option
  // instead of inventing one.
  const getRealProductPriceForStore = (p, store) => {
    const activeDeal = p.currentDeals.find((d) => d.store === store);
    if (activeDeal) return activeDeal.price;

    const historyForStore = p.priceHistory.filter((h) => h.store === store);
    if (historyForStore.length > 0) {
      return historyForStore[historyForStore.length - 1].price;
    }

    return null;
  };

  let alternativeProducts = mockProducts.filter(
    (p) => p.category === product.category && p.id !== product.id
  );

  if (alternativeProducts.length === 0) {
    alternativeProducts = mockProducts.filter((p) => p.id !== product.id);
  }

  const allCheaperAlternativeOptions = alternativeProducts
    .flatMap((p) => {
      return storesList.map((store) => {
        const price = getRealProductPriceForStore(p, store);
        return {
          product: p,
          store,
          price,
          saving: price != null ? deal.price - price : null,
        };
      });
    })
    .filter((item) => item.price != null && item.price < deal.price);

  const cheaperAlternatives = allCheaperAlternativeOptions
    .filter((item) => {
      if (selectedStores.includes('all')) return true;
      const normalizedStore = item.store.toLowerCase().replace(/[^a-z]/g, '');
      return selectedStores.some((selected) => {
        const normalizedSelected = selected.toLowerCase().replace(/[^a-z]/g, '');
        return normalizedStore === normalizedSelected;
      });
    })
    .sort((a, b) => b.saving - a.saving);

  // Real min/max/avg from actual observed prices for this store -- every
  // real price_history row plus today's real currentDeals price if it
  // exists (price_history may lag a same-day scrape). No synthetic
  // Today/30d/60d/90d snapshot points: this used to call
  // getPriceForStoreAtTime for four fixed "snapshots" that, for live data,
  // almost never matched a real price_history row (see verdict comment
  // above) and fell back to fabricated multipliers every time. Returns
  // null when there's genuinely no real data for that store, so the
  // caller can omit the row instead of showing a guessed range.
  const getPricingStatsForStore = (store) => {
    const historyForStore = product.priceHistory.filter((h) => h.store === store);
    const prices = historyForStore.map((h) => h.price);
    // Only add today's currentDeals price as a fallback when price_history
    // has nothing for this store at all -- price_history's own latest row
    // is usually the same as today's currentDeals price already, so adding
    // it unconditionally would double-count today and skew the average.
    if (!prices.length) {
      const activeDeal = product.currentDeals.find((d) => d.store === store);
      if (activeDeal) prices.push(activeDeal.price);
    }
    if (!prices.length) return null;

    return {
      min: Math.min(...prices),
      max: Math.max(...prices),
      avg: prices.reduce((a, b) => a + b, 0) / prices.length,
    };
  };

  // deal.dealType is already the real verdict -- classifySpecial() computed
  // it at load time from actual price_history (DODGY/GENUINE/MARGINAL via
  // VERDICT_TO_DEAL_TYPE), the same classification shown on the product
  // card/search results. This used to be recomputed from scratch here via
  // discountPct/average90dPrice, both built on getPriceForStoreAtTime's
  // fabricated multipliers -- for live data (whose price_history dates
  // never match that function's hardcoded mock date strings) that recompute
  // was running on 100% guessed numbers, and could disagree with the
  // correct verdict already shown one screen back. HISTORY_DEAL_TYPE
  // already exists to translate deal.dealType's vocabulary into this
  // screen's ('Real Deal' -> 'Real Saver', etc.) -- same mapping the "All
  // Checks" history feature relies on, reused here instead of duplicated.
  let verdict;
  let verdictColorClass = '';
  let verdictBgClass = '';
  let verdictBorderClass = '';

  if (deal.isOnSpecial === false) {
    // Browsing a plain, non-special item -- there's no "deal" to judge as
    // dodgy/genuine/fair, so show a neutral price-history state instead of
    // a verdict that implies a promotion exists.
    verdict = 'Regular Price';
    verdictColorClass = 'text-stone-700';
    verdictBgClass = 'bg-stone-50';
    verdictBorderClass = 'border-stone-200';
  } else {
    verdict = HISTORY_DEAL_TYPE[deal.dealType] || 'Fair Deal';
    if (verdict === 'Real Saver') {
      verdictColorClass = 'text-fair-800';
      verdictBgClass = 'bg-fair-50';
      verdictBorderClass = 'border-fair-200';
    } else if (verdict === 'Dodgy Deal') {
      verdictColorClass = 'text-alert-800';
      verdictBgClass = 'bg-alert-50';
      verdictBorderClass = 'border-alert-200';
    } else {
      verdict = 'Fair Deal';
      verdictColorClass = 'text-dodgy-800';
      verdictBgClass = 'bg-dodgy-50';
      verdictBorderClass = 'border-dodgy-200';
    }
  }

  // rankingList always has at least one entry: dealStore itself, since
  // `deal` (found above) came from product.currentDeals, so
  // getRealPriceToday(dealStore) can't be null.
  const cheapestStoreItem = rankingList[0];
  const cheapestStore = cheapestStoreItem.store;
  const cheapestAveragePrice = getRealAveragePrice(cheapestStore);
  const cheapestDiscountPct = (cheapestAveragePrice && cheapestAveragePrice > 0)
    ? Math.round(((cheapestAveragePrice - cheapestStoreItem.price) / cheapestAveragePrice) * 100)
    : 0;

  return (
    <AnimatePresence>
      {isOpen && (
        <motion.div
          initial={{ opacity: 0, x: 20 }}
          animate={{ opacity: 1, x: 0 }}
          exit={{ opacity: 0, x: 20 }}
          transition={{ duration: 0.25, ease: 'easeOut' }}
          id="deal-assessment-page"
          className="w-full min-h-screen flex flex-col bg-[#f8f9fa] relative overflow-hidden"
        >
          {currentView === 'cheaper-alternatives' ? (
            <>
              <AppHeader
                title="Cheaper Alternatives"
                onBack={() => setCurrentView('assessment')}

                                    <td className="py-2.5 px-4 text-right font-mono text-ink-600">${stats.avg.toFixed(2)}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>

              {!isTracked && isLoggedIn && (
                <div className="p-4.5 bg-white border-t border-stone-100 flex">
                  <button
                    onClick={() => onTrackToggle(product.id)}
                    id="modal-track-btn"
                    className="w-full py-4 px-6 rounded-xl text-xs font-black uppercase tracking-widest border transition-all duration-200 active:scale-98 flex items-center justify-center gap-2 cursor-pointer bg-stone-900 hover:bg-ink-600 text-white border-stone-900 hover:border-ink-600 shadow-md"
                  >
                    Add to List
                  </button>
                </div>
              )}
            </>
          )}
        </motion.div>
      )}
    </AnimatePresence>
  );
}

// Real barcode/OCR recognition isn't feasible in a static prototype, so this
// no longer fabricates a scan result. It captures a photo (via the device's
// real camera, using a file input with capture="environment" -- the
// standard way a web page triggers the native camera app rather than a
// canvas/getUserMedia live-preview) or an uploaded photo, then hands the
// user off to the real search flow (which does run the genuine dodgy/fair/
// real-saver classifier against the live database) to look the item up.
function ScannerModal({ isOpen, onClose, onSearchForItem }) {
  const [capturedImage, setCapturedImage] = useState(null);
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);

  const handleImageSelected = (event) => {
    const file = event.target.files?.[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => setCapturedImage(reader.result);
      reader.readAsDataURL(file);
    }
    // Reset so choosing the same file again still fires onChange.
    event.target.value = '';
  };

  const handleRetake = () => setCapturedImage(null);

  const handleClose = () => {
    setCapturedImage(null);
    onClose();
  };

  const handleSearchForItem = () => {
    setCapturedImage(null);
    onClose();
    onSearchForItem && onSearchForItem();
  };

  return (
    <AnimatePresence>
      {isOpen && (
        <>
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            onClick={handleClose}
            className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"
          />

          <motion.div
            initial={{ y: '100%', opacity: 0.5 }}
            animate={{ y: 0, opacity: 1 }}
            exit={{ y: '100%', opacity: 0.5 }}
            transition={{ type: 'spring', damping: 25, stiffness: 220 }}
            className="fixed bottom-0 left-0 right-0 max-w-md mx-auto w-full bg-white rounded-t-3xl shadow-2xl z-[51] max-h-[92dvh] flex flex-col overflow-hidden border-t border-x border-stone-200"
          >
            <div className="flex items-center justify-between px-6 py-4 border-b border-stone-200">
              <div className="flex items-center gap-3">
                <div className="w-5 h-5 bg-ink-600 rounded-[2px] transform rotate-45 flex items-center justify-center shadow-md">
                  <Camera className="w-3 h-3 text-white transform -rotate-45" />
                </div>
                <h3 className="font-bold text-base text-stone-900 uppercase tracking-wider font-display">Price Tag Scanner</h3>
              </div>
              <button
                onClick={handleClose}
                className="p-1 rounded-full hover:bg-stone-100 text-stone-500 hover:text-stone-700 transition-colors"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {!capturedImage && (
                <div className="space-y-4">
                  <p className="text-xs text-stone-500 leading-relaxed font-medium">
                    Point your camera at a shelf price tag or barcode to check it in-store, or upload a photo you've already taken.
                  </p>

                  <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    ref={cameraInputRef}
                    onChange={handleImageSelected}
                    className="hidden"
                  />
                  <button
                    onClick={() => cameraInputRef.current?.click()}
                    className="w-full py-8 border-2 border-dashed border-ink-200 bg-ink-50/30 hover:bg-ink-50 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all cursor-pointer"
                  >
                    <div className="w-12 h-12 bg-ink-600 rounded-2xl flex items-center justify-center shadow-md">
                      <Camera className="w-6 h-6 text-white" />
                    </div>
                    <p className="text-xs font-bold text-stone-800 uppercase tracking-wider">Scan Barcode</p>
                    <p className="text-[10px] font-black text-stone-400 uppercase tracking-widest">Opens your camera</p>
                  </button>

                  <div className="flex items-center my-4">
                    <div className="flex-grow border-t border-stone-200" />
                    <span className="text-[9px] font-black text-stone-400 mx-3 uppercase tracking-widest">Or</span>
                    <div className="flex-grow border-t border-stone-200" />
                  </div>

                  <input
                    type="file"
                    accept="image/*"
                    ref={galleryInputRef}
                    onChange={handleImageSelected}
                    className="hidden"
                  />
                  <button
                    onClick={() => galleryInputRef.current?.click()}
                    className="w-full py-6 border-2 border-dashed border-stone-300 hover:border-stone-400 hover:bg-stone-50 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all cursor-pointer"
                  >

              {capturedImage && (
                <div className="space-y-6">

function ManageAccountTab({ onBackToSearch, onLogout, showSnackbar }) {
  const [name, setName] = useState('');
  const [ageGroup, setAgeGroup] = useState('');
  const [zipCode, setZipCode] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmNewPassword, setConfirmNewPassword] = useState('');

  const [isNameEditable, setIsNameEditable] = useState(false);
  const [originalName, setOriginalName] = useState('');
  const [isAgeGroupEditable, setIsAgeGroupEditable] = useState(false);
  const [originalAgeGroup, setOriginalAgeGroup] = useState('');
  const [isZipCodeEditable, setIsZipCodeEditable] = useState(false);
  const [originalZipCode, setOriginalZipCode] = useState('');
  const [isEmailEditable, setIsEmailEditable] = useState(false);
  const [originalEmail, setOriginalEmail] = useState('');
  const [isPasswordEditable, setIsPasswordEditable] = useState(false);

  const [showExistingPassword, setShowExistingPassword] = useState(false);
  const [showNewPassword, setShowNewPassword] = useState(false);
  const [showConfirmNewPassword, setShowConfirmNewPassword] = useState(false);

  const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
  const [isPasswordSaved, setIsPasswordSaved] = useState(false);
  const [accountType, setAccountType] = useState('free');

  const [isPaymentFormOpen, setIsPaymentFormOpen] = useState(false);
  const [cardName, setCardName] = useState('');
  const [cardNumber, setCardNumber] = useState('');
  const [cardExpiry, setCardExpiry] = useState('');
  const [cardCvc, setCardCvc] = useState('');
  const [isPaying, setIsPaying] = useState(false);
  const [paymentErrors, setPaymentErrors] = useState({});

  useEffect(() => {
    setName(localStorage.getItem('user_name') || 'John Doe');
    setAgeGroup(localStorage.getItem('user_ageGroup') || '25-34');
    setZipCode(localStorage.getItem('user_zipCode') || '6011');
    setEmail(localStorage.getItem('user_email') || 'john@example.com');
    setAccountType(localStorage.getItem('user_accountType') || 'free');
    const pass = localStorage.getItem('user_password') || 'password123';
    setPassword(pass);
    setNewPassword('');
    setConfirmNewPassword('');
  }, []);

  const handleConfirmPasswordChange = (e) => {
    e.preventDefault();
    if (!newPassword) {
      showSnackbar('Please enter your new password');
      return;
    }
    if (newPassword !== confirmNewPassword) {
      showSnackbar('New passwords do not match');
      return;
    }

    localStorage.setItem('user_password', newPassword);
    setPassword(newPassword);
    setNewPassword('');
    setConfirmNewPassword('');

    setIsPasswordSaved(true);
    setIsPasswordEditable(false);
    showSnackbar('Password updated successfully');

    setTimeout(() => {
      setIsPasswordSaved(false);
    }, 4000);
  };

  const handleAccountTypeChange = (type) => {
    if (accountType === type) return;
    if (type === 'free') {
      localStorage.setItem('user_accountType', 'free');
      setAccountType('free');
      setIsPaymentFormOpen(false);
      showSnackbar('Successfully switched to Free account.');
    } else {
      setIsPaymentFormOpen(true);
    }
  };

  const handleCardNumberChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    const formatted = value.match(/.{1,4}/g)?.join(' ') || value;
    setCardNumber(formatted.substring(0, 19));
  };

  const handleCardExpiryChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    let formatted = value;
    if (value.length > 2) {
      formatted = `${value.substring(0, 2)}/${value.substring(2, 4)}`;
    }
    setCardExpiry(formatted.substring(0, 5));
  };

  const handleCardCvcChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    setCardCvc(value.substring(0, 4));
  };

  const handleSubmitPayment = (e) => {
    e.preventDefault();
    const errors = {};
    if (!cardName.trim()) {
      errors.cardName = 'Cardholder name is required';
    }

    const cleanNum = cardNumber.replace(/\s+/g, '');
    if (!cleanNum) {
      errors.cardNumber = 'Card number is required';
    } else if (!/^\d{16}$/.test(cleanNum)) {
      errors.cardNumber = 'Card number must be 16 digits';
    }

    if (!cardExpiry) {
      errors.cardExpiry = 'Expiry date is required';
    } else if (!/^(0[1-9]|1[0-2])\/[0-9]{2}$/.test(cardExpiry)) {
      errors.cardExpiry = 'Must be MM/YY';
    }

    if (!cardCvc) {
      errors.cardCvc = 'CVC is required';
    } else if (!/^\d{3,4}$/.test(cardCvc)) {
      errors.cardCvc = 'CVC must be 3 or 4 digits';
    }

    if (Object.keys(errors).length > 0) {
      setPaymentErrors(errors);
      return;
    }

    setPaymentErrors({});
    setIsPaying(true);

    setTimeout(() => {
      localStorage.setItem('user_accountType', 'paid');
      setAccountType('paid');
      setIsPaying(false);
      setIsPaymentFormOpen(false);
      setCardName('');
      setCardNumber('');
      setCardExpiry('');
      setCardCvc('');
      showSnackbar('Successfully upgraded to Paid account! Enjoy unlimited list tracking and instant alerts.');
    }, 1500);
  };

  const handleCancelAccount = () => {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('user_name');
    localStorage.removeItem('user_ageGroup');
    localStorage.removeItem('user_zipCode');
    localStorage.removeItem('user_email');
    localStorage.removeItem('user_password');

    setIsConfirmModalOpen(false);
    showSnackbar('Your account has been cancelled.');
    onLogout();
  };

  return (
    <div className="space-y-6 animate-fadeIn pb-24 max-w-md mx-auto px-1">
      <div className="bg-white border border-stone-200 rounded-3xl p-6 shadow-sm space-y-4">

        </div>

              Full Name
            </label>

              type="button"
              onClick={() => {
                if (isNameEditable) {
                  setName(originalName);
                  setIsNameEditable(false);
                } else {
                  setOriginalName(name);
                  setIsNameEditable(true);
                }
              }}
              className={`text-[10px] font-black uppercase tracking-wider transition-colors cursor-pointer flex items-center gap-1 ${
                isNameEditable ? 'text-alert-500 hover:text-alert-700' : 'text-ink-600 hover:text-ink-800'
              }`}
            >
              {isNameEditable ? (
                <>
                  <X className="w-2.5 h-2.5" />
                  cancel

                  edit

            </button>

function SettingsTab({ onBack, showSnackbar }) {
  const [initialBranches, setInitialBranches] = useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
            const val = parsed[brand];
            if (Array.isArray(val)) {
              loaded[brand] = val.length > 0 ? val[0] : BRANCHES_BY_BRAND[brand][0];
            } else if (typeof val === 'string' && val) {
              loaded[brand] = val;
            } else {
              loaded[brand] = BRANCHES_BY_BRAND[brand][0];
            }
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    const defaults = {};
    Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
      defaults[brand] = BRANCHES_BY_BRAND[brand][0];
    });
    return defaults;
  });

  const [selectedBranches, setSelectedBranches] = useState(() => ({ ...initialBranches }));

  const [flashingBrands, setFlashingBrands] = useState({});

  const [activeChangeBrand, setActiveChangeBrand] = useState(null);

  const [brandSearchQueries, setBrandSearchQueries] = useState({
    'Woolworths': '',
    "PAK'nSAVE": '',
    'New World': '',
    'Four Square': '',
    'FreshChoice': ''
  });

  const inputRef = useRef(null);

  useEffect(() => {
    if (activeChangeBrand && inputRef.current) {
      inputRef.current.focus();
    }
  }, [activeChangeBrand]);

  const handleSelectStore = (brand, branch) => {
    setSelectedBranches(prev => ({
      ...prev,
      [brand]: branch
    }));

    setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }));
    setActiveChangeBrand(null);
  };

  const handleResetDefaults = () => {
    const defaults = {};
    Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
      defaults[brand] = BRANCHES_BY_BRAND[brand][0];
    });
    setSelectedBranches(defaults);
    setBrandSearchQueries({
      'Woolworths': '',
      "PAK'nSAVE": '',
      'New World': '',
      'Four Square': '',
      'FreshChoice': ''
    });
    setActiveChangeBrand(null);
  };

  const isModified = Object.keys(BRANCHES_BY_BRAND).some(
    brand => selectedBranches[brand] !== initialBranches[brand]
  );

  return (

          Personalise your experience
        </h2>
        <p className="text-xs text-stone-500 leading-relaxed font-medium">
          Select which specific store for each supermarket you want to search deals at. By default, you have been assigned to the ones closest to the zip code you provided when creating your account.
        </p>
      </div>

      <div className="space-y-4">
        {Object.keys(BRANCHES_BY_BRAND).map((brand) => {
          const selectedStore = selectedBranches[brand];
          const query = brandSearchQueries[brand] || '';
          const isChanging = activeChangeBrand === brand;

          const matches = BRANCHES_BY_BRAND[brand].filter(branch =>
            branch.toLowerCase().includes(query.toLowerCase())
          );

          const meta = BRAND_METADATA[brand] || { bg: 'bg-stone-50', text: 'text-stone-700', border: 'border-stone-100', accent: 'indigo' };

          return (
            <div
              key={brand}
              className={`bg-white border rounded-3xl p-5 shadow-xs space-y-4 relative transition-all duration-700 ${
                flashingBrands[brand]
                  ? 'border-ink-500 bg-ink-50/25 ring-4 ring-ink-500/15 scale-[1.015] shadow-md z-10'
                  : 'border-stone-200 bg-white'
              }`}
            >
              <div className="flex justify-between items-center pb-2.5 border-b border-stone-100">
                <div className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider ${meta.bg} ${meta.text} border ${meta.border} flex items-center gap-1.5`}>
                  <Store className="w-3 h-3" />
                  {brand}
                </div>
              </div>

              {!isChanging ? (
                <div className="flex items-center justify-between p-3.5 bg-ink-50/20 border border-ink-100/60 rounded-2xl animate-fadeIn">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className="p-2 bg-ink-600 text-white rounded-xl flex-shrink-0">
                      <MapPin className="w-4 h-4 stroke-[2.5]" />
                    </div>
                    <div className="min-w-0">
                      <p className="text-[9px] text-ink-600 font-black uppercase tracking-wider">Selected Store</p>
                      <h4 className="text-xs font-black text-stone-800 truncate">{selectedStore || 'None Selected'}</h4>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setActiveChangeBrand(brand);
                      setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }));
                    }}
                    className="flex items-center gap-1 px-3 py-1.5 bg-ink-600 hover:bg-ink-700 text-white font-black text-[10px] uppercase tracking-wider rounded-lg transition-colors cursor-pointer shadow-3xs flex-shrink-0"
                  >
                    <Edit2 className="w-3 h-3" />
                    <span>Change</span>
                  </button>
                </div>
              ) : (
                <div className="space-y-3 animate-fadeIn">
                  <div className="space-y-1.5 relative">
                    <div className="flex justify-between items-center">
                      <label className="text-[9px] font-black uppercase tracking-widest text-ink-600 block">
                        Search and change {brand} branch
                      </label>
                      <button
                        type="button"
                        onClick={() => setActiveChangeBrand(null)}
                        className="text-[9px] font-black uppercase tracking-widest text-stone-400 hover:text-stone-600 cursor-pointer flex items-center gap-0.5"
                      >
                        <X className="w-3 h-3" />
                        Cancel
                      </button>
                    </div>
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-stone-400">
                        <Search className="w-3.5 h-3.5" />
                      </span>
                      <input
                        ref={inputRef}
                        type="text"
                        placeholder={`Type location (e.g. CBD, Eden, Wellington)...`}
                        value={query}
                        onChange={(e) => setBrandSearchQueries(prev => ({ ...prev, [brand]: e.target.value }))}
                        className="w-full pl-9 pr-9 py-2.5 bg-stone-50 focus:bg-white border border-ink-500 rounded-xl text-xs font-bold text-stone-800 placeholder-stone-400 focus:outline-hidden focus:ring-1 focus:ring-ink-600 transition-all shadow-3xs"
                      />
                      {query && (
                        <button
                          type="button"
                          onClick={() => setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }))}
                          className="absolute inset-y-0 right-0 flex items-center pr-3 text-stone-400 hover:text-stone-600 cursor-pointer"
                        >
                          <X className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="border border-stone-200 rounded-2xl overflow-hidden bg-white shadow-md divide-y divide-stone-100 max-h-48 overflow-y-auto">
                    <div className="px-3.5 py-1.5 bg-stone-50 text-[9px] font-black uppercase tracking-wider text-stone-400">
                      Quick Results ({matches.length})
                    </div>
                    {matches.length > 0 ? (
                      matches.map((branch) => {
                        const isCurrentSelection = selectedStore === branch;
                        return (
                          <button
                            key={branch}
                            type="button"
                            onClick={() => handleSelectStore(brand, branch)}
                            className={`w-full text-left px-3.5 py-2.5 text-xs font-bold transition-all duration-150 flex items-center justify-between cursor-pointer ${
                              isCurrentSelection
                                ? 'bg-ink-50/50 text-ink-700'
                                : 'hover:bg-stone-50/60 text-stone-600 hover:text-stone-900'
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              <MapPin className={`w-3.5 h-3.5 ${isCurrentSelection ? 'text-ink-600' : 'text-stone-400'}`} />
                              <span>{branch}</span>
                            </div>
                            {isCurrentSelection && (
                              <span className="flex items-center gap-1 text-[9px] font-black text-ink-600 uppercase tracking-widest bg-ink-50 px-2 py-0.5 rounded-md">
                                <Check className="w-3 h-3 stroke-[3]" />
                                Active
                              </span>
                            )}
                          </button>
                        );
                      })
                    ) : (
                      <div className="px-3.5 py-4 text-center text-xs font-bold text-stone-400 flex flex-col items-center gap-1 bg-stone-50/30">
                        <Building2 className="w-5 h-5 text-stone-300" />
                        <span>No branches match "{query}"</span>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="pt-2">
        <button
          disabled={!isModified}
          onClick={() => {
            const modifiedBrands = {};
            Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
              if (selectedBranches[brand] !== initialBranches[brand]) {
                modifiedBrands[brand] = true;
              }
            });

            localStorage.setItem('user_selected_branches', JSON.stringify(selectedBranches));
            setInitialBranches({ ...selectedBranches });
            setFlashingBrands(modifiedBrands);

            setTimeout(() => {
              setFlashingBrands({});
            }, 1500);
          }}
          className={`w-full py-4 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2 font-display ${
            isModified
              ? 'bg-stone-900 hover:bg-ink-600 text-white cursor-pointer shadow-md shadow-stone-200'
              : 'bg-stone-200 text-stone-400 cursor-not-allowed'
          }`}
        >
          Apply Changes
        </button>
      </div>
    </div>
  );
}

/* ===================== App.tsx ===================== */

function App() {
  // The live product loader streams results in page-by-page (see
  // loadLiveProducts's onUpdate callback in the boot sequence below) and
  // mutates the module-level `mockProducts` array directly rather than
  // holding it in React state, since ~30 places in this component already
  // read `mockProducts` as a plain closure variable. This tick is just a
  // signal to re-render after each page lands so those reads pick up the
  // new data; it carries no value of its own.
  const [liveProductsTick, forceLiveProductsTick] = useState(0);
  useEffect(() => {
    const bump = () => forceLiveProductsTick((t) => t + 1);
    (window.__liveProductListeners = window.__liveProductListeners || []).push(bump);
    return () => {
      window.__liveProductListeners = (window.__liveProductListeners || []).filter((fn) => fn !== bump);
    };
  }, []);

  // isLoggedIn: a real account (login/signup submitted). hasEnteredApp: has
  // passed the initial gate at all, either by logging in or by tapping
  // "Skip for now" -- guests get hasEnteredApp=true but isLoggedIn=false, so
  // they can browse/search but list functions, Deal Stats, and the
  // Add/Remove-from-list pills stay locked behind a login/create-account
  // prompt (see TrackedTab, ProfileTab, AppHeader, product card pills below).
  const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
  const [hasEnteredApp, setHasEnteredApp] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
  const [currentTab, setCurrentTab] = useState('search');
  const [previousTab, setPreviousTab] = useState('search');
  const [lastExternalTab, setLastExternalTab] = useState('search');
  const [selectedListId, setSelectedListId] = useState(null);
  const [lists, setLists] = useState(() => buildSeedLists(mockProducts));

  const activeList = lists.find(l => l.id === selectedListId) || lists[0];
  const trackedProductIds = activeList ? activeList.itemIds : [];
  const [isScannerOpen, setIsScannerOpen] = useState(false);
  const [isDealModalOpen, setIsDealModalOpen] = useState(false);
  // App()'s outer scroll container (bg-stone-100 ... overflow-y-auto) is the
  // same DOM node across the isDealModalOpen/currentTab branches below (React
  // reconciles it in place since it's the same element type at the same tree
  // position each render), so its scrollTop otherwise carries over from
  // whatever the user had scrolled to on the previous screen -- e.g. tapping
  // a product card lower down the home screen (cards are tappable as a
  // whole, see handleCardKeyActivate) landed the deal page already scrolled
  // down. Reset to top whenever the deal modal opens.
  const appScrollRef = useRef(null);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [selectedStore, setSelectedStore] = useState(null);
  const [snackbarMessage, setSnackbarMessage] = useState(null);
  const [listSelectorProduct, setListSelectorProduct] = useState(null);

  const [searchInputValue, setSearchInputValue] = useState('');
  const [activeSearchQuery, setActiveSearchQuery] = useState('');
  const [selectedStores, setSelectedStores] = useState(['all']);
  const [sortBy, setSortBy] = useState('cheapest');

  const [history, setHistory] = useState(() => buildSeedHistory(mockProducts));

  const [alerts, setAlerts] = useState(() => buildSeedAlerts(mockProducts));

  const showSnackbar = (message) => {
    // All floating feedback has been disabled across the entire application.
  };

  useEffect(() => {
    const isDropDownPage = currentTab === 'howitworks' || currentTab === 'manageaccount' || currentTab === 'settings' || currentTab === 'login';
    if (!isDropDownPage) {
      setLastExternalTab(currentTab);
    }
  }, [currentTab]);

  const handleTrackToggle = (productId) => {
    const product = mockProducts.find((p) => p.id === productId);
    if (product) {
      setListSelectorProduct(product);
    }
  };

  const renderListSelectorModal = () => {
    if (!listSelectorProduct) return null;
    return (
      <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div className="bg-white border border-stone-200 rounded-3xl max-w-xs w-full p-6 space-y-5 shadow-2xl animate-scaleUp">
          <div className="flex flex-col items-center text-center space-y-3">
            <div className="w-12 h-12 rounded-full bg-ink-50 border border-ink-100 flex items-center justify-center text-ink-600">
              <Bookmark className="w-6 h-6 stroke-[2]" />
            </div>
            <div className="space-y-1">
              <h3 className="text-lg font-black text-stone-900 tracking-tight uppercase">
                Add to Lists
              </h3>
              <p className="text-xs text-stone-500 font-medium leading-relaxed">
                Select lists for <span className="font-extrabold text-stone-800">{listSelectorProduct.name}</span>. You can select more than one list.
              </p>
            </div>
          </div>

          <div className="space-y-2 max-h-48 overflow-y-auto py-1 pr-1">
            {lists.map((list) => {
              const isInList = list.itemIds.includes(listSelectorProduct.id);
              return (
                <button
                  key={list.id}
                  onClick={() => {
                    setLists((prevLists) =>
                      prevLists.map((l) => {
                        if (l.id === list.id) {
                          const itemIds = isInList
                            ? l.itemIds.filter((id) => id !== listSelectorProduct.id)
                            : [...l.itemIds, listSelectorProduct.id];
                          return { ...l, itemIds };
                        }
                        return l;
                      })
                    );
                    showSnackbar(
                      isInList
                        ? `Removed from ${list.name}`
                        : `Added to ${list.name}`
                    );
                  }}
                  className={`w-full flex items-center justify-between p-3.5 rounded-2xl border transition-all cursor-pointer ${
                    isInList
                      ? 'bg-ink-50/50 border-ink-200 text-ink-950 font-extrabold'
                      : 'bg-white border-stone-200 text-stone-700 font-medium hover:bg-stone-50'
                  }`}
                >
                  <span className="text-xs uppercase tracking-wider">{list.name}</span>
                  <div className={`w-5 h-5 rounded-md border flex items-center justify-center transition-all ${
                    isInList
                      ? 'border-ink-600 bg-ink-600 text-white'
                      : 'border-stone-300 bg-white'
                  }`}>
                    {isInList && (
                      <svg className="w-3.5 h-3.5 stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </div>
                </button>
              );
            })}
          </div>

          <button
            onClick={() => setListSelectorProduct(null)}
            className="w-full bg-stone-900 hover:bg-ink-600 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all cursor-pointer active:scale-95 shadow-md shadow-stone-200"
          >
            Done
          </button>
        </div>
      </div>
    );
  };

  const handleClearList = () => {
    const activeId = selectedListId || 'list-1';
    setLists((prevLists) =>
      prevLists.map((list) => (list.id === activeId ? { ...list, itemIds: [] } : list))
    );
    const activeListName = lists.find((l) => l.id === activeId)?.name || 'List';
    showSnackbar(`Cleared all items from ${activeListName}`);
  };

  const handleDeleteList = (listId) => {
    const listName = lists.find((l) => l.id === listId)?.name || 'List';
    setLists((prevLists) => prevLists.filter((list) => list.id !== listId));
    if (selectedListId === listId) {
      setSelectedListId(null);
    }
    showSnackbar(`Deleted ${listName} successfully`);
  };

  const handleResetLists = () => {
    setLists([
      { id: 'list-1', name: 'List 1', itemIds: ['avalanche-sachets-10pk', 'fresh-apples-1kg', 'cadbury-milk-110g'] },
      { id: 'list-2', name: 'List 2', itemIds: ['meadow-fresh-milk-2l', 'lurpak-butter-250g', 'fresh-apples-1kg'] },
      { id: 'list-3', name: 'List 3', itemIds: ['avalanche-sachets-10pk', 'meadow-fresh-milk-2l', 'lurpak-butter-250g', 'cadbury-milk-110g'] },
    ]);
    setSelectedListId(null);
    showSnackbar('Restored default lists');
  };

  const handleCreateList = (name) => {
    const newId = `list-${Date.now()}`;
    setLists((prev) => [...prev, { id: newId, name, itemIds: [] }]);
    showSnackbar(`Created list "${name}" successfully`);
  };

  const handleLogin = () => {
    localStorage.setItem('isLoggedIn', 'true');
    setIsLoggedIn(true);
    setHasEnteredApp(true);
    showSnackbar('Welcome to Dodgy Deal!');
  };

  // Guest browsing: passes the initial gate without an account. List
  // functions/Deal Stats/list pills stay locked (isLoggedIn stays false)
  // until the guest logs in or creates an account via handleOpenLogin below.
  const handleSkip = () => {
    setHasEnteredApp(true);
  };

  // Opens the login/signup screen from within the app (guest tapping a
  // "Create Account / Log In" prompt) rather than the initial full-screen
  // gate -- returns to whatever tab they were on, via the 'login' tab branch
  // below and lastExternalTab.
  const handleOpenLogin = () => {
    setCurrentTab('login');
  };

  const handleLogout = () => {
    localStorage.removeItem('isLoggedIn');
    setIsLoggedIn(false);
    setHasEnteredApp(false);
    showSnackbar('Logged out successfully');
  };

  useEffect(() => {
    if (isDealModalOpen && appScrollRef.current) {
      appScrollRef.current.scrollTop = 0;
    }
  }, [isDealModalOpen]);

  const handleCheckDeal = (product, store) => {
    setSelectedProduct(product);
    setSelectedStore(store);
    setIsDealModalOpen(true);

    const alreadyLogged = history.some(h => h.productId === product.id && h.store === store);
    if (!alreadyLogged) {
      const deal = product.currentDeals.find(d => d.store === store);
      const newHistoryItem = {
        id: `hist-${Date.now()}`,
        productId: product.id,
        checkedAt: 'Just Now',
        store,
        price: deal ? deal.price : product.standardPrice,
        dealType: deal ? deal.dealType : 'Fair Price',
      };
      setHistory(prev => [newHistoryItem, ...prev]);
    }
  };

  const handleMarkAsRead = (id) => {
    setAlerts((prev) =>
      prev.map((alert) => (alert.id === id ? { ...alert, read: true } : alert))
    );
  };

  const handleClearAllAlerts = () => {
    setAlerts([]);
  };

  const stats = {
    totalChecked: history.length,
    realSavers: history.filter((h) => h.dealType === 'Real Saver' || h.dealType === 'Real Deal').length,
    dodgySpotted: history.filter((h) => h.dealType === 'Dodgy Deal').length,
    moneySaved: history.reduce((sum, h) => {
      const product = mockProducts.find((p) => p.id === h.productId);
      if (product) {
        const prices = [
          product.standardPrice,
          ...product.currentDeals.map((d) => d.price),
          ...product.currentDeals.map((d) => d.originalPrice),
          ...product.priceHistory.map((ph) => ph.price)
        ].filter((price) => typeof price === 'number' && price > 0);

        if (prices.length > 0) {
          const maxPrice = Math.max(...prices);
          const minPrice = Math.min(...prices);
          return sum + (maxPrice - minPrice);
        }
      }
      return sum;
    }, 0),
  };

  const getHeaderTitle = () => {
    switch (currentTab) {
      case 'search':
        return 'Dodgy Deal';
      case 'saved':
        return 'My List';
      case 'alerts':
        return 'Deal Warnings';
      case 'history':
        return 'All your checks';
      case 'profile':
        return 'Deal Stats';
      case 'howitworks':
        return 'How It Works';
      case 'manageaccount':
        return 'Manage Account';
      case 'settings':
        return 'Store Settings';
      default:
        return 'Dodgy Deal';
    }
  };

  if (!hasEnteredApp) {
    return (
      <div ref={appScrollRef} className="bg-stone-100 min-h-screen w-full flex justify-center items-start overflow-y-auto">
        <div className="bg-stone-50 min-h-screen w-full max-w-md relative shadow-2xl border-x border-stone-200/80 flex flex-col justify-between">
          <LoginPage onLogin={handleLogin} onSkip={handleSkip} />
        </div>
      </div>
    );
  }

  if (currentTab === 'login') {
    return (
      <div ref={appScrollRef} className="bg-stone-100 min-h-screen w-full flex justify-center items-start overflow-y-auto">
        <div className="bg-stone-50 min-h-screen w-full max-w-md relative shadow-2xl border-x border-stone-200/80 flex flex-col justify-between">
          <LoginPage
            onLogin={() => {
              handleLogin();
              setCurrentTab(lastExternalTab);
            }}
            onBack={() => setCurrentTab(lastExternalTab)}
          />
        </div>
      </div>
    );
  }

  if (isDealModalOpen && selectedProduct && selectedStore) {
    return (
      <div ref={appScrollRef} className="bg-stone-100 min-h-screen w-full flex justify-center items-start overflow-y-auto">
        <div className="bg-stone-50 min-h-screen w-full max-w-md relative shadow-2xl border-x border-stone-200/80 flex flex-col">
          <DealModal
            isOpen={isDealModalOpen}
            onClose={() => {
              setIsDealModalOpen(false);
              if (currentTab !== 'saved' && currentTab !== 'history') {
                setSearchInputValue('');
                setActiveSearchQuery('');
                setCurrentTab('search');
              }
            }}
            product={selectedProduct}
            dealStore={selectedStore}
            onTrackToggle={handleTrackToggle}
            isTracked={selectedProduct ? trackedProductIds.includes(selectedProduct.id) : false}
            trackedProductIds={trackedProductIds}
            isLoggedIn={isLoggedIn}
            onNavigateToSettings={() => {
              setIsDealModalOpen(false);
              setCurrentTab('settings');
            }}
            onNavigateToHowItWorks={() => {
              setIsDealModalOpen(false);
              setPreviousTab(currentTab);
              setCurrentTab('howitworks');
            }}
            onNavigateToManageAccount={() => {
              setIsDealModalOpen(false);
              setPreviousTab(currentTab);
              setCurrentTab('manageaccount');
            }}
            onNavigateToLogin={() => {
              setIsDealModalOpen(false);
              setCurrentTab('login');
            }}
            onLogout={() => {
              setIsDealModalOpen(false);
              handleLogout();
            }}
          />
          {renderListSelectorModal()}
        </div>
      </div>
    );
  }

  return (
    <div ref={appScrollRef} className="bg-stone-100 min-h-screen w-full flex justify-center items-start overflow-y-auto">
      <div className="bg-stone-50 text-stone-900 min-h-screen w-full max-w-md flex flex-col font-sans select-none pb-24 transition-colors duration-200 relative shadow-2xl border-x border-stone-200/80">

        <AppHeader
          title={getHeaderTitle()}
          showCloseButton={currentTab === 'manageaccount' || currentTab === 'settings' || currentTab === 'howitworks'}
          onCloseButtonClick={() => setCurrentTab(lastExternalTab)}
          isProfileHighlighted={currentTab === 'profile' || currentTab === 'howitworks'}
          isLoggedIn={isLoggedIn}
          onOpenHowItWorks={() => {
            setPreviousTab(currentTab);
            setCurrentTab('howitworks');
          }}
          onOpenManageAccount={() => {
            setPreviousTab(currentTab);
            setCurrentTab('manageaccount');
          }}
          onOpenSettings={() => {
            setPreviousTab(currentTab);
            setCurrentTab('settings');
          }}
          onOpenLogin={handleOpenLogin}
          onLogout={handleLogout}
        />

        <main className="w-full px-4 pt-4 flex-1">
          {currentTab === 'search' && (
            <SearchTab
              onCheckDeal={handleCheckDeal}
              onTrackToggle={handleTrackToggle}
              trackedProductIds={trackedProductIds}
              lists={lists}
              showSnackbar={showSnackbar}
              searchInputValue={searchInputValue}
              setSearchInputValue={setSearchInputValue}
              activeSearchQuery={activeSearchQuery}
              setActiveSearchQuery={setActiveSearchQuery}
              selectedStores={selectedStores}
              setSelectedStores={setSelectedStores}
              sortBy={sortBy}
              setSortBy={setSortBy}
              onNavigateToSettings={() => setCurrentTab('settings')}
              onOpenScanner={() => setIsScannerOpen(true)}
              isLoggedIn={isLoggedIn}
              productsVersion={liveProductsTick}
            />
          )}

          {currentTab === 'saved' && (
            <TrackedTab
              lists={lists}
              selectedListId={selectedListId}
              setSelectedListId={setSelectedListId}
              trackedProductIds={trackedProductIds}
              onTrackToggle={handleTrackToggle}
              onCheckDeal={handleCheckDeal}
              showSnackbar={showSnackbar}
              onClearList={handleClearList}
              onDeleteList={handleDeleteList}
              onResetLists={handleResetLists}
              onCreateList={handleCreateList}
              isLoggedIn={isLoggedIn}
              onOpenLogin={handleOpenLogin}
            />
          )}

          {currentTab === 'alerts' && (
            <AlertsTab
              alerts={alerts}
              onMarkAsRead={handleMarkAsRead}
              onClearAll={handleClearAllAlerts}
              showSnackbar={showSnackbar}
            />
          )}

          {currentTab === 'history' && (
            <HistoryTab
              history={history}
              onRecheck={handleCheckDeal}
              onTrackToggle={handleTrackToggle}
              trackedProductIds={trackedProductIds}
              lists={lists}
              showSnackbar={showSnackbar}
              isLoggedIn={isLoggedIn}
            />
          )}

          {currentTab === 'profile' && (
            <ProfileTab stats={stats} history={history} isLoggedIn={isLoggedIn} onOpenLogin={handleOpenLogin} />
          )}

          {currentTab === 'howitworks' && (
            <HowItWorksTab />
          )}

                ? 'text-ink-600'
                : 'text-stone-400 hover:text-stone-600'

}

/* ===================== boot ===================== */

(async () => {
  // loadLiveProducts streams results page by page instead of loading the
  // whole live catalogue before anything can render. We only block the
  // *first* render on the first page landing (or on the whole load
  // failing/finishing with nothing) -- every later page arrives via
  // onUpdate, mutates `mockProducts` in place, and pings whatever
  // `forceLiveProductsTick` listeners App() has registered so the already-
  // mounted UI picks up the new rows without a full remount.
  let resolveFirstPage;
  const firstPageReady = new Promise((resolve) => { resolveFirstPage = resolve; });
  let sawAnyPage = false;

  const finalLoad = loadLiveProducts((pageSoFar) => {
    mockProducts = pageSoFar;
    if (!sawAnyPage) {
      sawAnyPage = true;
      resolveFirstPage();
    }
    (window.__liveProductListeners || []).forEach((fn) => fn());
  }).catch((err) => {
    console.error('Live Supabase fetch failed, falling back to demo data:', err);
    return [];
  }).then((finalProducts) => {
    if (!sawAnyPage && !finalProducts.length) {
      console.warn('Supabase returned no usable current specials -- falling back to demo data.');
    }
    return finalProducts;
  });

  // Whichever comes first: the first page of real data, or the whole load
  // settling (covers both "zero current specials" and "fetch threw before
  // a single page completed") -- either way we stop blocking first render.
  await Promise.race([firstPageReady, finalLoad]);

  const root = createRoot(document.getElementById('root'));
  root.render(<App />);
})();
</script>

<script>
  const source = document.getElementById('app-source').textContent;
  const output = Babel.transform(source, {
    presets: [
      ["typescript", { isTSX: true, allExtensions: true }],
      ["react", { runtime: 'classic' }],
    ],
    filename: 'app.tsx',
  }).code;
  const blob = new Blob([output], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  import(url).catch((err) => {
    console.error(err);
    document.getElementById('root').innerHTML =
      '<pre style="padding:24px;color:#b91c1c;white-space:pre-wrap;font-family:monospace;">' +
      String(err && err.stack || err) + '</pre>';
  });
</script>
