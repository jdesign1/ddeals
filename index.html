// PostgREST caps responses (commonly 1000 rows) regardless of ?limit=, so
// anything that can exceed that must be paged with the Range header.
//
// Fetches page 1 with `Prefer: count=exact` to learn the true row count
// from the `Content-Range` response header, then fires every remaining
// page in parallel rather than one-at-a-time. This matters now that
// `current_prices` is fetched WITHOUT the is_special filter (~12.7k rows,
// full catalogue, not just the ~4.4k on-special subset) -- measured
// 2026-07-10: ~6s sequential vs ~1.5s parallel for the full table.
async function fetchAllRows(path) {
  const page = 1000;
  const MAX_PAGES = 100; // safety cap: 100k rows

  const fetchPage = async (start, extraHeaders) => {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Range-Unit': 'items',
        Range: `${start}-${start + page - 1}`,
        ...extraHeaders,
      },
    });
    if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
    return res;
  };

  const firstRes = await fetchPage(0, { Prefer: 'count=exact' });
  const firstData = await firstRes.json();
  const contentRange = firstRes.headers.get('content-range'); // e.g. "0-999/12702"
  const total = contentRange && contentRange.includes('/') ? parseInt(contentRange.split('/')[1], 10) : NaN;

  if (!Number.isFinite(total) || firstData.length < page) {
    return firstData; // no exact count available, or that one page was everything
  }

  const remainingPages = Math.min(Math.ceil((total - page) / page), MAX_PAGES - 1);
  const restResponses = await Promise.all(
    Array.from({ length: remainingPages }, (_, i) => fetchPage(page * (i + 1)))
  );
  const restData = await Promise.all(restResponses.map((res) => res.json()));
  return firstData.concat(...restData);
}

// Batched `in.(...)` lookups -- PostgREST/URL length gets risky past a few
// hundred UUIDs in one query string, so chunk the id list. Chunks are
// independent lookups (order doesn't matter, only used to build maps
// afterwards) so they're fired in parallel -- with the is_special filter
// gone, a page's worth of match groups can span several hundred product
// ids (several chunks), and this used to run them one at a time.
async function fetchByIds(path, column, select, ids, chunkSize = 100) {
  const chunks = [];
  for (let i = 0; i < ids.length; i += chunkSize) {
    chunks.push(ids.slice(i, i + chunkSize));
  }
  const results = await Promise.all(
    chunks.map(async (chunk) => {
      const url = `${SUPABASE_URL}/rest/v1/${path}?select=${select}&${column}=in.(${chunk.join(',')})`;
      const res = await fetch(url, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      });
      if (!res.ok) throw new Error(`${path} in-lookup -> HTTP ${res.status}`);
      return res.json();
    })
  );
  return results.flat();
}

function median(nums) {
  if (!nums.length) return null;
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

const LOOKBACK_DAYS = 30;
const DODGY_THRESHOLD = 5;    // % pre-sale inflation to flag dodgy
const GENUINE_THRESHOLD = 10; // % saving to count as genuine
const MARGINAL_THRESHOLD = 3; // % saving floor for "marginal"
const DAY_MS = 24 * 60 * 60 * 1000;

// Classifies one (product_id, store_id) current special using its own
// price_history series. Mirrors dodgy_deals_view.sql exactly:
//   normal_price = median of pre-sale prices within the 30-day lookback
//   inflate_pct  = how much price was pumped in the 7 days before the sale
//   verdict: UNKNOWN (no history) / DODGY (fake markup) / GENUINE (>=10% off)
//            / MARGINAL (3-10% off, or nothing better established)
function classifySpecial(salePrice, historyRows) {
  const sorted = [...historyRows].sort((a, b) => new Date(a.scraped_at) - new Date(b.scraped_at));

  // Walk backwards while is_special=true to find when the current streak began.
  let saleStartedAt = null;
  for (let i = sorted.length - 1; i >= 0; i--) {
    if (sorted[i].is_special) {
      saleStartedAt = new Date(sorted[i].scraped_at);
    } else {
      break;
    }
  }
  if (saleStartedAt === null) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice: null, savingPct: null };
  }

  const preSale = sorted.filter((r) => !r.is_special && new Date(r.scraped_at) < saleStartedAt && r.price != null);
  if (!preSale.length) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice: null, savingPct: null };
  }

  const lookbackCutoff = new Date(saleStartedAt.getTime() - LOOKBACK_DAYS * DAY_MS);
  const recentPreSale = preSale.filter((r) => new Date(r.scraped_at) >= lookbackCutoff);
  const normalPrice = median((recentPreSale.length ? recentPreSale : preSale).map((r) => r.price));

  const sevenDayCutoff = new Date(saleStartedAt.getTime() - 7 * DAY_MS);
  const veryEarly = preSale.filter((r) => new Date(r.scraped_at) < sevenDayCutoff).map((r) => r.price);
  const preSaleRecent = preSale.filter((r) => new Date(r.scraped_at) >= sevenDayCutoff).map((r) => r.price);
  let inflatePct = 0;
  if (veryEarly.length && preSaleRecent.length) {
    const baseline = median(veryEarly);
    const peak = Math.max(...preSaleRecent);
    inflatePct = baseline ? ((peak - baseline) / baseline) * 100 : 0;
  }

  const savingPct = normalPrice ? ((normalPrice - salePrice) / normalPrice) * 100 : 0;

  if (normalPrice == null) {
    return { verdict: 'UNKNOWN', reason: 'Not enough price history to judge', normalPrice, savingPct: null };
  }
  if (salePrice > normalPrice) {
    return {
      verdict: 'DODGY',
      reason: `Sale price ($${salePrice.toFixed(2)}) is HIGHER than the normal price ($${normalPrice.toFixed(2)}) -- fake deal`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  if (inflatePct >= DODGY_THRESHOLD && savingPct < GENUINE_THRESHOLD) {
    return {
      verdict: 'DODGY',
      reason: `Price was raised ${inflatePct.toFixed(1)}% just before the sale -- you're only saving ${savingPct.toFixed(1)}%`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  if (savingPct >= GENUINE_THRESHOLD) {
    return {
      verdict: 'GENUINE',
      reason: `Saving ${savingPct.toFixed(1)}% vs the recent normal price`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  if (savingPct >= MARGINAL_THRESHOLD) {
    return {
      verdict: 'MARGINAL',
      reason: `Only a ${savingPct.toFixed(1)}% saving -- barely worth it`,
      normalPrice,
      savingPct: Math.round(savingPct * 10) / 10,
    };
  }
  return {
    verdict: 'MARGINAL',
    reason: 'Minimal saving vs normal price',
    normalPrice,
    savingPct: Math.round(savingPct * 10) / 10,
  };
}

// ---- Real cross-store product matching --------------------------------
// Two reviewed/approved match tables already exist in the database (built
// by the identity-matching pipeline, see project.md):
//   products.canonical_product_id -- exact SKU matches (272 linked products
//     / 158 distinct cross-store groups at last count)
//   app_comparable_family_links   -- looser but manually-reviewed "fair to
//     compare" matches, e.g. same item different pack size (332 rows,
//     spans Pak'nSave/New World/Woolworths/Four Square, not just
//     within-Foodstuffs)
// Union-find over both edge sets turns these into connected components --
// e.g. Woolworths' "Heinz Ketchup" row and New World's "Heinz Ketchup" row
// (different products.id each, one per retailer catalogue) resolve to the
// same group id, so their current specials get merged onto one product
// card instead of showing up as two unrelated products.
async function buildMatchIndex() {
  const [canonicalRows, comparableRows] = await Promise.all([
    fetchAllRows('products?select=id,canonical_product_id&canonical_product_id=not.is.null'),
    fetchAllRows('app_comparable_family_links?select=left_product_id,right_product_id'),
  ]);

  const parent = new Map();
  const find = (x) => {
    if (!parent.has(x)) parent.set(x, x);
    let root = x;
    while (parent.get(root) !== root) root = parent.get(root);
    let cur = x;
    while (parent.get(cur) !== root) {
      const next = parent.get(cur);
      parent.set(cur, root);
      cur = next;
    }
    return root;
  };
  const union = (a, b) => {
    const ra = find(a);
    const rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };

  for (const row of canonicalRows) union(row.id, row.canonical_product_id);
  for (const row of comparableRows) union(row.left_product_id, row.right_product_id);

  return { find, edgeCount: canonicalRows.length + comparableRows.length };
}

// Field-by-field merge across every retailer's own product row in a match
// group, so a group still displays a full card even if e.g. only the
// Woolworths listing has an image_url or only the New World listing has a
// category set.
function mergeProductMeta(memberMetas) {
  const pick = (field) => memberMetas.map((m) => m && m[field]).find((v) => v != null && v !== '') || null;
  return {
    name: pick('name'),
    brand: pick('brand'),
    category: pick('category'),
    image_url: pick('image_url'),
    unit_size: pick('unit_size'),
  };
}

const VERDICT_TO_DEAL_TYPE = { DODGY: 'Dodgy Deal', GENUINE: 'Real Deal', MARGINAL: 'Fair Price' };
const titleCase = (s) => (s || '').replace(/\b\w/g, (c) => c.toUpperCase());

// Strips everything but letters/numbers before comparing search text, so
// punctuation/spacing differences between how a product is actually named
// in the database and how a shopper types it don't cause false misses --
// e.g. "Weetbix" (how most people type it) vs the DB's "Weet-Bix", or
// "PAK'nSAVE" vs "paknsave" (same normalisation already used for store-name
// matching elsewhere in this file, applied here to product search text too).
const normalizeSearchText = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

// Splits into normalised whole-word tokens, e.g. for telling an exact word
// match ("milk" in "Standard Milk") apart from an incidental substring
// inside a longer, unrelated word ("milk" inside "Milky", "butter" inside
// "Buttery"/"Butterscotch"/"Buttermilk-flavoured Chips").
const tokenizeSearchText = (s) => (s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

// Relevance score for ranking search results -- without this, a plain
// substring match with no ranking left cheap incidental hits (a "Butter
// Chicken" simmer sauce, "Buttery" spread, "Milk Arrowroot" biscuits) sorted
// ahead of the actual milk/butter category items a shopper searching "milk"
// or "butter" is looking for, since the default sort is cheapest-price-first
// and snacks/sauces are usually cheaper than a carton of milk or block of
// butter. Category match (the product's real aisle/category) ranks highest,
// then an exact word match in the name, then brand, then finally the same
// permissive substring match used for inclusion (so "milky"/"buttery"-type
// items still show up, just ranked below the literal category matches).
const getSearchRelevance = (product, query) => {
  const queryTokens = tokenizeSearchText(query);
  if (queryTokens.length === 0) return 1;
  const isWholeWordMatch = (text) => {
    const tokens = tokenizeSearchText(text);
    return queryTokens.every((qt) => tokens.includes(qt));
  };
  if (isWholeWordMatch(product.category)) return 4;
  if (isWholeWordMatch(product.name)) return 3;
  if (isWholeWordMatch(product.brand)) return 2;
  return 1;
};

// Shared fallback used both when a product row has no image_url in the
// database and as an <img onError> safety net if a stored URL 404s/expires.
const FALLBACK_PRODUCT_IMAGE = 'https://placehold.co/300x300?text=No+Image';

// Renders a product's real photo (from products.image_url in Supabase) with
// a placeholder fallback. Used everywhere a card previously showed a static
// "Product Image" text box instead of an actual image.
function ProductImage({ src, alt, className }) {
  return (
    <img
      src={src || FALLBACK_PRODUCT_IMAGE}
      alt={alt || 'Product'}
      loading="lazy"
      draggable="false"
      className={className}
      onError={(e) => {
        if (e.currentTarget.src !== FALLBACK_PRODUCT_IMAGE) {
          e.currentTarget.onerror = null;
          e.currentTarget.src = FALLBACK_PRODUCT_IMAGE;
        }
      }}
    />
  );
}

// Builds full product cards (metadata + classified deals + price history)
// for one page's worth of match-groups. Kept separate from the pagination
// loop below so each page only fetches products/price_history for the
// group members actually in that page, not the whole live set at once.
async function buildProductCardsForGroups(pageGroups, storeNameById) {
  const allProductIds = [...new Set(pageGroups.flatMap(([, rows]) => rows.map((r) => r.product_id)))];
  const [productRows, historyRows] = await Promise.all([
    fetchByIds('products', 'id', 'id,name,brand,category,image_url,unit_size', allProductIds),
    fetchByIds('price_history', 'product_id', 'product_id,store_id,price,is_special,scraped_at', allProductIds),
  ]);

  const productById = new Map(productRows.map((p) => [p.id, p]));
  const historyByPair = new Map();
  for (const row of historyRows) {
    const key = `${row.product_id}::${row.store_id}`;
    if (!historyByPair.has(key)) historyByPair.set(key, []);
    historyByPair.get(key).push(row);
  }
  const storeName = (id) => storeNameById.get(id) || STORE_DISPLAY_FALLBACK[id] || titleCase(id);

  const products = [];
  for (const [groupId, rows] of pageGroups) {
    const memberIds = [...new Set(rows.map((r) => r.product_id))];
    const meta = mergeProductMeta(memberIds.map((id) => productById.get(id)));
    if (!meta.name) continue;

    const currentDeals = [];
    const priceHistory = [];
    const normalPrices = [];

    for (const row of rows) {
      const pairHistory = historyByPair.get(`${row.product_id}::${row.store_id}`) || [];

      if (row.is_special) {
        // Actively promoted special -- run it through the real DODGY/
        // GENUINE/MARGINAL/UNKNOWN classifier, same as before.
        const verdict = classifySpecial(row.price, pairHistory);
        if (verdict.verdict !== 'UNKNOWN') {
          if (verdict.normalPrice != null) normalPrices.push(verdict.normalPrice);
          currentDeals.push({
            store: storeName(row.store_id),
            price: row.price,
            originalPrice: verdict.normalPrice ?? row.was_price ?? row.price,
            discountPercentage: Math.max(0, Math.round(verdict.savingPct ?? 0)),
            dealType: VERDICT_TO_DEAL_TYPE[verdict.verdict],
            wasArtificiallyInflated: verdict.verdict === 'DODGY',
            reason: verdict.verdict === 'DODGY' ? 'Artificial Discount (Was-Is Trap)' : verdict.verdict === 'GENUINE' ? 'Genuine Sale' : 'Standard Special',
            explanation: verdict.reason,
            isOnSpecial: true,
          });
        }
        // UNKNOWN (no usable history) still falls through with no deal
        // entry for this store -- unchanged behaviour from before.
      } else {
        // Not currently on special -- no verdict to render (there's no
        // "deal" to judge), but the item still belongs in the catalogue so
        // it's browsable/searchable and its price history is visible.
        currentDeals.push({
          store: storeName(row.store_id),
          price: row.price,
          originalPrice: row.price,
          discountPercentage: 0,
          dealType: 'Fair Price',
          wasArtificiallyInflated: false,
          reason: 'Regular Price',
          explanation: 'Not currently on special -- this is the regular shelf price.',
          isOnSpecial: false,
        });
      }

      for (const h of pairHistory) {
        priceHistory.push({
          date: new Date(h.scraped_at).toLocaleDateString('en-NZ', { month: 'short', day: '2-digit' }),
          price: h.price,
          isPromo: h.is_special,
          store: storeName(row.store_id),
        });
      }
    }

    if (!currentDeals.length) continue; // no usable row in this group (e.g. only UNKNOWN specials, no plain price)

    // The identity-matching pipeline occasionally links two distinct
    // retailer catalogue rows from the *same* store into one match group
    // (a known upstream data-quality quirk, not something to silently
    // trust) -- e.g. two separate Pak'nSave product rows both canonical-
    // linked to the same Woolworths item. The UI (and its React keys)
    // assumes one deal per store per card, so collapse to the best
    // (lowest) price per store here rather than showing contradictory
    // duplicate rows for the same shop.
    const bestDealByStore = new Map();
    for (const deal of currentDeals) {
      const existing = bestDealByStore.get(deal.store);
      if (!existing || deal.price < existing.price) bestDealByStore.set(deal.store, deal);
    }
    const dedupedDeals = [...bestDealByStore.values()];

    products.push({
      id: groupId,
      brand: titleCase(meta.brand) || 'Unbranded',
      name: titleCase(meta.name),
      category: meta.category || 'Grocery',
      image: meta.image_url || FALLBACK_PRODUCT_IMAGE,
      standardPrice: normalPrices.length ? Math.min(...normalPrices) : Math.min(...rows.map((r) => r.price)),
      unit: meta.unit_size || '',
      currentDeals: dedupedDeals,
      priceHistory,
      description: '',
    });
  }
  return products;
}

// Groups per page, not products -- a group can span several product_ids
// (real cross-store matches), so this keeps each page's products/
// price_history fetch bounded regardless of total catalogue size.
const GROUPS_PER_PAGE = 250;

// Loads EVERY current-priced item (no cap, no is_special filter -- per
// 2026-07-10 discussion: users should be able to find any item the
// supermarkets stock, not just ones currently on special, so they can see
// an item's price history even when it isn't discounted right now),
// grouped into real cross-store match groups, and streams results back in
// pages via `onUpdate(cumulativeProductsSoFar)` so the app can render the
// first page immediately and keep filling in the rest in the background
// rather than blocking on one giant fetch. Groups with more distinct real
// stores AND an active special are processed first so the richest,
// most-actionable comparisons show up in the earliest, fastest-rendering
// page; plain (non-special) items still load, just later.
async function loadLiveProducts(onUpdate) {
  const [allCurrentPrices, storeRows, matchIndex] = await Promise.all([
    fetchAllRows('current_prices?select=product_id,store_id,price,was_price,is_special,special_label'),
    fetchAllRows('stores?select=id,name'),
    buildMatchIndex(),
  ]);
  if (!allCurrentPrices.length) return [];
  const storeNameById = new Map(storeRows.map((s) => [s.id, s.name]));

  const byGroup = new Map();
  for (const row of allCurrentPrices) {
    const groupId = matchIndex.find(row.product_id);
    if (!byGroup.has(groupId)) byGroup.set(groupId, []);
    byGroup.get(groupId).push(row);
  }

  // Groups with an active special first (most immediately useful), then
  // richest (most real cross-store) comparisons, product-count as a stable
  // tiebreaker so page contents are reproducible run to run. Plain
  // (non-special) groups still load, just in later pages.
  const groups = [...byGroup.entries()].sort((a, b) => {
    const specialA = a[1].some((r) => r.is_special) ? 1 : 0;
    const specialB = b[1].some((r) => r.is_special) ? 1 : 0;
    const storesA = new Set(a[1].map((r) => r.store_id)).size;
    const storesB = new Set(b[1].map((r) => r.store_id)).size;
    return specialB - specialA || storesB - storesA || b[1].length - a[1].length;
  });

  const allProducts = [];
  for (let i = 0; i < groups.length; i += GROUPS_PER_PAGE) {
    const page = groups.slice(i, i + GROUPS_PER_PAGE);
    const pageProducts = await buildProductCardsForGroups(page, storeNameById);
    allProducts.push(...pageProducts);
    if (onUpdate) onUpdate(allProducts.slice());
    // Yield to the event loop between pages so the UI thread isn't blocked
    // and already-rendered pages stay interactive while the rest loads.
    await new Promise((resolve) => setTimeout(resolve, 0));
  }

  return allProducts;
}

// Builds working demo content for the tracked-items/history/alerts tabs out
// of whatever real products actually loaded, since those tabs stay local
// mock state (per project scope) but previously pointed at the old
// hardcoded mock product ids -- which no longer exist once real UUIDs are
// in play.
function buildSeedLists(products) {
  const ids = products.slice(0, 6).map((p) => p.id);
  if (!ids.length) return [{ id: 'list-1', name: 'List 1', itemIds: [] }];
  return [
    { id: 'list-1', name: 'List 1', itemIds: ids.slice(0, 3) },
    { id: 'list-2', name: 'List 2', itemIds: ids.slice(2, 5) },
    { id: 'list-3', name: 'List 3', itemIds: ids.length > 3 ? [ids[0], ids[3], ids[ids.length - 1]] : ids },
  ];
}

const HISTORY_DEAL_TYPE = { 'Dodgy Deal': 'Dodgy Deal', 'Real Deal': 'Real Saver', 'Fair Price': 'Fair Deal' };

function buildSeedHistory(products) {
  return products.slice(0, 9).map((p, idx) => {
    const deal = p.currentDeals[0];
    return {
      id: `hist-${idx + 1}`,
      productId: p.id,
      checkedAt: idx < 3 ? ['10:24 AM', '08:15 AM', '4:45 PM'][idx] : `Jul ${Math.max(1, 9 - idx)}`,
      store: deal.store,
      price: deal.price,
      dealType: HISTORY_DEAL_TYPE[deal.dealType] || 'Fair Deal',
    };
  });
}

function buildSeedAlerts(products) {
  return products.slice(0, 4).map((p, idx) => {
    const deal = p.currentDeals[0];
    return {
      id: `alert-${idx + 1}`,
      productId: p.id,
      store: deal.store,
      oldPrice: deal.originalPrice,
      newPrice: deal.price,
      alertType: deal.dealType,
      timestamp: idx === 0 ? 'Today' : idx === 1 ? 'Yesterday' : `${idx} days ago`,
      read: idx > 1,
    };
  });
}

function SearchTab({
  onCheckDeal,
  onTrackToggle,
  trackedProductIds,
  lists = [],
  showSnackbar,
  searchInputValue,
  setSearchInputValue,
  activeSearchQuery,
  setActiveSearchQuery,
  selectedStores,
  setSelectedStores,
  sortBy,
  setSortBy,
  onNavigateToSettings,
  onOpenScanner,
}) {
  const [isAllDealsExpanded, setIsAllDealsExpanded] = React.useState(false);

  // Full-screen search view -- opens as soon as the user types the first
  // character into the search bar (see renderSearchBar's onChange below),
  // and closes automatically once the field is cleared back to empty
  // (backspacing it all out, tapping the X, or tapping the back arrow).
  const [isSearchActive, setIsSearchActive] = React.useState(false);
  React.useEffect(() => {
    if (searchInputValue.trim() === '') {
      setIsSearchActive(false);
    }
  }, [searchInputValue]);

  const [usePersonalised, setUsePersonalised] = React.useState(() => {
    return localStorage.getItem('use_personalised_settings') === 'true';
  });

  const [selectedBranches] = React.useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    const defaults = {
      'Woolworths': 'Woolworths CBD',
      "PAK'nSAVE": "PAK'nSAVE Mt Albert",
      'New World': 'New World Victoria Park',
      'Four Square': 'Four Square Ellerslie',
      'FreshChoice': 'FreshChoice Half Moon Bay',
    };
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square', 'FreshChoice'].forEach(brand => {
            loaded[brand] = parsed[brand] || defaults[brand];
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    return defaults;
  });

  // Filter products matching search query. Normalised on both sides (see
  // normalizeSearchText) so punctuation/spacing quirks in how a product is
  // named in the database -- "Weet-Bix" vs a shopper typing "Weetbix" -- don't
  // cause a real, in-stock item to fail to show up at all.
  const filteredProducts = mockProducts.filter((p) => {
    const query = normalizeSearchText(activeSearchQuery.trim());
    const matchesSearch =
      normalizeSearchText(p.name).includes(query) ||
      normalizeSearchText(p.brand).includes(query) ||
      normalizeSearchText(p.category).includes(query);
    return matchesSearch;
  });

  // No more explicit "Search" submit button (it's been replaced by the
  // barcode-scan button below) -- results now live-filter as the user
  // types, so form submission is just swallowed to stop a stray Enter key
  // press from reloading the page.
  const handleSearchFormSubmit = (e) => {
    e.preventDefault();
  };

  const handleSearchInputChange = (e) => {
    const value = e.target.value;
    setSearchInputValue(value);
    setActiveSearchQuery(value);
    if (value.length > 0) {
      setIsSearchActive(true);
    }
  };

  const handleClearSearch = () => {
    setSearchInputValue('');
    setActiveSearchQuery('');
    setIsSearchActive(false);
    showSnackbar('Cleared search results');
  };

  const getStoreDisplayName = (storeKey) => {
    if (usePersonalised) {
      switch (storeKey.toLowerCase()) {
        case 'woolworths': return selectedBranches['Woolworths'] || 'Woolworths';
        case 'paknsave': return selectedBranches["PAK'nSAVE"] || "PAK'nSAVE";
        case 'newworld': return selectedBranches['New World'] || 'New World';
        case 'foursquare': return selectedBranches['Four Square'] || 'Four Square';
        case 'freshchoice': return selectedBranches['FreshChoice'] || 'FreshChoice';
        default: return storeKey;
      }
    }
    switch (storeKey.toLowerCase()) {
      case 'woolworths': return 'Woolworths';
      case 'paknsave': return "PAK'nSAVE";
      case 'newworld': return 'New World';
      case 'foursquare': return 'Four Square';
      case 'freshchoice': return 'FreshChoice';
      default: return storeKey;
    }
  };

  const getStoreLogoMeta = (storeName) => {
    const STORE_LOGOS = {
      'Woolworths': { short: 'WW', bg: 'bg-emerald-600', text: 'text-white' },
      "PAK'nSAVE": { short: 'PNS', bg: 'bg-amber-500', text: 'text-slate-950' },
      'New World': { short: 'NW', bg: 'bg-rose-600', text: 'text-white' },
      'Four Square': { short: 'FS', bg: 'bg-green-600', text: 'text-white' },
      'FreshChoice': { short: 'FC', bg: 'bg-sky-600', text: 'text-white' },
    };
    const norm = storeName.toLowerCase().replace(/[^a-z]/g, '');
    if (norm.includes('woolworth')) return STORE_LOGOS['Woolworths'];
    if (norm.includes('paknsave')) return STORE_LOGOS["PAK'nSAVE"];
    if (norm.includes('newworld')) return STORE_LOGOS['New World'];
    if (norm.includes('foursquare')) return STORE_LOGOS['Four Square'];
    if (norm.includes('freshchoice')) return STORE_LOGOS['FreshChoice'];
    return { short: storeName.substring(0, 2).toUpperCase(), bg: 'bg-slate-600', text: 'text-white' };
  };

  const handleStoreToggle = (storeId) => {
    if (storeId === 'all') {
      setSelectedStores(['all']);
    } else {
      let nextStores = [...selectedStores];
      if (nextStores.includes('all')) {
        nextStores = [storeId];
      } else {
        if (nextStores.includes(storeId)) {
          nextStores = nextStores.filter((id) => id !== storeId);
          if (nextStores.length === 0) {
            nextStores = ['all'];
          }
        } else {
          nextStores.push(storeId);
        }
      }
      setSelectedStores(nextStores);
    }
  };

  // Filter products matching selected stores. Every item the supermarkets
  // stock is browsable here now, not just ones currently on special --
  // "all stores" just needs the product to be sold/priced somewhere.
  const matchedProducts = filteredProducts.filter((product) => {
    if (selectedStores.includes('all')) {
      return product.currentDeals.length > 0;
    }
    return product.currentDeals.some((deal) => {
      const normalizedDealStore = deal.store.toLowerCase().replace(/[^a-z]/g, '');
      return selectedStores.some((selected) => {
        const normalizedSelectedStore = selected.toLowerCase().replace(/[^a-z]/g, '');
        return normalizedDealStore === normalizedSelectedStore;
      });
    });
  });

  // Sort products. Relevance to the search query comes first (see
  // getSearchRelevance -- category matches beat name matches beat brand
  // matches beat incidental substring-only matches), so the actual "Milk" or
  // "Butter" category items surface ahead of things that merely mention the
  // word in passing (a "Butter Chicken" sauce, "Milky" candy). The user's
  // chosen sort (cheapest / biggest discount / dodgy rating) still applies,
  // just as the tiebreaker *within* each relevance tier rather than
  // overriding it -- otherwise a 99c snack that happens to match the query
  // would keep beating the actual product being searched for.
  const sortedProducts = [...matchedProducts].sort((a, b) => {
    const relevanceDiff = getSearchRelevance(b, activeSearchQuery) - getSearchRelevance(a, activeSearchQuery);
    if (relevanceDiff !== 0) return relevanceDiff;

    const getBestPrice = (p) => Math.min(...p.currentDeals.map((d) => d.price));
    const getMaxDiscount = (p) => Math.max(...p.currentDeals.map((d) => d.discountPercentage));
    const getDodgyScore = (p) =>
      p.currentDeals.some((d) => d.dealType === 'Dodgy Deal')
        ? 2
        : p.currentDeals.some((d) => d.dealType === 'Fair Price')
        ? 1
        : 0;

    if (sortBy === 'cheapest') {
      return getBestPrice(a) - getBestPrice(b);
    }
    if (sortBy === 'discount') {
      return getMaxDiscount(b) - getMaxDiscount(a);
    }
    if (sortBy === 'dodgy-rating') {
      return getDodgyScore(b) - getDodgyScore(a);
    }
    return 0;
  });

  // Unique count of retailers offering these deals
  const totalRetailersCount = new Set(
    matchedProducts.flatMap((p) => p.currentDeals.map((d) => d.store))
  ).size;

  const handleTrackClick = (productId, productName) => {
    onTrackToggle(productId);
    const isCurrentlyTracked = trackedProductIds.includes(productId);
    if (!isCurrentlyTracked) {
      showSnackbar(`Tracking enabled for ${productName}`);
    } else {
      showSnackbar(`Removed tracking for ${productName}`);
    }
  };

  // Rendered both inline on the home screen and pinned to the top of the
  // full-screen search view once active -- same controlled input/state
  // either way, just a plain helper (not a nested component) so re-renders
  // on every keystroke don't remount the <input> and steal focus.
  const renderSearchBar = (autoFocus) => (
    <form
      onSubmit={handleSearchFormSubmit}
      className="flex items-center bg-white rounded-xl pl-4 pr-2 py-2 border border-slate-200 focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-xs"
    >
      <Search className="text-slate-400 w-5 h-5 mr-3 flex-shrink-0" />
      <input
        id="search-input"
        autoFocus={autoFocus}
        className="bg-transparent border-none focus:outline-none w-full text-sm font-bold text-slate-900 placeholder:text-slate-400 tracking-wider h-10"
        placeholder="Search for products..."
        type="text"
        value={searchInputValue}
        onChange={handleSearchInputChange}
        enterKeyHint="search"
      />
      {searchInputValue && (
        <button
          onClick={handleClearSearch}
          id="clear-search-btn"
          className="text-slate-400 hover:text-slate-700 p-1 rounded-full hover:bg-slate-50 cursor-pointer flex-shrink-0"
          type="button"
        >
          <X className="w-5 h-5" />
        </button>
      )}
      <button
        type="button"
        onClick={onOpenScanner}
        id="scan-barcode-btn"
        title="Scan a barcode"
        aria-label="Scan a barcode"
        className="ml-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 p-2.5 rounded-lg cursor-pointer transition-colors flex-shrink-0 border border-indigo-100 flex items-center justify-center"
      >
        <Camera className="w-4 h-4" />
      </button>
    </form>
  );

  return (
    <div className="space-y-6">
      {/* Short description shown BEFORE a search is conducted */}
      {!isSearchActive && (
        <div className="space-y-4 text-center py-4">
          <div className="flex justify-center">
            <div className="w-12 h-12 bg-indigo-600 rounded-[2px] transform rotate-45 flex items-center justify-center shadow-lg">
              <Sparkles className="w-6 h-6 text-white transform -rotate-45" />
            </div>
          </div>
          <div className="space-y-2 max-w-sm mx-auto">
            <h2 className="text-3xl font-black tracking-tighter text-slate-900 font-display">
              DODGY DEAL
            </h2>
            <p className="text-xs text-slate-500 font-medium leading-relaxed">
              An app that allows you to search and compare for sales across the main supermarkets in Aotearoa, New Zealand.
            </p>
          </div>
        </div>
      )}

      {/* Persistent Search Bar */}
      {!isSearchActive && (
        <section className="relative">{renderSearchBar(false)}</section>
      )}

      {/* Generic Specials Alert - Highlight items on sale in user's lists */}
      {!isSearchActive && (() => {
        // Collect all product IDs in any list
        const allListProductIds = Array.from(new Set(lists.flatMap((l) => l.itemIds)));

        const listItemsOnSale = mockProducts.filter((p) => {
          const isInList = allListProductIds.includes(p.id);
          // isOnSpecial is undefined on FALLBACK_PRODUCTS mock deals (all
          // treated as active deals, unchanged) but explicitly false on
          // live regular-priced rows -- only real specials belong in this
          // "on sale" widget, browse-all items show up via search instead.
          const hasActiveSpecial =
            p.currentDeals && p.currentDeals.some((d) => d.isOnSpecial !== false);
          return isInList && hasActiveSpecial;
        });

        if (listItemsOnSale.length === 0) return null;

        const displayedItems = isAllDealsExpanded
          ? listItemsOnSale
          : listItemsOnSale.slice(0, listItemsOnSale.length > 2 ? 3 : 2);

        return (
          <div className="space-y-4">
            <div className="space-y-1 pb-1 text-center">
              <h3 className="text-lg font-black tracking-tight text-slate-900 font-display uppercase">
                Your Items on Special
              </h3>
              <p className="text-xs text-slate-500 font-semibold">
                {listItemsOnSale.length} {listItemsOnSale.length === 1 ? 'item' : 'items'} from your lists are currently on sale
              </p>
            </div>

            <div className="bg-slate-100/80 border border-slate-200 rounded-3xl p-4.5 md:p-5 space-y-4 shadow-sm shadow-slate-100/50">
              <div className="grid grid-cols-1 gap-4">
                {displayedItems.map((product, idx) => {
                  const isTracked = trackedProductIds.includes(product.id);
                  const bestDeal = product.currentDeals.reduce((best, d) =>
                    d.price < best.price ? d : best
                  , product.currentDeals[0]);

                  const dealsList = product.currentDeals || [];
                  const lowestPrice = dealsList.reduce((min, d) => d.price < min ? d.price : min, dealsList[0]?.price || 0);

                  const isPartiallyVisible = !isAllDealsExpanded && idx === 2;

                  return (
                    <div
                      key={`sale-alert-${product.id}-${idx}`}
                      className={`relative bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col group transition-all duration-200 ${
                        isPartiallyVisible
                          ? 'h-24 pointer-events-none select-none border-dashed border-slate-300'
                          : 'hover:shadow-lg hover:shadow-slate-100'
                      }`}
                    >
                      {!isPartiallyVisible && (
                        <button
                          onClick={() => handleTrackClick(product.id, product.name)}
                          id={`track-alert-${product.id}`}
                          className={`absolute top-4 right-4 px-2.5 py-1.5 rounded-lg border text-[10px] font-bold uppercase tracking-wider z-10 transition-colors active:scale-97 cursor-pointer ${
                            isTracked
                              ? 'border-red-200 text-red-600 bg-red-50 hover:bg-red-100/50'
                              : 'border-indigo-200 text-indigo-600 bg-indigo-50 hover:bg-indigo-100/50'
                          }`}
                        >
                          {isTracked ? 'Remove from list' : 'Add to list'}

                      )}

                      <div className="flex p-5 gap-5">
                        <div className="flex flex-col gap-2 items-center flex-shrink-0">
                          <div className="w-24 h-24 rounded-xl flex items-center justify-center overflow-hidden select-none">
                            <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
                          </div>

                          {!isPartiallyVisible && (
                            <div className="flex items-center gap-1 bg-slate-50 border border-slate-100 rounded-lg px-2 py-1 max-w-[96px] justify-center">

                              <div className="flex -space-x-1.5 overflow-hidden">

                          </button>

                        <div className="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-white to-transparent pointer-events-none" />

                    </div>

                })}
              </div>

              {listItemsOnSale.length > 2 && (
                <div className="flex justify-center pt-1 pb-1">
                  <button
                    onClick={() => setIsAllDealsExpanded(!isAllDealsExpanded)}

          <div className="flex items-center gap-2 px-4 pt-4 pb-3 bg-white border-b border-slate-200 shadow-xs flex-shrink-0">
            <button

              onClick={handleClearSearch}
              id="close-search-btn"

            >

            </button>
            <div className="flex-1">{renderSearchBar(true)}</div>
          </div>

          <div className="flex-1 overflow-y-auto px-4 py-5 space-y-6">
            {activeSearchQuery.trim().length < 3 ? (
              <div className="text-center py-16 space-y-2">
                <Search className="w-10 h-10 text-slate-300 mx-auto" />
                <p className="font-bold text-slate-500 uppercase tracking-widest text-[10px]">

                <p className="text-xs text-slate-400">

            ) : (
              <>
                <section className="text-center space-y-2">
                  <h2 id="search-title" className="text-3xl font-black tracking-tighter text-slate-900 leading-none font-display">
