                      {[
                        { id: 'all', label: 'All Supermarkets' },
                        { id: 'woolworths', label: getStoreDisplayName('woolworths') },
                        { id: 'paknsave', label: getStoreDisplayName('paknsave') },
                        { id: 'newworld', label: getStoreDisplayName('newworld') },
                        { id: 'foursquare', label: getStoreDisplayName('foursquare') },
                      ].map((store) => {
                        const isSelected = selectedStores.includes(store.id);
                        return (
                          <button
                            key={store.id}
                            onClick={() => handleStoreToggle(store.id)}
                            className={`flex-shrink-0 whitespace-nowrap px-3 py-2 text-[10px] font-bold uppercase tracking-wider rounded-xl border transition-all duration-150 cursor-pointer flex items-center gap-1.5 ${
                              isSelected
                                ? 'bg-stone-900 border-stone-900 text-white shadow-xs'
                                : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'
                            }`}
                          >
                            {isSelected && <span className="w-1.5 h-1.5 rounded-full bg-ink-400 animate-pulse flex-shrink-0" />}
                            {store.label}
                          </button>
                        );
                      })}
                    </div>

                    {usePersonalised && onNavigateToSettings && (
                      <div className="flex items-center justify-end pt-1.5 border-t border-stone-100 flex-wrap gap-2">
                        <button
                          onClick={onNavigateToSettings}
                          className="text-ink-600 hover:text-ink-800 hover:underline text-xs font-black uppercase tracking-wider cursor-pointer transition-colors"
                        >
                          Change
                        </button>
                      </div>
                    )}

                  <div className="space-y-4">
                  {sortedProducts.length > 0 ? (
                    (isSearchResultsExpanded ? sortedProducts : sortedProducts.slice(0, SEARCH_RESULTS_PAGE_SIZE)).map((product, idx) => {
                      const isTracked = trackedProductIds.includes(product.id);

                      const applicableDeals = product.currentDeals.filter((deal) => {
                        if (selectedStores.includes('all')) return true;
                        return selectedStores.some((selected) => storeMatchesFilter(deal.store, selected));
                      });
                      const hasActiveSpecial = applicableDeals.some((deal) => deal.isOnSpecial !== false);

                      const activeStores = applicableDeals.map((d) => d.store);

                      const bestDeal = applicableDeals.reduce((lowest, current) => {
                        return current.price < lowest.price ? current : lowest;
                      }, applicableDeals[0] || product.currentDeals[0]);

                      // Other stores where this item is *also* currently on
                      // special, separate from bestDeal (the lowest-price
                      // store, called out on its own line below) -- falls
                      // back to the unfiltered product.currentDeals when the
                      // store filter excludes everything, same fallback the
                      // old price-row calc used.
                      const dealsToUse = applicableDeals.length > 0 ? applicableDeals : product.currentDeals;
                      const alsoSpecialStores = [...new Set(
                        dealsToUse
                          .filter((d) => d.isOnSpecial !== false && d.store !== bestDeal.store)
                          .map((d) => d.store)
                      )];

                      return (
                        <ProductCard
                          key={`${product.id}-${idx}`}
                          id={`check-deal-${product.id}`}
                          product={product}
                          price={bestDeal.price}
                          storeKey={bestDeal.store}
                          branchOverrides={usePersonalised ? selectedBranches : null}
                          dealEndsText={bestDeal.isOnSpecial !== false && bestDeal.specialEndDate ? `Deal ends ${formatDealEndDate(bestDeal.specialEndDate)}` : ''}
                          alsoSpecialStores={alsoSpecialStores}
                          isTracked={isTracked}
                          onToggleTrack={isLoggedIn ? () => handleTrackClick(product.id, product.name) : undefined}
                          onActivate={() => onCheckDeal(product, bestDeal.store)}
                          emphasizeBorder={hasActiveSpecial}
                        />
                      );
                    })
                  ) : (
                    <div className="text-center py-12 space-y-3 bg-white border border-stone-200 rounded-2xl p-6">
                      <AlertCircle className="w-12 h-12 text-stone-300 mx-auto" />
                      <p className="font-bold text-stone-500 uppercase tracking-widest text-xs">
                        {!selectedStores.includes('all')
                          ? selectedStores.length === 1
                            ? `No ${activeSearchQuery || 'grocery'} items were found at ${getStoreDisplayName(selectedStores[0])}`
                            : `No ${activeSearchQuery || 'grocery'} items were found at the selected supermarkets (${selectedStores.map(getStoreDisplayName).join(', ')})`
                          : `No items matching '${activeSearchQuery}'`}
                      </p>
                      <p className="text-xs text-stone-400">
                        {!selectedStores.includes('all')
                          ? "Try selecting 'All Supermarkets' or search for another item."
                          : 'Try searching for "coffee", "ketchup" or "butter"'}
                      </p>
                    </div>
                  )}
                  {sortedProducts.length > SEARCH_RESULTS_PAGE_SIZE && !isSearchResultsExpanded && (
                    <button
                      type="button"
                      onClick={() => setIsSearchResultsExpanded(true)}
                      className="w-full py-3 text-xs font-black uppercase tracking-widest text-ink-600 hover:text-ink-800 bg-white border border-stone-200 rounded-xl transition-colors cursor-pointer"
                    >
                      Show all {sortedProducts.length} items
                    </button>
                  )}
                  </div>
                </section>
              </>
            )}
          </div>
          {categorySheetTarget !== null && (
            <div className="fixed inset-0 z-[60] flex items-end justify-center">
              <div
                className="absolute inset-0 bg-stone-900/40"
                onClick={() => setCategorySheetTarget(null)}
              />
              <div className="relative w-full max-w-md bg-white rounded-t-3xl shadow-2xl max-h-[70vh] flex flex-col">
                <div className="px-5 pt-4 pb-3 border-b border-stone-100 flex items-center justify-between flex-shrink-0">
                  <h3 className="text-sm font-black text-stone-900 tracking-tight font-display">Categories</h3>
                  <div className="flex items-center gap-1">
                    {activeCategoryFilter.length > 0 && (
                      <button
                        type="button"
                        onClick={() => setActiveCategoryFilter([])}
                        className="text-xs font-bold text-ink-600 hover:text-ink-800 hover:underline cursor-pointer px-2 py-1"
                      >
                        Clear all
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setCategorySheetTarget(null)}
                      aria-label="Close"
                      className="p-1.5 rounded-full hover:bg-stone-100 text-stone-500 cursor-pointer"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  </div>
                </div>
                <div className="overflow-y-auto px-5 py-4 space-y-5">
                  <button
                    type="button"
                    onClick={() => setActiveCategoryFilter([])}
                    className={`px-3 py-2 rounded-full text-xs font-bold transition-colors cursor-pointer border ${
                      activeCategoryFilter.length === 0 ? 'bg-ink-600 border-ink-600 text-white' : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'
                    }`}
                  >
                    All categories
                  </button>
                  {CATEGORY_SECTIONS.map((section) => {
                    const sectionCats = section.categories.filter((c) => homeCategories.includes(c));
                    if (!sectionCats.length) return null;
                    return (
                      <div key={section.title} className="space-y-2">
                        <h4 className="text-[10px] font-black uppercase tracking-widest text-stone-400">{section.title}</h4>
                        <div className="flex flex-wrap gap-2">
                          {sectionCats.map((cat) => {
                            const isSelected = activeCategoryFilter.includes(cat);
                            return (
                              <button
                                key={cat}
                                type="button"
                                onClick={() => toggleActiveCategory(cat)}
                                className={`px-3 py-2 rounded-full text-xs font-bold transition-colors cursor-pointer border ${
                                  isSelected ? 'bg-ink-600 border-ink-600 text-white' : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'
                                }`}
                              >
                                {cat}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="px-5 py-3 border-t border-stone-100 flex-shrink-0">
                  <button
                    type="button"
                    onClick={() => setCategorySheetTarget(null)}
                    className="w-full bg-stone-900 hover:bg-ink-600 text-white font-black text-xs py-3 rounded-xl uppercase tracking-widest transition-colors cursor-pointer"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}
        </motion.div>
      )}
      </AnimatePresence>
    </div>
  );
}

/* ===================== components/TrackedTab.tsx ===================== */

function TrackedTab({
  lists,
  selectedListId,
  setSelectedListId,
  trackedProductIds,
  onTrackToggle,
  onCheckDeal,
  showSnackbar,
  onClearList,
  onDeleteList,
  onResetLists,
  onCreateList,
  isLoggedIn = true,
  onOpenLogin,
}) {
  const [quantities, setQuantities] = React.useState({
    'avalanche-sachets-10pk': 1,
    'fresh-apples-1kg': 1.0,
    'cadbury-milk-110g': 1,
    'meadow-fresh-milk-2l': 1,
    'lurpak-butter-250g': 1,
  });

  const [purchaseModes, setPurchaseModes] = React.useState({
    'fresh-apples-1kg': 'weight',
  });

  const [activeMode, setActiveMode] = React.useState('deals');

  const [listToDelete, setListToDelete] = React.useState(null);

  const [isCreateModalOpen, setIsCreateModalOpen] = React.useState(false);
  const [newListName, setNewListName] = React.useState('');

  // List functions require an account -- guests/signed-out users get a
  // login/create-account prompt instead of the real list UI. Placed after
  // all hooks above so hook call order stays stable across renders.
  if (!isLoggedIn) {
    return (
      <div className="text-center py-20 space-y-4 bg-white border border-stone-200 rounded-2xl animate-fadeIn">
        <div className="w-12 h-12 rounded-full bg-ink-50 border border-ink-100 flex items-center justify-center mx-auto text-ink-600">
          <Bookmark className="w-6 h-6 stroke-[2]" />
        </div>
        <div className="space-y-1.5 max-w-xs mx-auto">
          <p className="font-black text-stone-800 uppercase tracking-wider text-sm">Log in to use lists</p>
          <p className="text-xs text-stone-500 leading-relaxed">
            Create a free account or log in to save products, build grocery lists, and compare checkout costs across supermarkets.
          </p>
        </div>
        <button
          id="tracked-tab-login-btn"
          onClick={onOpenLogin}
          className="bg-stone-900 hover:bg-ink-600 text-white px-5 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all cursor-pointer active:scale-95 shadow-md shadow-stone-200 inline-flex items-center gap-2"
        >
          Create Account / Log In
        </button>
      </div>
    );
  }

  const handleDecrease = (productId, isWeight) => {
    setQuantities((prev) => {
      const current = prev[productId] ?? 1;
      const step = isWeight ? 0.5 : 1;
      const min = isWeight ? 0.5 : 1;
      const next = Math.max(min, current - step);
      return { ...prev, [productId]: next };
    });
  };

  const handleIncrease = (productId, isWeight) => {
    setQuantities((prev) => {
      const current = prev[productId] ?? 1;
      const step = isWeight ? 0.5 : 1;
      return { ...prev, [productId]: current + step };
    });
  };

  // Tracked items that have rolled off special no longer have a row in
  // mockProducts (sourced only from current specials, see loadLiveProducts).
  // Per Jay: tracking must survive that -- the item should stay in the
  // list, just flagged as not currently on special. Lazily hydrate exactly
  // those missing ids (fetchNonSpecialProductCards), not the whole
  // catalogue, and cache results locally so re-renders don't re-fetch.
  const [lapsedTrackedProducts, setLapsedTrackedProducts] = React.useState({});
  React.useEffect(() => {
    const missingIds = trackedProductIds.filter(
      (id) => !mockProducts.some((p) => p.id === id) && !lapsedTrackedProducts[id]
    );
    if (!missingIds.length) return;
    let cancelled = false;
    fetchNonSpecialProductCards(missingIds)
      .then((fetched) => {
        if (cancelled || !fetched.length) return;
        setLapsedTrackedProducts((prev) => {
          const next = { ...prev };
          for (const p of fetched) next[p.id] = p;
          return next;
        });
      })
      .catch((err) => console.warn('Failed to load lapsed tracked products:', err));
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [trackedProductIds, lapsedTrackedProducts]);

  const myListProducts = [
    ...mockProducts.filter((p) => trackedProductIds.includes(p.id)),
    ...trackedProductIds
      .filter((id) => !mockProducts.some((p) => p.id === id))
      .map((id) => lapsedTrackedProducts[id])
      .filter(Boolean),
  ];

  const handleTrackClick = (productId, name) => {
    onTrackToggle(productId);
    showSnackbar(`Removed ${name} from list`);
  };

  const stores = ["PAK'nSAVE", 'Woolworths', 'New World', 'Four Square'];

  const getProductPriceForStore = (product, store) => {
    const deal = product.currentDeals.find((d) => d.store === store);
    if (deal) return deal.price;

    const historyPoints = product.priceHistory.filter((h) => h.store === store);
    if (historyPoints.length > 0) {
      return historyPoints[historyPoints.length - 1].price;
    }

    switch (store) {
      case "PAK'nSAVE":
        return Math.round(product.standardPrice * 0.88 * 100) / 100;
      case 'New World':
        return Math.round(product.standardPrice * 0.98 * 100) / 100;
      case 'Four Square':
        return Math.round(product.standardPrice * 1.06 * 100) / 100;
      case 'Woolworths':
      default:
        return product.standardPrice;
    }
  };

  const getProductMultiplier = (productId) => {
    const qty = quantities[productId] ?? 1;
    if (productId === 'fresh-apples-1kg') {
      const mode = purchaseModes[productId] ?? 'weight';
      if (mode === 'quantity') {
        return qty * 0.15;
      }
    }
    return qty;
  };

  const storeRankings = stores.map((store) => {
    const total = myListProducts.reduce((sum, product) => {
      const multiplier = getProductMultiplier(product.id);
      return sum + (getProductPriceForStore(product, store) * multiplier);
    }, 0);
    return { store, total };
  }).sort((a, b) => a.total - b.total);

  const cheapestStore = storeRankings[0];
  const mostExpensiveStore = storeRankings[storeRankings.length - 1];
  const maximumSavings = mostExpensiveStore ? mostExpensiveStore.total - cheapestStore.total : 0;

  if (selectedListId === null) {
    return (
      <div className="space-y-6 pb-20 animate-fadeIn">
        <div className="space-y-1.5">
          <p className="text-xs text-stone-500 font-medium leading-relaxed">
            Select one of your grocery lists to check active deals or compare total estimated checkout prices across supermarkets.
          </p>
        </div>

        <div className="space-y-3 max-w-2xl">
          {lists.length === 0 ? (
            <div className="bg-stone-50 border border-stone-200 border-dashed rounded-2xl p-8 text-center space-y-3">
              <p className="text-sm font-medium text-stone-500">
                You have deleted all your lists.
              </p>
              <button
                onClick={onResetLists}
                className="bg-ink-600 hover:bg-ink-700 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wide transition-all cursor-pointer active:scale-95 shadow-sm inline-flex items-center gap-2"
              >
                <RotateCcw className="w-3.5 h-3.5" />
                Restore Default Lists
              </button>
            </div>
          ) : (
            lists.map((list, index) => {
              const itemCount = list.itemIds.length;

              const borderColors = [
                'border-l-ink-600',
                'border-l-fair-600',
                'border-l-dodgy-500'
              ];
              const bgHoverColors = [
                'hover:bg-ink-50/20',
                'hover:bg-fair-50/20',
                'hover:bg-dodgy-50/10'
              ];
              const textColors = [
                'text-ink-700',
                'text-fair-700',
                'text-dodgy-700'
              ];

              const borderCol = borderColors[index % borderColors.length];
              const bgHover = bgHoverColors[index % bgHoverColors.length];
              const textCol = textColors[index % textColors.length];

              return (
                <div key={list.id} className="flex items-center gap-3">
                  <div
                    onClick={() => setSelectedListId(list.id)}
                    className={`flex-grow bg-white border border-stone-200 border-l-4 ${borderCol} rounded-2xl p-5 shadow-sm hover:shadow-md ${bgHover} transition-all cursor-pointer flex items-center justify-between group active:scale-[0.99]`}
                  >
                    <div className="flex-grow pr-4">
                      <div className="flex items-center gap-2">
                        <h3 className={`text-base font-black uppercase tracking-wider ${textCol}`}>
                          {list.name}
                        </h3>
                        <span className="bg-stone-100 text-stone-600 text-[10px] font-black px-2 py-0.5 rounded-full">
                          {itemCount} {itemCount === 1 ? 'item' : 'items'}
                        </span>
                      </div>
                    </div>
                    <div className="w-8 h-8 bg-stone-50 border border-stone-100 rounded-lg flex items-center justify-center text-stone-400 group-hover:text-stone-700 group-hover:bg-white transition-colors">
                      <svg className="w-4 h-4 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
                      </svg>
                    </div>
                  </div>

                  <button
                    onClick={() => setListToDelete({ id: list.id, name: list.name })}
                    className="bg-alert-50 hover:bg-alert-100 border border-alert-100 text-alert-600 rounded-2xl transition-all cursor-pointer select-none active:scale-95 shadow-sm hover:shadow flex items-center justify-center h-[68px] w-[68px] shrink-0"
                    title={`Delete ${list.name}`}
                  >
                    <Trash2 className="w-5 h-5 stroke-[2]" />
                  </button>
                </div>
              );
            })
          )}

          <div className="flex justify-center pt-3 w-full">
            <button
              onClick={() => setIsCreateModalOpen(true)}
              className="w-full max-w-sm bg-stone-50 border-2 border-dashed border-stone-200 hover:border-ink-400 hover:bg-ink-50/10 rounded-2xl transition-all cursor-pointer flex items-center justify-center group active:scale-[0.99] h-[68px]"
            >
              <span className="text-sm font-black text-stone-500 group-hover:text-ink-600 uppercase tracking-wider transition-colors text-center">
                Create New List
              </span>
            </button>
          </div>
        </div>

        {isCreateModalOpen && (
          <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
            <form
              onSubmit={(e) => {
                e.preventDefault();
                const trimmed = newListName.trim();
                if (trimmed) {
                  onCreateList(trimmed);
                  setNewListName('');
                  setIsCreateModalOpen(false);
                }
              }}
              className="bg-white border border-stone-200 rounded-3xl max-w-xs w-full p-6 space-y-5 shadow-2xl animate-scaleUp"
            >
              <div className="flex flex-col items-center text-center space-y-3">
                <div className="w-12 h-12 rounded-full bg-ink-50 border border-ink-100 flex items-center justify-center text-ink-600">
                  <Plus className="w-6 h-6 stroke-[2.5]" />
                </div>
                <div className="space-y-1">
                  <h3 className="text-lg font-black text-stone-900 tracking-tight uppercase">
                    Create New List
                  </h3>
                  <p className="text-xs text-stone-500 font-medium leading-relaxed">
                    Give your new grocery list a name to get started tracking grocery specials and comparing prices.
                  </p>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="text-[10px] font-black text-stone-400 uppercase tracking-widest block">
                  List Name
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Weekly Groceries"
                  value={newListName}
                  onChange={(e) => setNewListName(e.target.value)}
                  className="w-full px-4 py-3 border border-stone-200 rounded-xl text-xs font-bold text-stone-800 placeholder-stone-400 focus:outline-hidden focus:border-ink-600 focus:ring-1 focus:ring-ink-600 transition-all bg-stone-50/50"
                  autoFocus
                />
              </div>

              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => {
                    setIsCreateModalOpen(false);
                    setNewListName('');
                  }}
                  className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="flex-1 bg-ink-600 hover:bg-ink-700 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95 shadow-sm shadow-ink-100"
                >
                  Create
                </button>
              </div>
            </form>
          </div>
        )}

        {listToDelete && (
          <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
            <div className="bg-white border border-stone-200 rounded-3xl max-w-xs w-full p-6 space-y-5 shadow-2xl animate-scaleUp">
              <div className="flex flex-col items-center text-center space-y-3">
                <div className="w-12 h-12 rounded-full bg-alert-50 border border-alert-100 flex items-center justify-center text-alert-600">
                  <Trash2 className="w-6 h-6 stroke-[2]" />
                </div>
                <div className="space-y-1">
                  <h3 className="text-lg font-black text-stone-900 tracking-tight uppercase">
                    Delete {listToDelete.name}?
                  </h3>
                  <p className="text-xs text-stone-500 font-medium leading-relaxed">
                    Are you sure you want to delete this list? All tracked items inside will be lost. This cannot be undone.
                  </p>
                </div>
              </div>
              <div className="flex gap-3">
                <button
                  onClick={() => setListToDelete(null)}
                  className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95"
                >
                  Cancel
                </button>
                <button
                  onClick={() => {
                    onDeleteList(listToDelete.id);
                    setListToDelete(null);
                  }}
                  className="flex-1 bg-alert-600 hover:bg-alert-700 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95 shadow-sm shadow-alert-200"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const selectedListName = lists.find(l => l.id === selectedListId)?.name || 'List';

  return (
    <div className="space-y-6 pb-20">
      <div className="flex items-center gap-2 animate-fadeIn">
        <button
          onClick={() => setSelectedListId(null)}
          className="bg-white border border-stone-200 text-stone-700 hover:bg-stone-50 px-3 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 shadow-sm active:scale-95"
        >
          <svg className="w-3.5 h-3.5 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Back to Lists
        </button>
        <span className="text-xs text-stone-400 font-bold uppercase tracking-wider bg-stone-100/80 px-2.5 py-1 rounded-lg">
          Active: {selectedListName}
        </span>
      </div>

      <div className="space-y-1.5">
        <h4 className="text-xl font-black text-stone-900 tracking-tighter font-display">
          Track individual grocery specials in {selectedListName} or compare total list checkout cost across supermarkets.
        </h4>
      </div>

      <div className="bg-stone-100/80 p-1.5 rounded-xl flex border border-stone-200/60">
        <button
          onClick={() => setActiveMode('deals')}
          className={`flex-1 text-center py-2.5 rounded-lg text-xs font-extrabold uppercase tracking-wider transition-all duration-200 cursor-pointer select-none active:scale-[0.98] ${
            activeMode === 'deals'
              ? 'bg-white text-ink-600 shadow-sm'
              : 'text-stone-500 hover:text-stone-800 hover:bg-white/50'
          }`}
        >
          Check Deals
        </button>

        <button
          onClick={() => setActiveMode('compare')}
          className={`flex-1 text-center py-2.5 rounded-lg text-xs font-extrabold uppercase tracking-wider transition-all duration-200 cursor-pointer select-none active:scale-[0.98] ${
            activeMode === 'compare'
              ? 'bg-white text-ink-600 shadow-sm'
              : 'text-stone-500 hover:text-stone-800 hover:bg-white/50'
          }`}

          Compare total list cost
        </button>
      </div>

      {myListProducts.length > 0 ? (
        <div className="space-y-6">
          <div className="space-y-4">
            {myListProducts.map((product, idx) => {
              // True lowest-price deal for this product -- was previously
              // just `product.currentDeals[0]` (whatever happened to be
              // first in the array, not necessarily cheapest), which didn't
              // matter while this card showed no price at all, but does now
              // that it's labelled "Lowest at" via the shared ProductCard.
              const bestDeal = product.currentDeals.reduce((lowest, current) =>
                current.price < lowest.price ? current : lowest
              , product.currentDeals[0]);
              const hasWeightAndQuantityOptions = product.id === 'fresh-apples-1kg';
              const isActualWeight = hasWeightAndQuantityOptions
                ? (purchaseModes[product.id] === 'weight')
                : (product.id === 'fresh-apples-1kg' || product.unit === '1kg' || product.category === 'Produce');
              const qty = quantities[product.id] ?? 1;

              // Only tappable-to-check in "deals" mode -- "compare" mode
              // swaps the card's bottom slot for weight/quantity controls
              // (checkboxes, +/- steppers) that need their own clicks to
              // land normally, and there's no single "check this deal"
              // action to jump to while comparing total list cost anyway.
              const isCardTappable = activeMode === 'deals';

              const alsoSpecialStores = [...new Set(
                (product.currentDeals || [])
                  .filter((d) => d.isOnSpecial !== false && d.store !== bestDeal.store)
                  .map((d) => d.store)
              )];

              return (
                <ProductCard
                  key={`${product.id}-${idx}`}
                  id={`check-deal-${product.id}`}
                  product={product}
                  price={bestDeal.price}
                  storeKey={bestDeal.store}
                  dealEndsText={bestDeal.isOnSpecial !== false && bestDeal.specialEndDate ? `Deal ends ${formatDealEndDate(bestDeal.specialEndDate)}` : ''}
                  alsoSpecialStores={alsoSpecialStores}
                  // Every product on this screen is, by definition, already
                  // in the active list -- isTracked stays true so the icon
                  // always reads as "tap to remove", never "tap to add".
                  isTracked={true}
                  onToggleTrack={() => handleTrackClick(product.id, product.name)}
                  onActivate={isCardTappable ? () => onCheckDeal(product, bestDeal.store) : undefined}
                >
                  {/* Only rendered in "compare" mode now that the "deals"-mode
                      Check Deals button is gone -- previously this wrapper
                      div was unconditional (with the button as its "deals"-
                      mode content), which would otherwise leave an empty
                      px-5 pb-5 strip of blank space under every card while
                      in "deals" mode (the default) now that there's nothing
                      left to fill it. */}
                  {activeMode === 'compare' && (
                    <div className="px-5 pb-5">
                      <div className="flex flex-col items-center animate-fadeIn">
                        {hasWeightAndQuantityOptions && (
                          <div className="flex items-center gap-6 justify-center mb-3 select-none">
                            <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-stone-600">
                              <input
                                type="checkbox"
                                checked={purchaseModes[product.id] === 'weight'}
                                onChange={() => {
                                  setPurchaseModes(prev => ({ ...prev, [product.id]: 'weight' }));
                                  setQuantities(prev => ({ ...prev, [product.id]: 1.0 }));
                                }}
                                className="w-4 h-4 rounded text-ink-600 border-stone-300 focus:ring-ink-500 cursor-pointer"
                              />
                              Weight
                            </label>
                            <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-stone-600">
                              <input
                                type="checkbox"
                                checked={purchaseModes[product.id] === 'quantity'}
                                onChange={() => {
                                  setPurchaseModes(prev => ({ ...prev, [product.id]: 'quantity' }));
                                  setQuantities(prev => ({ ...prev, [product.id]: 1 }));
                                }}
                                className="w-4 h-4 rounded text-ink-600 border-stone-300 focus:ring-ink-500 cursor-pointer"
                              />
                              Quantity
                            </label>
                          </div>
                        )}

                        <div className="flex justify-center w-full">
                          <div className="flex items-stretch h-11 border border-stone-300 rounded-xl overflow-hidden shadow-sm bg-white max-w-[200px] w-full">
                            <div className="flex-grow flex items-center justify-between px-3.5 bg-white select-none">
                              <span className="text-sm font-extrabold text-stone-800">
                                {isActualWeight ? qty.toFixed(1) : Math.round(qty)}
                              </span>
                              <span className="text-xs font-bold text-stone-500">
                                {isActualWeight ? 'kg' : 'ea.'}
                              </span>
                            </div>

                            <button
                              onClick={(e) => { e.stopPropagation(); handleDecrease(product.id, isActualWeight); }}
                              className="w-12 bg-stone-700 hover:bg-stone-800 text-white flex items-center justify-center transition-colors cursor-pointer border-l border-stone-600 select-none active:scale-95"
                              title="Decrease"
                            >
                              <Minus className="w-3.5 h-3.5 text-white font-black stroke-[3.5px]" />
                            </button>

                            <button
                              onClick={(e) => { e.stopPropagation(); handleIncrease(product.id, isActualWeight); }}
                              className="w-12 bg-stone-700 hover:bg-stone-800 text-white flex items-center justify-center transition-colors cursor-pointer border-l border-stone-600 select-none active:scale-95"
                              title="Increase"
                            >
                              <Plus className="w-3.5 h-3.5 text-white font-black stroke-[3.5px]" />
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </ProductCard>
              );
            })}
          </div>

          {activeMode === 'compare' && (
            <div className="flex justify-center pt-2 animate-fadeIn">
              <button
                onClick={() => {
                  setQuantities({
                    'avalanche-sachets-10pk': 1,
                    'fresh-apples-1kg': 1.0,
                    'cadbury-milk-110g': 1,
                    'meadow-fresh-milk-2l': 1,
                    'lurpak-butter-250g': 1,
                  });
                  showSnackbar("Reset all item quantities back to 1");
                }}
                className="bg-ink-600 hover:bg-ink-700 text-white px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all cursor-pointer select-none active:scale-95 shadow-sm hover:shadow flex items-center gap-2"
              >
                <RotateCcw className="w-3.5 h-3.5 stroke-[2.5]" />
                Reset Quantities
              </button>
            </div>
          )}

          {activeMode === 'compare' && (
            <div className="bg-stone-50 border border-stone-200 rounded-2xl p-6 space-y-6 animate-fadeIn">
              <div className="space-y-1.5">
                <h4 className="text-xl font-black text-stone-900 tracking-tighter font-display">
                  The estimated cost for all items in your list across supermarkets.
                </h4>
              </div>

              <div className="space-y-4">
                {storeRankings.map((ranking, index) => {
                  const isCheapest = index === 0;
                  const percentageOfMax = mostExpensiveStore.total > 0
                    ? (ranking.total / mostExpensiveStore.total) * 100
                    : 0;

                  return (
                    <div key={ranking.store} className="space-y-2">
                      <div className="flex items-center justify-between text-sm">
                        <div className="flex items-center gap-2.5">
                          <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold ${
                            isCheapest
                              ? 'bg-fair-500 text-white'
                              : 'bg-stone-200 text-stone-600'

                            {index + 1}
                          </span>
                          <span className={`font-bold ${isCheapest ? 'text-fair-700' : 'text-stone-700'}`}>
                            {ranking.store}
                          </span>
                          {isCheapest && (
                            <span className="bg-fair-100 text-fair-800 text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-[4px]">
                              Best Choice
                            </span>
                          )}

                      </div>

                    </div>

              <div className="flex items-center gap-2 text-[11px] text-stone-400">

  );

                      <span className="text-[10px] font-bold text-stone-400 flex items-center gap-1 uppercase tracking-wider">

                          <span className="font-bold text-stone-900">${product.standardPrice.toFixed(2)}</span> was artificially bumped to{' '}
                          <span className="font-bold line-through text-stone-400">${alert.oldPrice.toFixed(2)}</span>, currently advertised as a discount at{' '}
                          <span className="font-bold text-alert-600">${alert.newPrice.toFixed(2)}</span>.

                      ) : (

                          <span className="font-bold line-through text-stone-400">${alert.oldPrice.toFixed(2)}</span>). You save{' '}
                          <span className="font-bold text-fair-600">${(alert.oldPrice - alert.newPrice).toFixed(2)}</span>!

function HistoryTab({
  history,
  onRecheck,
  onTrackToggle,
  trackedProductIds,
  showSnackbar,
  isLoggedIn = true,
}) {
  const [searchQuery, setSearchQuery] = React.useState('');

  const filteredHistory = history.filter((item) => {
    const product = mockProducts.find(p => p.id === item.productId);
    if (!product) return false;
    // Same punctuation/spacing-tolerant matching as the main search bar --
    // see normalizeSearchText -- so e.g. a checked "Weet-Bix" still turns up
    // when searching history for "weetbix". Also falls back to the same
    // typo-tolerant fuzzy match (isFuzzyProductMatch) the main search uses,
    // so a misremembered/misspelled product name still finds the right
    // history entry instead of coming back empty.
    const trimmed = searchQuery.trim();
    const query = normalizeSearchText(trimmed);
    if (!query) return true;
    return (
      normalizeSearchText(product.name).includes(query) ||
      normalizeSearchText(product.brand).includes(query) ||
      (product.description && normalizeSearchText(product.description).includes(query)) ||
      isFuzzyProductMatch(product, trimmed, [
        ...tokenizeForFuzzy(product.name),
        ...tokenizeForFuzzy(product.brand),
        ...tokenizeForFuzzy(product.description || ''),
      ])
    );
  });

  return (
    <div className="space-y-6 pb-20">

      <div className="bg-stone-50 border border-stone-200/80 rounded-2xl p-5 space-y-4">
        <div className="space-y-1.5">
          <h4 className="font-extrabold text-ink-900 text-sm font-display">
            Your checked deals history
          </h4>
          <p className="text-xs text-stone-600 leading-relaxed">
            Review all the supermarket deals and prices you have checked. Your history is shown in chronological order, starting from your most recent check to the oldest.
          </p>
        </div>

        <div className="relative">
          <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400" />
          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="Search your check history..."
            className="w-full bg-white border border-stone-200 rounded-xl pl-10 pr-4 py-2 text-xs font-medium text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-ink-500/30 focus:border-ink-400 transition-all"
          />
        </div>
      </div>

      {history.length > 0 ? (
        filteredHistory.length > 0 ? (
          <div className="space-y-4">
            {filteredHistory.map((item, idx) => {
            const product = mockProducts.find(p => p.id === item.productId);
            if (!product) return null;

            const isTracked = trackedProductIds.includes(item.productId);

            // This card is a historical record of a specific past check --
            // item.price/item.store is what was actually checked at the
            // time, not necessarily today's cheapest option, so "Checked
            // at" (not "Lowest at") keeps the label honest. No deal-ends
            // date either: the history entry itself doesn't carry one, and
            // fabricating one from today's live data would misattribute a
            // current special's end date to a past check. "Also on special
            // at" badges *do* use live data deliberately -- that's a real,
            // current fact worth surfacing ("this is also on special
            // elsewhere right now"), not a claim about the historical check
            // itself.
            const alsoSpecialStores = [...new Set(
              (product.currentDeals || [])
                .filter((d) => d.isOnSpecial !== false && d.store !== item.store)
                .map((d) => d.store)
            )];

            return (
              <ProductCard
                key={`${item.id}-${idx}`}
                id={`recheck-btn-${item.id}`}
                product={product}
                price={item.price}
                storeKey={item.store}
                storeLinePrefix="Checked at"
                alsoSpecialStores={alsoSpecialStores}
                isTracked={isTracked}
                onToggleTrack={isLoggedIn ? () => onTrackToggle(product.id) : undefined}
                onActivate={() => onRecheck(product, item.store)}
              />
            );
          })}
        </div>
        ) : (
          <div className="text-center py-12 space-y-2 bg-white border border-stone-200 rounded-2xl">
            <Search className="w-10 h-10 text-stone-300 mx-auto" />
            <p className="font-bold text-stone-500 uppercase tracking-widest text-[10px]">No matching checks found</p>
            <p className="text-xs text-stone-400">Try searching for a different product name or brand</p>
          </div>
        )
      ) : (
        <div className="text-center py-16 space-y-3 bg-white border border-stone-200 rounded-2xl">
          <ShieldAlert className="w-12 h-12 text-stone-300 mx-auto" />
          <p className="font-bold text-stone-500 uppercase tracking-widest text-xs">Your checking history is empty</p>
          <p className="text-xs text-stone-400">Scan a barcode or search for a product on the Home screen to check a deal</p>
        </div>
      )}
    </div>
  );
}

function DealModal({
  isOpen,
  onClose,
  onOpenSearch,
  product,
  dealStore,
  onTrackToggle,
  isTracked,
  trackedProductIds = [],
  isLoggedIn = true,
  onNavigateToSettings,
  onNavigateToHowItWorks,
  onNavigateToManageAccount,
  onNavigateToLogin,
  onLogout,
  onNavigateToTab,
}) {
  if (!product || !dealStore) return null;

  // Real store names carry branch suffixes/casing that vary ("Woolworths NZ",
  // "Pak'nSave" vs "PAK'nSAVE") -- exact `d.store === store` comparisons
  // against the canonical storesList strings below silently miss those,
  // which was producing a different "cheapest" store here than what the
  // search card (which doesn't do an exact-string lookup) showed for the
  // same product. Normalize both sides the same way storeMatchesFilter does.
  const findDealForStore = (deals, store) =>
    (deals || []).find((d) => normalizeStoreKey(d.store).includes(normalizeStoreKey(store)));

  const deal = findDealForStore(product.currentDeals, dealStore);
  if (!deal) return null;

  // Real per-store "today" price -- from currentDeals only, which (since
  // the full-catalogue change) holds an entry for every store this item
  // actually has live data at, special or regular. No fallback: if a store
  // has no entry, this item genuinely isn't tracked there, and null lets
  // callers drop it instead of guessing a price.
  const getRealPriceToday = (store) => {
    const activeDeal = findDealForStore(product.currentDeals, store);
    return activeDeal ? activeDeal.price : null;
  };

  // Real per-store baseline to compare today's price against. Sourced from
  // that same currentDeals entry's originalPrice, which classifySpecial()
  // already computed correctly at load time -- the real day-windowed normal
  // price for an active special, or the flat real regular price otherwise.
  // Not a fabricated multiplier, not a hardcoded 3-point "90 day" average.
  const getRealAveragePrice = (store) => {
    const activeDeal = findDealForStore(product.currentDeals, store);
    return activeDeal ? activeDeal.originalPrice : null;
  };

  const storesList = ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square'];

  const barChartData = React.useMemo(() => {
    const rows = storesList
      .map((store) => {
        const current = getRealPriceToday(store);
        const avg = getRealAveragePrice(store);
        if (current == null || avg == null) return null; // no real data for this store -- skip, don't fabricate a bar

        const shortNames = {
          'Woolworths': 'WW',
          "PAK'nSAVE": 'PNS',
          'New World': 'NW',
          'Four Square': 'FS',
        };

        const orangeUnder = current < avg ? current : 0;
        const blueBody = current < avg ? (avg - current) : avg;
        const orangeOver = current >= avg ? (current - avg) : 0;

        return {
          name: shortNames[store] || store,
          storeName: store,
          currentPrice: current,
          averagePrice: avg,
          orangeUnder,
          blueBody,
          orangeOver,
        };
      })
      .filter(Boolean);
    const minCurrent = rows.length ? Math.min(...rows.map((r) => r.currentPrice)) : null;
    return rows.map((r) => ({ ...r, isBestPrice: r.currentPrice === minCurrent }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [product, dealStore]);

  const rankingList = React.useMemo(() => {
    return storesList
      .map((store) => ({ store, price: getRealPriceToday(store) }))
      .filter((item) => item.price != null)
      .sort((a, b) => a.price - b.price);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [product, dealStore]);

  const [currentView, setCurrentView] = React.useState('assessment');
  const [selectedStores, setSelectedStores] = React.useState(['all']);

  const [usePersonalised, setUsePersonalised] = React.useState(() => {
    return localStorage.getItem('use_personalised_settings') === 'true';
  });

  const [selectedBranches] = React.useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    const defaults = {
      'Woolworths': 'Woolworths CBD',
      "PAK'nSAVE": "PAK'nSAVE Mt Albert",
      'New World': 'New World Victoria Park',
      'Four Square': 'Four Square Ellerslie',
    };
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square'].forEach(brand => {
            loaded[brand] = parsed[brand] || defaults[brand];
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    return defaults;
  });

  const getStoreDisplayName = (storeKey) => {
    if (usePersonalised) {
      switch (storeKey.toLowerCase()) {

        case 'newworld': return selectedBranches['New World'] || 'New World';
        case 'foursquare': return selectedBranches['Four Square'] || 'Four Square';
        default: return storeKey;
      }
    }
    switch (storeKey.toLowerCase()) {
      case 'woolworths': return 'Woolworths';
      case 'paknsave': return "PAK'nSAVE";
      case 'newworld': return 'New World';
      case 'foursquare': return 'Four Square';
      default: return storeKey;

      if (nextStores.includes('all')) {
        nextStores = [storeId];
      } else {
        if (nextStores.includes(storeId)) {
          nextStores = nextStores.filter((id) => id !== storeId);
          if (nextStores.length === 0) {

  React.useEffect(() => {

  // Only ever return a price this product/store combo actually has real

  // then the most recent real price_history row for that store. Never

  // multipliers (and a date-string check for "Jun 28"/"Today" that can
  // never match a real scraped_at value), silently rendering a guessed
  // price with no visual difference from a real one -- exactly the kind of
  // quiet fabrication this app exists to catch, not commit. Returns null
  // when there's genuinely no data, so the caller can drop the option
  // instead of inventing one.
  let alternativeProducts = React.useMemo(() => {
    // Prefer an exact category-string match first (tightest, since two
    // items sharing the exact raw category are almost always genuinely
    // comparable); only widen to the normalized category bucket
    // (groupCategory, used elsewhere for the category filter) when that
    // yields nothing, since the buckets are broad (e.g. "Pantry & grocery")
    // and can match hundreds of live-catalogue items.
    const exactMatch = mockProducts.filter((p) => p.id !== product.id && p.category === product.category && p.category);
    const categoryPool = exactMatch.length > 0
      ? exactMatch
      : mockProducts.filter((p) => p.id !== product.id && groupCategory(p.category) === groupCategory(product.category));

    // Category alone still lumps unrelated product types together within
    // the same aisle (e.g. every "Pantry" item). Narrow further to items
    // that share a real product-type word with this product's own name
    // (e.g. "coffee", "biscuits") -- same tokenizer the search bar uses,
    // ignoring short/numeric tokens (pack sizes, "500ml") that would
    // otherwise match almost anything. Falls back to the category pool if
    // nothing shares a word, so a genuinely unique item still gets options.
    const nameTokens = new Set(tokenizeForFuzzy(product.name).filter((t) => t.length >= 4 && !/^\d/.test(t)));
    if (nameTokens.size === 0) return categoryPool;
    const nameMatched = categoryPool.filter((p) => tokenizeForFuzzy(p.name).some((t) => nameTokens.has(t)));

  // Scans every same-category product across all 4 stores -- kept in a
  // memo (like sortedRailProducts/sortedProducts elsewhere in this file) so
  // it only reruns when the underlying deal actually changes, not on every
  // unrelated re-render this modal gets (view switches, background
  // liveProductsTick bumps) -- that unmemoized full-catalogue rescan on
  // every render was what froze the UI on tap.
  const allCheaperAlternativeOptions = React.useMemo(() => {

      .flatMap((p) => {

          const activeDeal = p.currentDeals.find((d) => normalizeStoreKey(d.store).includes(normalizeStoreKey(store)) && d.isOnSpecial !== false);

          return {
            product: p,
            store,
            price: activeDeal.price,
            saving: deal.price - activeDeal.price,
          };

  // Real min/max/avg from actual observed prices for this store -- every
  // real price_history row plus today's real currentDeals price if it

  // Today/30d/60d/90d snapshot points: this used to call
  // getPriceForStoreAtTime for four fixed "snapshots" that, for live data,
  // almost never matched a real price_history row (see verdict comment
  // above) and fell back to fabricated multipliers every time. Returns
  // null when there's genuinely no real data for that store, so the
  // caller can omit the row instead of showing a guessed range.
  const getPricingStatsForStore = (store) => {
    const historyForStore = product.priceHistory.filter((h) => normalizeStoreKey(h.store).includes(normalizeStoreKey(store)));
    const regularPrices = historyForStore.filter((h) => !h.isPromo).map((h) => h.price);
    const specialPrices = historyForStore.filter((h) => h.isPromo).map((h) => h.price);
    // Only add today's currentDeals price as a fallback when price_history
    // has nothing for this store at all -- price_history's own latest row
    // is usually the same as today's currentDeals price already, so adding
    // it unconditionally would double-count today and skew the average.
    if (!regularPrices.length && !specialPrices.length) {
      const activeDeal = findDealForStore(product.currentDeals, store);
      if (activeDeal) {
        (activeDeal.isOnSpecial !== false ? specialPrices : regularPrices).push(activeDeal.price);
      }
    }
    if (!regularPrices.length && !specialPrices.length) return null;

    const range = (prices) => (prices.length ? { min: Math.min(...prices), max: Math.max(...prices) } : null);

    return {
      regular: range(regularPrices),
      special: range(specialPrices),
    };

    return ['New World', 'Woolworths', "PAK'nSAVE", 'Four Square']
      .map((storeName) => ({ storeName, stats: getPricingStatsForStore(storeName) }))
      .filter((row) => row.stats != null)
      .sort((a, b) => {
        const cheapestA = a.stats.special ? a.stats.special.min : a.stats.regular.min;
        const cheapestB = b.stats.special ? b.stats.special.min : b.stats.regular.min;
        return cheapestA - cheapestB;

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [product]);

  // fabricated multipliers -- for live data (whose price_history dates

  // was running on 100% guessed numbers, and could disagree with the

  // already exists to translate deal.dealType's vocabulary into this

    verdict = 'Fair Deal';

    verdictBorderClass = 'border-dodgy-200';
  } else {

      verdictBorderClass = 'border-fair-200';

                  <span className="flex-1 text-sm font-medium text-stone-400">Search for supermarket products</span>
                  <span className="ml-2 text-ink-600 bg-white border border-ink-100 p-2.5 rounded-full flex-shrink-0 flex items-center justify-center">
                    <ScanBarcode className="w-5 h-5" />
                  </span>

                {verdict === 'Dodgy Deal' ? (

                    >

                    {(() => {

                    })()}

// Real barcode/OCR recognition isn't feasible in a static prototype, so this
// no longer fabricates a scan result. It captures a photo (via the device's
// real camera, using a file input with capture="environment" -- the
// standard way a web page triggers the native camera app rather than a
// canvas/getUserMedia live-preview) or an uploaded photo, then hands the
// user off to the real search flow (which does run the genuine dodgy/fair/
// real-saver classifier against the live database) to look the item up.
function ScannerModal({ isOpen, onClose, onSearchForItem }) {
  const [capturedImage, setCapturedImage] = useState(null);
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);

  const handleImageSelected = (event) => {
    const file = event.target.files?.[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => setCapturedImage(reader.result);
      reader.readAsDataURL(file);
    }
    // Reset so choosing the same file again still fires onChange.
    event.target.value = '';
  };

  const handleRetake = () => setCapturedImage(null);

  const handleClose = () => {
    setCapturedImage(null);
    onClose();
  };

  const handleSearchForItem = () => {
    setCapturedImage(null);
    onClose();
    onSearchForItem && onSearchForItem();
  };

  return (
    <AnimatePresence>
      {isOpen && (
        <>
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            onClick={handleClose}
            className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"
          />

          <motion.div
            initial={{ y: '100%', opacity: 0.5 }}
            animate={{ y: 0, opacity: 1 }}
            exit={{ y: '100%', opacity: 0.5 }}
            transition={{ type: 'spring', damping: 25, stiffness: 220 }}
            className="fixed bottom-0 left-0 right-0 max-w-md mx-auto w-full bg-white rounded-t-3xl shadow-2xl z-[51] max-h-[92dvh] flex flex-col overflow-hidden border-t border-x border-stone-200"
          >
            <div className="flex items-center justify-between px-6 py-4 border-b border-stone-200">
              <div className="flex items-center gap-3">
                <Camera className="w-4 h-4 text-ink-600" />
                <h3 className="font-bold text-base text-stone-900 uppercase tracking-wider font-display">Price Tag Scanner</h3>
              </div>
              <button
                onClick={handleClose}
                className="p-1 rounded-full hover:bg-stone-100 text-stone-500 hover:text-stone-700 transition-colors"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {!capturedImage && (
                <div className="space-y-4">
                  <p className="text-xs text-stone-500 leading-relaxed font-medium">
                    Point your camera at a shelf price tag or barcode to check it in-store, or upload a photo you've already taken.
                  </p>

                  <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    ref={cameraInputRef}
                    onChange={handleImageSelected}
                    className="hidden"
                  />
                  <button
                    onClick={() => cameraInputRef.current?.click()}
                    className="w-full py-8 border-2 border-dashed border-ink-200 bg-ink-50/30 hover:bg-ink-50 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all cursor-pointer"
                  >
                    <div className="w-12 h-12 bg-ink-600 rounded-2xl flex items-center justify-center shadow-md">
                      <Camera className="w-6 h-6 text-white" />
                    </div>
                    <p className="text-xs font-bold text-stone-800 uppercase tracking-wider">Scan Barcode</p>
                    <p className="text-[10px] font-black text-stone-400 uppercase tracking-widest">Opens your camera</p>
                  </button>

                  <div className="flex items-center my-4">
                    <div className="flex-grow border-t border-stone-200" />
                    <span className="text-[9px] font-black text-stone-400 mx-3 uppercase tracking-widest">Or</span>
                    <div className="flex-grow border-t border-stone-200" />
                  </div>

                  <input
                    type="file"
                    accept="image/*"
                    ref={galleryInputRef}
                    onChange={handleImageSelected}
                    className="hidden"
                  />
                  <button
                    onClick={() => galleryInputRef.current?.click()}
                    className="w-full py-6 border-2 border-dashed border-stone-300 hover:border-stone-400 hover:bg-stone-50 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all cursor-pointer"
                  >
                    <Upload className="w-8 h-8 text-stone-400" />
                    <p className="text-xs font-bold text-stone-800 uppercase tracking-wider">Upload Photo</p>
                    <p className="text-[10px] font-black text-stone-400 uppercase tracking-widest">Supports JPG, PNG, WEBP</p>
                  </button>
                </div>
              )}

              {capturedImage && (
                <div className="space-y-6">
                  <div className="w-full aspect-square rounded-2xl overflow-hidden border border-stone-200 bg-stone-50">
                    <img
                      src={capturedImage}
                      alt="Captured price tag"
                      className="w-full h-full object-cover"
                    />
                  </div>
                  <p className="text-xs text-stone-500 leading-relaxed font-medium text-center">
                    Now search for this item to see its real price history and whether the current price is a genuine deal.
                  </p>
                </div>
              )}
            </div>

            <div className="p-4 bg-stone-50 border-t border-stone-200 flex gap-3">
              {capturedImage ? (
                <>
                  <button
                    onClick={handleRetake}
                    className="flex-1 border border-stone-200 py-3 px-4 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-stone-100 transition-colors cursor-pointer"
                  >
                    Retake
                  </button>
                  <button
                    onClick={handleSearchForItem}
                    className="flex-1 bg-stone-900 hover:bg-ink-600 text-white py-3 px-4 rounded-xl text-xs font-black uppercase tracking-widest shadow-md cursor-pointer"
                  >
                    Search for This Item
                  </button>
                </>
              ) : (
                <button
                  onClick={handleClose}
                  className="flex-1 border border-stone-200 py-3 px-4 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-stone-100 transition-colors cursor-pointer"
                >
                  Cancel
                </button>
              )}
            </div>
          </motion.div>
        </>
      )}
    </AnimatePresence>
  );
}

    setEmail(localStorage.getItem('user_email') || 'john@example.com');

    const pass = localStorage.getItem('user_password') || 'password123';

    setNewPassword('');

      return;

      showSnackbar('New passwords do not match');
      return;

    setPassword(newPassword);
    setNewPassword('');
    setConfirmNewPassword('');

    setIsPasswordSaved(true);
    setIsPasswordEditable(false);
    showSnackbar('Password updated successfully');

    setTimeout(() => {
      setIsPasswordSaved(false);
    }, 4000);
  };

  const handleAccountTypeChange = (type) => {
    if (accountType === type) return;
    if (type === 'free') {

      setAccountType('free');
      setIsPaymentFormOpen(false);
      showSnackbar('Successfully switched to Free account.');
    } else {

  };

  const handleCardNumberChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    const formatted = value.match(/.{1,4}/g)?.join(' ') || value;
    setCardNumber(formatted.substring(0, 19));
  };

  const handleCardExpiryChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    let formatted = value;
    if (value.length > 2) {
      formatted = `${value.substring(0, 2)}/${value.substring(2, 4)}`;
    }
    setCardExpiry(formatted.substring(0, 5));
  };

  const handleCardCvcChange = (e) => {
    const value = e.target.value.replace(/\D/g, '');
    setCardCvc(value.substring(0, 4));
  };

  const handleSubmitPayment = (e) => {
    e.preventDefault();
    const errors = {};
    if (!cardName.trim()) {
      errors.cardName = 'Cardholder name is required';
    }

    const cleanNum = cardNumber.replace(/\s+/g, '');
    if (!cleanNum) {
      errors.cardNumber = 'Card number is required';
    } else if (!/^\d{16}$/.test(cleanNum)) {
      errors.cardNumber = 'Card number must be 16 digits';
    }

    if (!cardExpiry) {
      errors.cardExpiry = 'Expiry date is required';
    } else if (!/^(0[1-9]|1[0-2])\/[0-9]{2}$/.test(cardExpiry)) {
      errors.cardExpiry = 'Must be MM/YY';
    }

    if (!cardCvc) {
      errors.cardCvc = 'CVC is required';
    } else if (!/^\d{3,4}$/.test(cardCvc)) {
      errors.cardCvc = 'CVC must be 3 or 4 digits';
    }

    if (Object.keys(errors).length > 0) {
      setPaymentErrors(errors);
      return;
    }

    setPaymentErrors({});
    setIsPaying(true);

    setTimeout(() => {

      setAccountType('paid');
      setIsPaying(false);
      setIsPaymentFormOpen(false);
      setCardName('');
      setCardNumber('');
      setCardExpiry('');
      setCardCvc('');
      showSnackbar('Successfully upgraded to Paid account! Enjoy unlimited list tracking and instant alerts.');

function SettingsTab({ onBack, showSnackbar }) {
  const [initialBranches, setInitialBranches] = useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
            const val = parsed[brand];
            if (Array.isArray(val)) {
              loaded[brand] = val.length > 0 ? val[0] : BRANCHES_BY_BRAND[brand][0];
            } else if (typeof val === 'string' && val) {
              loaded[brand] = val;
            } else {
              loaded[brand] = BRANCHES_BY_BRAND[brand][0];
            }
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    const defaults = {};
    Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
      defaults[brand] = BRANCHES_BY_BRAND[brand][0];
    });
    return defaults;
  });

  const [selectedBranches, setSelectedBranches] = useState(() => ({ ...initialBranches }));

  const [flashingBrands, setFlashingBrands] = useState({});

  const [activeChangeBrand, setActiveChangeBrand] = useState(null);

  const [brandSearchQueries, setBrandSearchQueries] = useState({
    'Woolworths': '',
    "PAK'nSAVE": '',
    'New World': '',
    'Four Square': ''
  });

  const inputRef = useRef(null);

  useEffect(() => {
    if (activeChangeBrand && inputRef.current) {
      inputRef.current.focus();
    }
  }, [activeChangeBrand]);

  const handleSelectStore = (brand, branch) => {
    setSelectedBranches(prev => ({
      ...prev,
      [brand]: branch
    }));

    setBrandSearchQueries(prev => ({ ...prev, [brand]: '' }));
    setActiveChangeBrand(null);
  };

  const handleResetDefaults = () => {
    const defaults = {};
    Object.keys(BRANCHES_BY_BRAND).forEach(brand => {
      defaults[brand] = BRANCHES_BY_BRAND[brand][0];
    });
    setSelectedBranches(defaults);
    setBrandSearchQueries({
      'Woolworths': '',
      "PAK'nSAVE": '',
      'New World': '',
      'Four Square': ''
    });
    setActiveChangeBrand(null);
  };

  const isModified = Object.keys(BRANCHES_BY_BRAND).some(
    brand => selectedBranches[brand] !== initialBranches[brand]
  );

  return (

      </div>

      <div className="space-y-4">
        {Object.keys(BRANCHES_BY_BRAND).map((brand) => {
          const selectedStore = selectedBranches[brand];
          const query = brandSearchQueries[brand] || '';
          const isChanging = activeChangeBrand === brand;

          const matches = BRANCHES_BY_BRAND[brand].filter(branch =>

                      matches.map((branch) => {

                        return (

                            key={branch}
                            type="button"
                            onClick={() => handleSelectStore(brand, branch)}

            localStorage.setItem('user_selected_branches', JSON.stringify(selectedBranches));
            setInitialBranches({ ...selectedBranches });
            setFlashingBrands(modifiedBrands);

            setTimeout(() => {
              setFlashingBrands({});
            }, 1500);
          }}
          className={`w-full py-4 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2 font-display ${
            isModified
              ? 'bg-stone-900 hover:bg-ink-600 text-white cursor-pointer shadow-md shadow-stone-200'
              : 'bg-stone-200 text-stone-400 cursor-not-allowed'
          }`}
        >
          Apply Changes
        </button>
      </div>

  );
