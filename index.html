                  </h2>
                  <p id="search-subtitle" className="text-xs font-bold text-slate-400 uppercase tracking-widest">
                    {sortedProducts.length} {sortedProducts.length === 1 ? 'item' : 'items'} found · {totalRetailersCount} {totalRetailersCount === 1 ? 'retailer' : 'retailers'}
                  </p>
                </section>

                <section className="flex flex-col gap-4">
                  <div className="space-y-3">
                    <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 block">
                      Filter by Supermarket:
                    </label>
                    {/* Horizontally-scrolling carousel (no wrap) so the pill row stays a single line and doesn't eat vertical space in the full-screen search view. */}
                    <div className="flex flex-nowrap gap-1.5 overflow-x-auto hide-scrollbar -mx-1 px-1 pb-1">
                      {[
                        { id: 'all', label: 'All Supermarkets' },
                        { id: 'woolworths', label: getStoreDisplayName('woolworths') },
                        { id: 'paknsave', label: getStoreDisplayName('paknsave') },
                        { id: 'newworld', label: getStoreDisplayName('newworld') },
                        { id: 'foursquare', label: getStoreDisplayName('foursquare') },
                        { id: 'freshchoice', label: getStoreDisplayName('freshchoice') },
                      ].map((store) => {
                        const isSelected = selectedStores.includes(store.id);
                        return (
                          <button
                            key={store.id}
                            onClick={() => handleStoreToggle(store.id)}
                            className={`flex-shrink-0 whitespace-nowrap px-3 py-2 text-[10px] font-bold uppercase tracking-wider rounded-xl border transition-all duration-150 cursor-pointer flex items-center gap-1.5 ${
                              isSelected
                                ? 'bg-slate-900 border-slate-900 text-white shadow-xs'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                            }`}
                          >
                            {isSelected && <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse flex-shrink-0" />}
                            {store.label}
                          </button>
                        );
                      })}
                    </div>

                    <div className="flex items-center justify-between pt-1.5 border-t border-slate-100 flex-wrap gap-2">
                      <div className="flex items-center gap-2.5">
                        <input
                          type="checkbox"
                          id="use-personalised-settings"
                          checked={usePersonalised}
                          onChange={(e) => {
                            const checked = e.target.checked;
                            setUsePersonalised(checked);
                            localStorage.setItem('use_personalised_settings', String(checked));
                            if (checked) {
                              showSnackbar('Switched to personalised store branches');
                            } else {
                              showSnackbar('Switched to generic supermarket filters');
                            }
                          }}
                          className="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer accent-indigo-600"
                        />
                        <label
                          htmlFor="use-personalised-settings"
                          className="text-xs font-bold text-slate-600 uppercase tracking-wider cursor-pointer select-none"
                        >
                          Use personalised store settings
                        </label>
                      </div>
                      {usePersonalised && onNavigateToSettings && (
                        <button
                          onClick={onNavigateToSettings}
                          className="text-indigo-600 hover:text-indigo-800 hover:underline text-xs font-black uppercase tracking-wider cursor-pointer transition-colors"
                        >
                          Change
                        </button>
                      )}
                    </div>
                  </div>
                </section>

                <section className="space-y-4">
                  {sortedProducts.length > 0 ? (
                    sortedProducts.map((product, idx) => {
                      const isTracked = trackedProductIds.includes(product.id);

                      const applicableDeals = product.currentDeals.filter((deal) => {
                        if (selectedStores.includes('all')) return true;
                        const normalizedDealStore = deal.store.toLowerCase().replace(/[^a-z]/g, '');
                        return selectedStores.some(selected => {
                          const normalizedSelected = selected.toLowerCase().replace(/[^a-z]/g, '');
                          return normalizedDealStore === normalizedSelected;
                        });
                      });

                      const activeStores = applicableDeals.map((d) => d.store);

                      const bestDeal = applicableDeals.reduce((lowest, current) => {
                        return current.price < lowest.price ? current : lowest;
                      }, applicableDeals[0] || product.currentDeals[0]);

                      return (
                        <div
                          key={`${product.id}-${idx}`}
                          className="relative bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col group transition-all duration-200 hover:shadow-lg hover:shadow-slate-100"
                        >
                          <button
                            onClick={() => handleTrackClick(product.id, product.name)}
                            id={`track-${product.id}`}
                            className={`absolute top-4 right-4 px-2.5 py-1.5 rounded-lg border text-[10px] font-bold uppercase tracking-wider z-10 transition-colors active:scale-97 cursor-pointer ${
                              isTracked
                                ? 'border-red-200 text-red-600 bg-red-50 hover:bg-red-100/50'
                                : 'border-indigo-200 text-indigo-600 bg-indigo-50 hover:bg-indigo-100/50'
                            }`}
                          >
                            {isTracked ? 'Remove from list' : 'Add to list'}
                          </button>

                          <div className="flex p-5 gap-5">
                            <div className="flex flex-col gap-2 items-center flex-shrink-0">
                              <div className="w-24 h-24 rounded-xl flex items-center justify-center overflow-hidden select-none">
                                <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
                              </div>

                              {(() => {
                                const dealsToUse = applicableDeals.length > 0 ? applicableDeals : product.currentDeals;
                                return (
                                  <div className="flex items-center gap-1 bg-slate-50 border border-slate-100 rounded-lg px-2 py-1 max-w-[96px] justify-center">
                                    <span className="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider mr-0.5">At:</span>
                                    <div className="flex -space-x-1.5 overflow-hidden">
                                      {dealsToUse.map((deal) => {
                                        const meta = getStoreLogoMeta(deal.store);
                                        return (
                                          <div
                                            key={deal.store}
                                            title={getStoreDisplayName(deal.store)}
                                            className={`w-5 h-5 rounded-full flex items-center justify-center text-[8px] font-black border border-white select-none shadow-xs ${meta.bg} ${meta.text}`}
                                          >
                                            {meta.short}
                                          </div>
                                        );
                                      })}
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>

                            <div className="flex-grow flex flex-col justify-between py-1 pr-24">
                              <div>
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                  {product.brand}
                                </span>
                                <h3 className="font-bold text-base text-slate-900 leading-snug mt-1 font-display">
                                  {product.name}
                                </h3>
                              </div>

                              {(() => {
                                const dealsToUse = applicableDeals.length > 0 ? applicableDeals : product.currentDeals;
                                const lowestPrice = dealsToUse.reduce((min, d) => d.price < min ? d.price : min, dealsToUse[0]?.price || 0);
                                const hasActiveSpecial = dealsToUse.some((d) => d.isOnSpecial !== false);
                                return (
                                  <div className="flex items-center gap-3 flex-wrap">
                                    <div className="flex items-baseline gap-1 flex-shrink-0 whitespace-nowrap">
                                      <span className="text-slate-400 text-[10px] font-bold uppercase tracking-wider whitespace-nowrap">Lowest price:</span>
                                      <span className="text-base font-black text-slate-900 font-mono">
                                        ${lowestPrice.toFixed(2)}
                                      </span>
                                    </div>
                                    {hasActiveSpecial ? (
                                      <span className="text-[9px] font-black uppercase tracking-widest text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-md px-1.5 py-0.5">
                                        On Special
                                      </span>
                                    ) : (
                                      <span className="text-[9px] font-black uppercase tracking-widest text-slate-500 bg-slate-50 border border-slate-100 rounded-md px-1.5 py-0.5">
                                        Regular Price
                                      </span>
                                    )}
                                  </div>
                                );
                              })()}
                            </div>
                          </div>

                          <div className="flex gap-3 px-5 pb-5">
                            <button
                              onClick={() => onCheckDeal(product, bestDeal.store)}
                              id={`check-deal-${product.id}`}
                              className="flex-1 bg-slate-900 text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-xl hover:bg-indigo-600 transition-colors shadow-lg shadow-slate-200 flex items-center justify-center cursor-pointer"
                            >
                              Check Deals
                            </button>
                          </div>
                        </div>
                      );
                    })
                  ) : (
                    <div className="text-center py-12 space-y-3 bg-white border border-slate-200 rounded-2xl p-6">
                      <AlertCircle className="w-12 h-12 text-slate-300 mx-auto" />
                      <p className="font-bold text-slate-500 uppercase tracking-widest text-xs">
                        {!selectedStores.includes('all')
                          ? selectedStores.length === 1
                            ? `No ${activeSearchQuery || 'grocery'} items were found at ${getStoreDisplayName(selectedStores[0])}`
                            : `No ${activeSearchQuery || 'grocery'} items were found at the selected supermarkets (${selectedStores.map(getStoreDisplayName).join(', ')})`
                          : `No items matching '${activeSearchQuery}'`}
                      </p>
                      <p className="text-xs text-slate-400">
                        {!selectedStores.includes('all')
                          ? "Try selecting 'All Supermarkets' or search for another item."
                          : 'Try searching for "coffee", "ketchup" or "butter"'}
                      </p>
                    </div>
                  )}
                </section>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ===================== components/TrackedTab.tsx ===================== */

function TrackedTab({
  lists,
  selectedListId,
  setSelectedListId,
  trackedProductIds,
  onTrackToggle,
  onCheckDeal,
  showSnackbar,
  onClearList,
  onDeleteList,
  onResetLists,
  onCreateList,
}) {
  const [quantities, setQuantities] = React.useState({
    'avalanche-sachets-10pk': 1,
    'fresh-apples-1kg': 1.0,
    'cadbury-milk-110g': 1,
    'meadow-fresh-milk-2l': 1,
    'lurpak-butter-250g': 1,
  });

  const [purchaseModes, setPurchaseModes] = React.useState({
    'fresh-apples-1kg': 'weight',
  });

  const [activeMode, setActiveMode] = React.useState('deals');

  const [listToDelete, setListToDelete] = React.useState(null);

  const [isCreateModalOpen, setIsCreateModalOpen] = React.useState(false);
  const [newListName, setNewListName] = React.useState('');

  const handleDecrease = (productId, isWeight) => {
    setQuantities((prev) => {
      const current = prev[productId] ?? 1;
      const step = isWeight ? 0.5 : 1;
      const min = isWeight ? 0.5 : 1;
      const next = Math.max(min, current - step);
      return { ...prev, [productId]: next };
    });
  };

  const handleIncrease = (productId, isWeight) => {
    setQuantities((prev) => {
      const current = prev[productId] ?? 1;
      const step = isWeight ? 0.5 : 1;
      return { ...prev, [productId]: current + step };
    });
  };

  const myListProducts = mockProducts.filter((p) => trackedProductIds.includes(p.id));

  const handleTrackClick = (productId, name) => {
    onTrackToggle(productId);
    showSnackbar(`Removed ${name} from list`);
  };

  const stores = ["PAK'nSAVE", 'Woolworths', 'FreshChoice', 'New World', 'Four Square'];

  const getProductPriceForStore = (product, store) => {
    const deal = product.currentDeals.find((d) => d.store === store);
    if (deal) return deal.price;

    const historyPoints = product.priceHistory.filter((h) => h.store === store);
    if (historyPoints.length > 0) {
      return historyPoints[historyPoints.length - 1].price;
    }

    switch (store) {
      case "PAK'nSAVE":
        return Math.round(product.standardPrice * 0.88 * 100) / 100;
      case 'New World':
        return Math.round(product.standardPrice * 0.98 * 100) / 100;
      case 'Four Square':
        return Math.round(product.standardPrice * 1.06 * 100) / 100;
      case 'FreshChoice':
        return Math.round(product.standardPrice * 1.02 * 100) / 100;
      case 'Woolworths':
      default:
        return product.standardPrice;
    }
  };

  const getProductMultiplier = (productId) => {
    const qty = quantities[productId] ?? 1;
    if (productId === 'fresh-apples-1kg') {
      const mode = purchaseModes[productId] ?? 'weight';
      if (mode === 'quantity') {
        return qty * 0.15;
      }
    }
    return qty;
  };

  const storeRankings = stores.map((store) => {
    const total = myListProducts.reduce((sum, product) => {
      const multiplier = getProductMultiplier(product.id);
      return sum + (getProductPriceForStore(product, store) * multiplier);
    }, 0);
    return { store, total };
  }).sort((a, b) => a.total - b.total);

  const cheapestStore = storeRankings[0];
  const mostExpensiveStore = storeRankings[storeRankings.length - 1];
  const maximumSavings = mostExpensiveStore ? mostExpensiveStore.total - cheapestStore.total : 0;

  if (selectedListId === null) {
    return (
      <div className="space-y-6 pb-20 animate-fadeIn">
        <div className="space-y-1.5">
          <p className="text-xs text-slate-500 font-medium leading-relaxed">
            Select one of your grocery lists to check active deals or compare total estimated checkout prices across supermarkets.
          </p>
        </div>

        <div className="space-y-3 max-w-2xl">
          {lists.length === 0 ? (
            <div className="bg-slate-50 border border-slate-200 border-dashed rounded-2xl p-8 text-center space-y-3">
              <p className="text-sm font-medium text-slate-500">
                You have deleted all your lists.
              </p>
              <button
                onClick={onResetLists}
                className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wide transition-all cursor-pointer active:scale-95 shadow-sm inline-flex items-center gap-2"
              >
                <RotateCcw className="w-3.5 h-3.5" />
                Restore Default Lists
              </button>
            </div>
          ) : (
            lists.map((list, index) => {
              const itemCount = list.itemIds.length;

              const borderColors = [
                'border-l-indigo-600',
                'border-l-emerald-600',
                'border-l-amber-500'
              ];
              const bgHoverColors = [
                'hover:bg-indigo-50/20',
                'hover:bg-emerald-50/20',
                'hover:bg-amber-50/10'
              ];
              const textColors = [
                'text-indigo-700',
                'text-emerald-700',
                'text-amber-700'
              ];

              const borderCol = borderColors[index % borderColors.length];
              const bgHover = bgHoverColors[index % bgHoverColors.length];
              const textCol = textColors[index % textColors.length];

              return (
                <div key={list.id} className="flex items-center gap-3">
                  <div
                    onClick={() => setSelectedListId(list.id)}
                    className={`flex-grow bg-white border border-slate-200 border-l-4 ${borderCol} rounded-2xl p-5 shadow-sm hover:shadow-md ${bgHover} transition-all cursor-pointer flex items-center justify-between group active:scale-[0.99]`}
                  >
                    <div className="flex-grow pr-4">
                      <div className="flex items-center gap-2">
                        <h3 className={`text-base font-black uppercase tracking-wider ${textCol}`}>
                          {list.name}
                        </h3>
                        <span className="bg-slate-100 text-slate-600 text-[10px] font-black px-2 py-0.5 rounded-full">
                          {itemCount} {itemCount === 1 ? 'item' : 'items'}
                        </span>
                      </div>
                    </div>
                    <div className="w-8 h-8 bg-slate-50 border border-slate-100 rounded-lg flex items-center justify-center text-slate-400 group-hover:text-slate-700 group-hover:bg-white transition-colors">
                      <svg className="w-4 h-4 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
                      </svg>
                    </div>
                  </div>

                  <button
                    onClick={() => setListToDelete({ id: list.id, name: list.name })}
                    className="bg-rose-50 hover:bg-rose-100 border border-rose-100 text-rose-600 rounded-2xl transition-all cursor-pointer select-none active:scale-95 shadow-sm hover:shadow flex items-center justify-center h-[68px] w-[68px] shrink-0"
                    title={`Delete ${list.name}`}
                  >
                    <Trash2 className="w-5 h-5 stroke-[2]" />
                  </button>
                </div>
              );
            })
          )}

          <div className="flex justify-center pt-3 w-full">
            <button
              onClick={() => setIsCreateModalOpen(true)}
              className="w-full max-w-sm bg-slate-50 border-2 border-dashed border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/10 rounded-2xl transition-all cursor-pointer flex items-center justify-center group active:scale-[0.99] h-[68px]"
            >
              <span className="text-sm font-black text-slate-500 group-hover:text-indigo-600 uppercase tracking-wider transition-colors text-center">
                Create New List
              </span>
            </button>
          </div>
        </div>

        {isCreateModalOpen && (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
            <form
              onSubmit={(e) => {
                e.preventDefault();
                const trimmed = newListName.trim();
                if (trimmed) {
                  onCreateList(trimmed);
                  setNewListName('');
                  setIsCreateModalOpen(false);
                }
              }}
              className="bg-white border border-slate-200 rounded-3xl max-w-xs w-full p-6 space-y-5 shadow-2xl animate-scaleUp"
            >
              <div className="flex flex-col items-center text-center space-y-3">
                <div className="w-12 h-12 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
                  <Plus className="w-6 h-6 stroke-[2.5]" />
                </div>
                <div className="space-y-1">
                  <h3 className="text-lg font-black text-slate-900 tracking-tight uppercase">
                    Create New List
                  </h3>
                  <p className="text-xs text-slate-500 font-medium leading-relaxed">
                    Give your new grocery list a name to get started tracking grocery specials and comparing prices.
                  </p>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">
                  List Name
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Weekly Groceries"
                  value={newListName}
                  onChange={(e) => setNewListName(e.target.value)}
                  className="w-full px-4 py-3 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-hidden focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all bg-slate-50/50"
                  autoFocus
                />
              </div>

              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => {
                    setIsCreateModalOpen(false);
                    setNewListName('');
                  }}
                  className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95 shadow-sm shadow-indigo-100"
                >
                  Create
                </button>
              </div>
            </form>
          </div>
        )}

        {listToDelete && (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
            <div className="bg-white border border-slate-200 rounded-3xl max-w-xs w-full p-6 space-y-5 shadow-2xl animate-scaleUp">
              <div className="flex flex-col items-center text-center space-y-3">
                <div className="w-12 h-12 rounded-full bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-600">
                  <Trash2 className="w-6 h-6 stroke-[2]" />
                </div>
                <div className="space-y-1">
                  <h3 className="text-lg font-black text-slate-900 tracking-tight uppercase">
                    Delete {listToDelete.name}?
                  </h3>
                  <p className="text-xs text-slate-500 font-medium leading-relaxed">
                    Are you sure you want to delete this list? All tracked items inside will be lost. This cannot be undone.
                  </p>
                </div>
              </div>
              <div className="flex gap-3">
                <button
                  onClick={() => setListToDelete(null)}
                  className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95"
                >
                  Cancel
                </button>
                <button
                  onClick={() => {
                    onDeleteList(listToDelete.id);
                    setListToDelete(null);
                  }}
                  className="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer active:scale-95 shadow-sm shadow-rose-200"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const selectedListName = lists.find(l => l.id === selectedListId)?.name || 'List';

  return (
    <div className="space-y-6 pb-20">
      <div className="flex items-center gap-2 animate-fadeIn">
        <button
          onClick={() => setSelectedListId(null)}
          className="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 px-3 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 shadow-sm active:scale-95"
        >
          <svg className="w-3.5 h-3.5 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Back to Lists
        </button>
        <span className="text-xs text-slate-400 font-bold uppercase tracking-wider bg-slate-100/80 px-2.5 py-1 rounded-lg">
          Active: {selectedListName}
        </span>
      </div>

      <div className="space-y-1.5">
        <h4 className="text-xl font-black text-slate-900 tracking-tighter font-display">
          Track individual grocery specials in {selectedListName} or compare total list checkout cost across supermarkets.
        </h4>
      </div>

      <div className="bg-slate-100/80 p-1.5 rounded-xl flex border border-slate-200/60">
        <button
          onClick={() => setActiveMode('deals')}
          className={`flex-1 text-center py-2.5 rounded-lg text-xs font-extrabold uppercase tracking-wider transition-all duration-200 cursor-pointer select-none active:scale-[0.98] ${
            activeMode === 'deals'
              ? 'bg-white text-indigo-600 shadow-sm'
              : 'text-slate-500 hover:text-slate-800 hover:bg-white/50'
          }`}
        >
          Check Deals
        </button>

        <button
          onClick={() => setActiveMode('compare')}
          className={`flex-1 text-center py-2.5 rounded-lg text-xs font-extrabold uppercase tracking-wider transition-all duration-200 cursor-pointer select-none active:scale-[0.98] ${
            activeMode === 'compare'
              ? 'bg-white text-indigo-600 shadow-sm'
              : 'text-slate-500 hover:text-slate-800 hover:bg-white/50'
          }`}
        >
          Compare total list cost
        </button>
      </div>

      {myListProducts.length > 0 ? (
        <div className="space-y-6">
          <div className="space-y-4">
            {myListProducts.map((product, idx) => {
              const bestDeal = product.currentDeals[0];
              const storeName = bestDeal ? bestDeal.store : 'Woolworths';
              const hasWeightAndQuantityOptions = product.id === 'fresh-apples-1kg';
              const isActualWeight = hasWeightAndQuantityOptions
                ? (purchaseModes[product.id] === 'weight')
                : (product.id === 'fresh-apples-1kg' || product.unit === '1kg' || product.category === 'Produce');
              const qty = quantities[product.id] ?? 1;

              return (
                <div
                  key={`${product.id}-${idx}`}
                  className="relative bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col group transition-all duration-200 hover:shadow-lg hover:shadow-slate-100"
                >
                  <button
                    onClick={() => handleTrackClick(product.id, product.name)}
                    id={`track-${product.id}`}
                    className="absolute top-4 right-4 border border-red-200 text-red-600 bg-red-50 hover:bg-red-100/50 px-2.5 py-1.5 rounded-lg transition-colors active:scale-97 cursor-pointer text-[10px] font-bold uppercase tracking-wider z-10"
                  >
                    Remove from list
                  </button>

                  <div className="flex p-5 gap-5">
                    <div className="w-24 h-24 flex-shrink-0 rounded-xl flex items-center justify-center overflow-hidden select-none">
                      <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
                    </div>

                    <div className="flex-grow flex flex-col justify-between py-1 pr-24">
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                          {product.brand}
                        </span>
                        <h3 className="font-bold text-base text-slate-900 leading-snug mt-1 font-display">
                          {product.name}
                        </h3>
                      </div>
                    </div>
                  </div>

                  <div className="px-5 pb-5">
                    {activeMode === 'compare' ? (
                      <div className="flex flex-col items-center animate-fadeIn">
                        {hasWeightAndQuantityOptions && (
                          <div className="flex items-center gap-6 justify-center mb-3 select-none">
                            <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-600">
                              <input
                                type="checkbox"
                                checked={purchaseModes[product.id] === 'weight'}
                                onChange={() => {
                                  setPurchaseModes(prev => ({ ...prev, [product.id]: 'weight' }));
                                  setQuantities(prev => ({ ...prev, [product.id]: 1.0 }));
                                }}
                                className="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500 cursor-pointer"
                              />
                              Weight
                            </label>
                            <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-600">
                              <input
                                type="checkbox"
                                checked={purchaseModes[product.id] === 'quantity'}
                                onChange={() => {
                                  setPurchaseModes(prev => ({ ...prev, [product.id]: 'quantity' }));
                                  setQuantities(prev => ({ ...prev, [product.id]: 1 }));
                                }}
                                className="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500 cursor-pointer"
                              />
                              Quantity
                            </label>
                          </div>
                        )}

                        <div className="flex justify-center w-full">
                          <div className="flex items-stretch h-11 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white max-w-[200px] w-full">
                            <div className="flex-grow flex items-center justify-between px-3.5 bg-white select-none">
                              <span className="text-sm font-extrabold text-slate-800">
                                {isActualWeight ? qty.toFixed(1) : Math.round(qty)}
                              </span>
                              <span className="text-xs font-bold text-slate-500">
                                {isActualWeight ? 'kg' : 'ea.'}
                              </span>
                            </div>

                            <button
                              onClick={() => handleDecrease(product.id, isActualWeight)}
                              className="w-12 bg-slate-700 hover:bg-slate-800 text-white flex items-center justify-center transition-colors cursor-pointer border-l border-slate-600 select-none active:scale-95"
                              title="Decrease"
                            >
                              <Minus className="w-3.5 h-3.5 text-white font-black stroke-[3.5px]" />
                            </button>

                            <button
                              onClick={() => handleIncrease(product.id, isActualWeight)}
                              className="w-12 bg-slate-700 hover:bg-slate-800 text-white flex items-center justify-center transition-colors cursor-pointer border-l border-slate-600 select-none active:scale-95"
                              title="Increase"
                            >
                              <Plus className="w-3.5 h-3.5 text-white font-black stroke-[3.5px]" />
                            </button>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <button
                        onClick={() => onCheckDeal(product, storeName)}
                        id={`check-deal-${product.id}`}
                        className="w-full bg-slate-900 text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-xl hover:bg-indigo-600 transition-colors shadow-lg shadow-slate-200 flex items-center justify-center cursor-pointer animate-fadeIn"
                      >
                        Check Deals
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {activeMode === 'compare' && (
            <div className="flex justify-center pt-2 animate-fadeIn">
              <button
                onClick={() => {
                  setQuantities({
                    'avalanche-sachets-10pk': 1,
                    'fresh-apples-1kg': 1.0,
                    'cadbury-milk-110g': 1,
                    'meadow-fresh-milk-2l': 1,
                    'lurpak-butter-250g': 1,
                  });
                  showSnackbar("Reset all item quantities back to 1");
                }}
                className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all cursor-pointer select-none active:scale-95 shadow-sm hover:shadow flex items-center gap-2"
              >
                <RotateCcw className="w-3.5 h-3.5 stroke-[2.5]" />
                Reset Quantities
              </button>
            </div>
          )}

          {activeMode === 'compare' && (
            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 space-y-6 animate-fadeIn">
              <div className="space-y-1.5">
                <h4 className="text-xl font-black text-slate-900 tracking-tighter font-display">
                  The estimated cost for all items in your list across supermarkets.
                </h4>
              </div>

              <div className="space-y-4">
                {storeRankings.map((ranking, index) => {
                  const isCheapest = index === 0;
                  const percentageOfMax = mostExpensiveStore.total > 0
                    ? (ranking.total / mostExpensiveStore.total) * 100
                    : 0;

                  return (
                    <div key={ranking.store} className="space-y-2">
                      <div className="flex items-center justify-between text-sm">
                        <div className="flex items-center gap-2.5">
                          <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold ${
                            isCheapest
                              ? 'bg-emerald-500 text-white'
                              : 'bg-slate-200 text-slate-600'
                          }`}>
                            {index + 1}
                          </span>
                          <span className={`font-bold ${isCheapest ? 'text-emerald-700' : 'text-slate-700'}`}>
                            {ranking.store}
                          </span>
                          {isCheapest && (
                            <span className="bg-emerald-100 text-emerald-800 text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-[4px]">
                              Best Choice
                            </span>
                          )}
                        </div>
                        <span className={`font-black tracking-tight ${isCheapest ? 'text-emerald-600' : 'text-slate-900'}`}>
                          ${ranking.total.toFixed(2)}
                        </span>
                      </div>

                      <div className="w-full h-2.5 bg-slate-200/60 rounded-full overflow-hidden">
                        <div
                          className={`h-full rounded-full transition-all duration-500 ${
                            isCheapest ? 'bg-emerald-500' : 'bg-slate-400'
                          }`}
                          style={{ width: `${percentageOfMax}%` }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="flex items-center gap-2 text-[11px] text-slate-400">
                <Store className="w-3.5 h-3.5 flex-shrink-0" />
                <span>Prices computed daily using active specials and average category indexes.</span>
              </div>
            </div>
          )}

          <div className="pt-4 border-t border-slate-200/60 flex justify-center">
            <button
              onClick={onClearList}
              className="w-full max-w-xs py-3.5 border border-red-200 text-red-600 hover:bg-red-50 hover:border-red-300 rounded-xl font-black text-xs uppercase tracking-widest transition-all cursor-pointer flex items-center justify-center gap-2 select-none active:scale-[0.98]"
            >
              <Trash2 className="w-4 h-4" />
              Clear Entire List
            </button>
          </div>
        </div>
      ) : (
        <div className="text-center py-16 space-y-4 bg-white border border-slate-200 rounded-2xl">
          <AlertCircle className="w-12 h-12 text-slate-300 mx-auto" />
          <p className="font-bold text-slate-500 uppercase tracking-widest text-xs">Your list is currently empty</p>
          <p className="text-xs text-slate-400 max-w-xs mx-auto">
            Add items back to your list using search results or track switches to see your custom supermarket price ranking comparison!
          </p>
        </div>
      )}
    </div>
  );
}

/* ===================== components/AlertsTab.tsx ===================== */

function AlertsTab({
  alerts,
  onMarkAsRead,
  onClearAll,
  showSnackbar,
}) {

  const handleMarkRead = (id) => {
    onMarkAsRead(id);
    showSnackbar('Notification acknowledged');
  };

  const handleClear = () => {
    onClearAll();
    showSnackbar('Clear all notifications');
  };

  return (
    <div className="space-y-6 pb-20">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-6 h-6 bg-indigo-600 rounded-[2px] transform rotate-45 flex items-center justify-center shadow-md">
            <Bell className="w-3.5 h-3.5 text-white transform -rotate-45" />
          </div>
          <h3 className="text-2xl font-black text-slate-900 tracking-tighter font-display">Price Alerts Log</h3>
        </div>
        {alerts.length > 0 && (
          <button
            onClick={handleClear}
            className="text-[10px] font-black uppercase tracking-widest text-rose-500 hover:text-rose-700 bg-rose-50 border border-rose-100 px-3 py-1.5 rounded-[4px] transition-colors cursor-pointer"
          >
            Clear All
          </button>
        )}
      </div>

      {alerts.length > 0 ? (
        <div className="space-y-3">
          {alerts.map((alert) => {
            const product = mockProducts.find((p) => p.id === alert.productId);
            if (!product) return null;

            const isDodgy = alert.alertType === 'Dodgy Deal';

            return (
              <div
                key={alert.id}
                onClick={() => handleMarkRead(alert.id)}
                className={`p-5 rounded-2xl border transition-all cursor-pointer relative overflow-hidden ${
                  alert.read
                    ? 'bg-white border-slate-200 opacity-65'
                    : isDodgy
                    ? 'bg-red-50/50 border-red-200 shadow-sm'
                    : 'bg-emerald-50/50 border-emerald-200 shadow-sm'
                }`}
              >
                {!alert.read && (
                  <span className={`absolute top-0 right-0 w-3 h-3 rounded-bl-xl ${isDodgy ? 'bg-red-500' : 'bg-emerald-500'}`} />
                )}

                <div className="flex gap-4">
                  <div className={`p-2.5 rounded-lg flex-shrink-0 self-start border ${
                    isDodgy
                      ? 'bg-red-100 border-red-200 text-red-600'
                      : 'bg-emerald-100 border-emerald-200 text-emerald-600'
                  }`}>
                    {isDodgy ? <AlertTriangle className="w-5 h-5" /> : <CheckCircle className="w-5 h-5" />}
                  </div>

                  <div className="space-y-1.5 flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        {alert.store}
                      </span>
                      <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1 uppercase tracking-wider">
                        <Calendar className="w-3.5 h-3.5" /> {alert.timestamp}
                      </span>
                    </div>

                    <h4 className="font-bold text-base text-slate-900 font-display truncate">
                      {product.brand} {product.name}
                    </h4>

                    <p className="text-xs text-slate-600 leading-relaxed">
                      {isDodgy ? (
                        <>
                          <span className="font-bold text-red-600">Dodgy Deal Detected:</span> Regular shelf price of{' '}
                          <span className="font-bold text-slate-900">${product.standardPrice.toFixed(2)}</span> was artificially bumped to{' '}
                          <span className="font-bold line-through text-slate-400">${alert.oldPrice.toFixed(2)}</span>, currently advertised as a discount at{' '}
                          <span className="font-bold text-red-600">${alert.newPrice.toFixed(2)}</span>.
                        </>
                      ) : (
                        <>
                          <span className="font-bold text-emerald-600">Real Deal Verified:</span> Price has dropped to{' '}
                          <span className="font-bold text-emerald-600">${alert.newPrice.toFixed(2)}</span> (was{' '}
                          <span className="font-bold line-through text-slate-400">${alert.oldPrice.toFixed(2)}</span>). You save{' '}
                          <span className="font-bold text-emerald-600">${(alert.oldPrice - alert.newPrice).toFixed(2)}</span>!
                        </>
                      )}
                    </p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ) : (

function HistoryTab({
  history,
  onRecheck,
  onTrackToggle,
  trackedProductIds,
  lists = [],
  showSnackbar,
}) {
  const [searchQuery, setSearchQuery] = React.useState('');

  const filteredHistory = history.filter((item) => {
    const product = mockProducts.find(p => p.id === item.productId);
    if (!product) return false;
    // Same punctuation/spacing-tolerant matching as the main search bar --
    // see normalizeSearchText -- so e.g. a checked "Weet-Bix" still turns up
    // when searching history for "weetbix".
    const query = normalizeSearchText(searchQuery.trim());
    if (!query) return true;
    return (
      normalizeSearchText(product.name).includes(query) ||
      normalizeSearchText(product.brand).includes(query) ||
      (product.description && normalizeSearchText(product.description).includes(query))
    );
  });

  return (
    <div className="space-y-6 pb-20">

      <div className="bg-sky-50 border border-sky-100/80 rounded-2xl p-5 space-y-4">
        <div className="space-y-1.5">
          <h4 className="font-extrabold text-sky-950 text-sm">
            Your checked deals history
          </h4>
          <p className="text-xs text-sky-800 leading-relaxed">
            Review all the supermarket deals and prices you have checked. Your history is shown in chronological order, starting from your most recent check to the oldest.
          </p>
        </div>

        <div className="relative">
          <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-sky-500/70" />
          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="Search your check history..."
            className="w-full bg-white border border-sky-200/60 rounded-xl pl-10 pr-4 py-2 text-xs font-medium text-slate-800 placeholder-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-400 transition-all"
          />
        </div>
      </div>

      {history.length > 0 ? (
        filteredHistory.length > 0 ? (
          <div className="space-y-4">
            {filteredHistory.map((item, idx) => {
            const product = mockProducts.find(p => p.id === item.productId);
            if (!product) return null;

            const isTracked = trackedProductIds.includes(item.productId);
            const bestDeal = product.currentDeals[0];
            const storeName = bestDeal ? bestDeal.store : 'Woolworths';

            return (
              <div
                key={`${item.id}-${idx}`}
                className="relative bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col group transition-all duration-200 hover:shadow-lg hover:shadow-slate-100"
              >
                {(() => {
                  const productLists = lists ? lists.filter(l => l.itemIds.includes(product.id)) : [];
                  const isInAnyList = productLists.length > 0;
                  const buttonText = isInAnyList
                    ? productLists.length === 1
                      ? `In ${productLists[0].name}`
                      : `In ${productLists.length} Lists`
                    : 'Add to list';

                  return (
                    <button
                      onClick={() => onTrackToggle(product.id)}
                      id={`track-btn-${item.id}`}
                      className={`absolute top-4 right-4 border px-2.5 py-1.5 rounded-lg transition-all active:scale-95 cursor-pointer text-[10px] font-black uppercase tracking-wider z-10 flex items-center gap-1.5 ${
                        isInAnyList
                          ? 'border-indigo-200 text-indigo-600 bg-indigo-50 hover:bg-indigo-100/50'
                          : 'border-slate-200 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50/50 hover:border-indigo-200 bg-white'
                      }`}
                    >
                      <Bookmark className={`w-3 h-3 ${isInAnyList ? 'fill-indigo-600 stroke-indigo-600' : ''}`} />
                      {buttonText}
                    </button>
                  );
                })()}

                <div className="flex p-5 gap-5">
                  <div className="w-24 h-24 flex-shrink-0 rounded-xl flex items-center justify-center overflow-hidden select-none">
                    <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
                  </div>

                  <div className="flex-grow flex flex-col justify-between py-1 pr-24">
                    <div>
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        {product.brand}
                      </span>
                      <h3 className="font-bold text-base text-slate-900 leading-snug mt-1 font-display">
                        {product.name}
                      </h3>
                    </div>
                  </div>
                </div>

                <div className="flex gap-3 px-5 pb-5">
                  <button
                    onClick={() => onRecheck(product, item.store)}
                    id={`recheck-btn-${item.id}`}
                    className="flex-1 bg-slate-900 text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-xl hover:bg-indigo-600 transition-colors shadow-lg shadow-slate-200 flex items-center justify-center cursor-pointer"
                  >
                    Check Deals
                  </button>
                </div>
              </div>
            );
          })}
        </div>
        ) : (
          <div className="text-center py-12 space-y-2 bg-white border border-slate-200 rounded-2xl">
            <Search className="w-10 h-10 text-slate-300 mx-auto" />

          <p className="text-xs text-slate-400">Scan a barcode or search for a product on the Home screen to check a deal</p>
        </div>

  );
}

function LoginPage({ onLogin }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [name, setName] = useState('');
  const [ageGroup, setAgeGroup] = useState('');
  const [zipCode, setZipCode] = useState('');
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    if (isSignUp && password !== confirmPassword) {
      setError('Passwords do not match');
      return;
    }
    setError('');

    if (isSignUp) {
      localStorage.setItem('user_name', name);
      localStorage.setItem('user_ageGroup', ageGroup);
      localStorage.setItem('user_zipCode', zipCode);
      localStorage.setItem('user_email', email);
      localStorage.setItem('user_password', password);
    } else {
      if (!localStorage.getItem('user_name')) {
        localStorage.setItem('user_name', 'John Doe');
      }
      if (!localStorage.getItem('user_ageGroup')) {
        localStorage.setItem('user_ageGroup', '25-34');
      }
      if (!localStorage.getItem('user_zipCode')) {
        localStorage.setItem('user_zipCode', '6011');
      }
      if (!localStorage.getItem('user_email')) {
        localStorage.setItem('user_email', email || 'john@example.com');
      }
      if (!localStorage.getItem('user_password')) {
        localStorage.setItem('user_password', password || 'password123');
      }
    }

    onLogin();
  };

  return (
    <div className="min-h-screen bg-slate-50 flex flex-col justify-between p-6 sm:p-8 md:p-12 font-sans select-none">

            {isSignUp ? 'Create your Dodgy Deal account' : 'Welcome back to Dodgy Deal'}

        <form onSubmit={handleSubmit} className="space-y-4">

            <div className="text-rose-600 text-xs font-semibold bg-rose-50 border border-rose-100 rounded-xl p-3 text-center">

const getStoreProductUrl = (store, productName) => {
  const encoded = encodeURIComponent(productName);
  switch (store) {
    case 'Woolworths':
      return `https://www.woolworths.co.nz/shop/search?searchTerm=${encoded}`;
    case "PAK'nSAVE":
      return `https://www.paknsave.co.nz/shop/search?q=${encoded}`;
    case 'New World':
      return `https://www.newworld.co.nz/shop/search?q=${encoded}`;
    case 'Four Square':
      return `https://www.foursquare.co.nz/shop/search?q=${encoded}`;
    case 'FreshChoice':
      return `https://www.freshchoice.co.nz/shop/search?q=${encoded}`;
    default:
      return `https://www.google.com/search?q=${encoded}`;
  }
};

const getStoreLogoMetaModal = (storeName) => {
  const STORE_LOGOS = {
    'Woolworths': { short: 'WW', bg: 'bg-emerald-600', text: 'text-white' },
    "PAK'nSAVE": { short: 'PNS', bg: 'bg-amber-500', text: 'text-slate-950' },
    'New World': { short: 'NW', bg: 'bg-rose-600', text: 'text-white' },
    'Four Square': { short: 'FS', bg: 'bg-green-600', text: 'text-white' },
    'FreshChoice': { short: 'FC', bg: 'bg-sky-600', text: 'text-white' },
  };
  const norm = storeName.toLowerCase().replace(/[^a-z]/g, '');
  if (norm.includes('woolworth')) return STORE_LOGOS['Woolworths'];
  if (norm.includes('paknsave')) return STORE_LOGOS["PAK'nSAVE"];
  if (norm.includes('newworld')) return STORE_LOGOS['New World'];
  if (norm.includes('foursquare')) return STORE_LOGOS['Four Square'];
  if (norm.includes('freshchoice')) return STORE_LOGOS['FreshChoice'];
  return { short: storeName.substring(0, 2).toUpperCase(), bg: 'bg-slate-600', text: 'text-white' };
};

function DealModal({
  isOpen,
  onClose,
  product,
  dealStore,
  onTrackToggle,
  isTracked,
  trackedProductIds = [],
  onNavigateToSettings,
  onNavigateToHowItWorks,
  onNavigateToManageAccount,
  onLogout,
}) {
  if (!product || !dealStore) return null;

  const deal = product.currentDeals.find((d) => d.store === dealStore);
  if (!deal) return null;

  const getPriceForStoreAtTime = (store, time) => {
    let multiplier = 1.0;
    if (store === "PAK'nSAVE") multiplier = 0.95;
    if (store === 'New World') multiplier = 1.05;
    if (store === 'Four Square') multiplier = 1.08;
    if (store === 'FreshChoice') multiplier = 1.12;

    const basePrice = product.standardPrice * multiplier;
    const historyForStore = product.priceHistory.filter((h) => h.store === store);

    if (time === 'Today') {
      const activeDeal = product.currentDeals.find((d) => d.store === store);
      if (activeDeal) return activeDeal.price;
      const hPoint = historyForStore.find((h) => h.date.includes('Jun 28') || h.date.includes('Today'));
      return hPoint ? hPoint.price : basePrice;
    }
    if (time === '30d ago') {
      const hPoint = historyForStore.find((h) => h.date.includes('Jun 10') || h.date.includes('Jun 01') || h.date.includes('30d'));
      if (product.id === 'moccona-classic-200g' && store === 'New World') return 16.99;
      if (product.id === 'nescafe-gold-200g' && store === 'Woolworths') return 18.00;
      return hPoint ? hPoint.price : basePrice;
    }
    if (time === '60d ago') {
      const hPoint = historyForStore.find((h) => h.date.includes('May 15') || h.date.includes('60d'));
      return hPoint ? hPoint.price : basePrice;
    }
    if (time === '90d ago') {
      const hPoint = historyForStore.find((h) => h.date.includes('May 01') || h.date.includes('May 10') || h.date.includes('90d'));
      return hPoint ? hPoint.price : basePrice;
    }
    return basePrice;
  };

  const storesList = ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square', 'FreshChoice'];
  const barChartData = storesList.map((store) => {
    const current = getPriceForStoreAtTime(store, 'Today');
    const p90 = getPriceForStoreAtTime(store, '90d ago');
    const p60 = getPriceForStoreAtTime(store, '60d ago');
    const p30 = getPriceForStoreAtTime(store, '30d ago');
    const avg = (p90 + p60 + p30) / 3;

    const shortNames = {
      'Woolworths': 'WW',
      "PAK'nSAVE": 'PNS',
      'New World': 'NW',
      'Four Square': 'FS',
      'FreshChoice': 'FC',
    };

    const orangeUnder = current < avg ? current : 0;
    const blueBody = current < avg ? (avg - current) : avg;
    const orangeOver = current >= avg ? (current - avg) : 0;

    return {
      name: shortNames[store] || store,
      storeName: store,
      currentPrice: current,
      averagePrice: avg,
      orangeUnder,
      blueBody,
      orangeOver,
    };
  });

  const rankingList = [
    { store: 'Woolworths', price: getPriceForStoreAtTime('Woolworths', 'Today') },
    { store: "PAK'nSAVE", price: getPriceForStoreAtTime("PAK'nSAVE", 'Today') },
    { store: 'New World', price: getPriceForStoreAtTime('New World', 'Today') },
    { store: 'Four Square', price: getPriceForStoreAtTime('Four Square', 'Today') },
    { store: 'FreshChoice', price: getPriceForStoreAtTime('FreshChoice', 'Today') },
  ].sort((a, b) => a.price - b.price);

  const oldestPrice = getPriceForStoreAtTime(dealStore, '90d ago');
  const currentPrice = getPriceForStoreAtTime(dealStore, 'Today');
  const diffPct = oldestPrice > 0 ? Math.round(((currentPrice - oldestPrice) / oldestPrice) * 100) : 0;

  const price90 = getPriceForStoreAtTime(dealStore, '90d ago');
  const price60 = getPriceForStoreAtTime(dealStore, '60d ago');
  const price30 = getPriceForStoreAtTime(dealStore, '30d ago');
  const average90dPrice = (price90 + price60 + price30) / 3;

  const [showPricingDetails, setShowPricingDetails] = React.useState(false);
  const [currentView, setCurrentView] = React.useState('assessment');
  const [selectedStores, setSelectedStores] = React.useState(['all']);

  const [usePersonalised, setUsePersonalised] = React.useState(() => {
    return localStorage.getItem('use_personalised_settings') === 'true';
  });

  const [selectedBranches] = React.useState(() => {
    const saved = localStorage.getItem('user_selected_branches');
    const defaults = {
      'Woolworths': 'Woolworths CBD',
      "PAK'nSAVE": "PAK'nSAVE Mt Albert",
      'New World': 'New World Victoria Park',
      'Four Square': 'Four Square Ellerslie',
      'FreshChoice': 'FreshChoice Half Moon Bay',
    };
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          const loaded = {};
          ['Woolworths', "PAK'nSAVE", 'New World', 'Four Square', 'FreshChoice'].forEach(brand => {
            loaded[brand] = parsed[brand] || defaults[brand];
          });
          return loaded;
        }
      } catch (e) {
        // Fallback
      }
    }
    return defaults;
  });

  const getStoreDisplayName = (storeKey) => {
    if (usePersonalised) {
      switch (storeKey.toLowerCase()) {
        case 'woolworths': return selectedBranches['Woolworths'] || 'Woolworths';
        case 'paknsave': return selectedBranches["PAK'nSAVE"] || "PAK'nSAVE";
        case 'newworld': return selectedBranches['New World'] || 'New World';
        case 'foursquare': return selectedBranches['Four Square'] || 'Four Square';
        case 'freshchoice': return selectedBranches['FreshChoice'] || 'FreshChoice';
        default: return storeKey;
      }
    }
    switch (storeKey.toLowerCase()) {
      case 'woolworths': return 'Woolworths';
      case 'paknsave': return "PAK'nSAVE";
      case 'newworld': return 'New World';
      case 'foursquare': return 'Four Square';
      case 'freshchoice': return 'FreshChoice';
      default: return storeKey;
    }
  };

  const handleStoreToggle = (storeId) => {
    if (storeId === 'all') {
      setSelectedStores(['all']);
    } else {
      let nextStores = [...selectedStores];
      if (nextStores.includes('all')) {
        nextStores = [storeId];
      } else {
        if (nextStores.includes(storeId)) {
          nextStores = nextStores.filter((id) => id !== storeId);
          if (nextStores.length === 0) {
            nextStores = ['all'];
          }
        } else {
          nextStores.push(storeId);
        }
      }
      setSelectedStores(nextStores);
    }
  };

  React.useEffect(() => {
    if (!isOpen) {
      setShowPricingDetails(false);
      setCurrentView('assessment');
      setSelectedStores(['all']);
    } else {
      setUsePersonalised(localStorage.getItem('use_personalised_settings') === 'true');
    }
  }, [isOpen]);

  React.useEffect(() => {
    setCurrentView('assessment');
    setSelectedStores(['all']);
  }, [product, dealStore]);

  const getAnyProductPriceToday = (p, store) => {
    const activeDeal = p.currentDeals.find((d) => d.store === store);
    if (activeDeal) return activeDeal.price;

    let multiplier = 1.0;
    if (store === "PAK'nSAVE") multiplier = 0.95;
    if (store === 'New World') multiplier = 1.05;
    if (store === 'Four Square') multiplier = 1.08;
    if (store === 'FreshChoice') multiplier = 1.12;

    const basePrice = p.standardPrice * multiplier;
    const historyForStore = p.priceHistory.filter((h) => h.store === store);
    const hPoint = historyForStore.find((h) => h.date.includes('Jun 28') || h.date.includes('Today'));
    return hPoint ? hPoint.price : basePrice;
  };

  let alternativeProducts = mockProducts.filter(
    (p) => p.category === product.category && p.id !== product.id
  );

  if (alternativeProducts.length === 0) {
    alternativeProducts = mockProducts.filter((p) => p.id !== product.id);
  }

  const allCheaperAlternativeOptions = alternativeProducts
    .flatMap((p) => {
      return storesList.map((store) => {
        const price = getAnyProductPriceToday(p, store);
        return {
          product: p,
          store,
          price,
          saving: deal.price - price,
        };
      });
    })
    .filter((item) => item.price < deal.price);

  const cheaperAlternatives = allCheaperAlternativeOptions
    .filter((item) => {
      if (selectedStores.includes('all')) return true;
      const normalizedStore = item.store.toLowerCase().replace(/[^a-z]/g, '');
      return selectedStores.some((selected) => {
        const normalizedSelected = selected.toLowerCase().replace(/[^a-z]/g, '');
        return normalizedStore === normalizedSelected;
      });
    })
    .sort((a, b) => b.saving - a.saving);

  const getPricingStatsForStore = (store) => {
    const pToday = getPriceForStoreAtTime(store, 'Today');
    const p30 = getPriceForStoreAtTime(store, '30d ago');
    const p60 = getPriceForStoreAtTime(store, '60d ago');
    const p90 = getPriceForStoreAtTime(store, '90d ago');

    const prices = [pToday, p30, p60, p90];
    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;

    return {
      min: minPrice,
      max: maxPrice,
      avg: avgPrice,
    };
  };

  const discountPct = ((average90dPrice - deal.price) / average90dPrice) * 100;
  let verdict;
  let verdictColorClass = '';
  let verdictBgClass = '';
  let verdictBorderClass = '';

  if (deal.isOnSpecial === false) {
    // Browsing a plain, non-special item -- there's no "deal" to judge as
    // dodgy/genuine/fair, so show a neutral price-history state instead of
    // a verdict that implies a promotion exists.
    verdict = 'Regular Price';
    verdictColorClass = 'text-slate-700';
    verdictBgClass = 'bg-slate-50';
    verdictBorderClass = 'border-slate-200';
  } else if (discountPct >= 6) {
    verdict = 'Real Saver';
    verdictColorClass = 'text-emerald-800';
    verdictBgClass = 'bg-emerald-50';
    verdictBorderClass = 'border-emerald-200';
  } else if (discountPct >= 3) {
    verdict = 'Fair Deal';
    verdictColorClass = 'text-amber-800';
    verdictBgClass = 'bg-amber-50';
    verdictBorderClass = 'border-amber-200';
  } else {
    verdict = 'Dodgy Deal';
    verdictColorClass = 'text-red-800';
    verdictBgClass = 'bg-red-50';
    verdictBorderClass = 'border-red-200';
  }

  const cheapestStoreItem = rankingList[0];

  const cheapestStore = cheapestStoreItem.store;
  const cheapestPrice90 = getPriceForStoreAtTime(cheapestStore, '90d ago');
  const cheapestPrice60 = getPriceForStoreAtTime(cheapestStore, '60d ago');
  const cheapestPrice30 = getPriceForStoreAtTime(cheapestStore, '30d ago');
  const cheapestAverage90dPrice = (cheapestPrice90 + cheapestPrice60 + cheapestPrice30) / 3;
  const cheapestDiscountPct = cheapestAverage90dPrice > 0
    ? Math.round(((cheapestAverage90dPrice - cheapestStoreItem.price) / cheapestAverage90dPrice) * 100)
    : 0;

  return (
    <AnimatePresence>
      {isOpen && (
        <motion.div
          initial={{ opacity: 0, x: 20 }}
          animate={{ opacity: 1, x: 0 }}
          exit={{ opacity: 0, x: 20 }}
          transition={{ duration: 0.25, ease: 'easeOut' }}
          id="deal-assessment-page"
          className="w-full min-h-screen flex flex-col bg-[#f8f9fa] relative overflow-hidden"
        >
          {currentView === 'cheaper-alternatives' ? (
            <>
              <AppHeader
                title="Cheaper Alternatives"
                onBack={() => setCurrentView('assessment')}
                backButtonId="back-to-assessment-btn"
                onOpenHowItWorks={onNavigateToHowItWorks}
                onOpenManageAccount={onNavigateToManageAccount}
                onOpenSettings={onNavigateToSettings}
                onLogout={onLogout}
              />

              <div className="flex-1 overflow-y-auto p-6 space-y-6 pb-12">
                <div className={`p-6 rounded-2xl border ${verdictBorderClass} ${verdictBgClass} flex flex-col items-center text-center space-y-4 shadow-xs`}>
                  <h2 className={`text-2xl font-black tracking-tight font-display ${verdictColorClass}`}>
                    {verdict}
                  </h2>

                  <div className="bg-white border border-slate-200/60 rounded-xl p-4 flex items-center gap-4 w-full max-w-sm text-left">
                    <div className="w-16 h-16 flex-shrink-0 rounded-lg flex items-center justify-center overflow-hidden select-none">
                      <ProductImage src={product.image} alt={product.name} className="w-full h-full object-contain" />
                    </div>
                    <div className="min-w-0 flex-1">
                      <h3 className="font-extrabold text-slate-900 text-sm leading-snug truncate">
                        {product.name}
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5 font-bold uppercase tracking-wider">
                        {product.brand} · {product.unit}
                      </p>
                      <div className="flex items-baseline gap-2 mt-1.5 flex-wrap">
                        <span className="text-sm font-black text-slate-900">
                          ${deal.price.toFixed(2)}
                        </span>
                        <span className="text-[10px] font-semibold text-slate-500">
                          at {getStoreDisplayName(dealStore)}
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="space-y-1">
                  <h2 className="text-xl font-black tracking-tight text-slate-900 font-display">
                    Cheaper Alternative Options
                  </h2>
                </div>

                <div className="space-y-3">
                  <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 block">
                    Filter Alternatives by Supermarket:
                  </label>
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      { id: 'all', label: 'All Supermarkets' },
                      { id: 'woolworths', label: getStoreDisplayName('woolworths') },
                      { id: 'paknsave', label: getStoreDisplayName('paknsave') },
                      { id: 'newworld', label: getStoreDisplayName('newworld') },
                      { id: 'foursquare', label: getStoreDisplayName('foursquare') },
                      { id: 'freshchoice', label: getStoreDisplayName('freshchoice') },
                    ].map((store) => {
                      const isSelected = selectedStores.includes(store.id);
                      return (
                        <button
                          key={store.id}
                          onClick={() => handleStoreToggle(store.id)}
                          className={`px-3 py-2 text-[10px] font-bold uppercase tracking-wider rounded-xl border transition-all duration-150 cursor-pointer flex items-center gap-1.5 ${
                            isSelected
                              ? 'bg-slate-900 border-slate-900 text-white shadow-xs'
                              : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                          }`}
                        >
                          {isSelected && <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse" />}
                          {store.label}
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center justify-between pt-1.5 border-t border-slate-100 flex-wrap gap-2">
                    <div className="flex items-center gap-2.5">
                      <input
                        type="checkbox"
                        id="use-personalised-settings-modal"
                        checked={usePersonalised}
                        onChange={(e) => {
                          const checked = e.target.checked;
                          setUsePersonalised(checked);
                          localStorage.setItem('use_personalised_settings', String(checked));
                        }}
                        className="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer accent-indigo-600"
                      />
                      <label
                        htmlFor="use-personalised-settings-modal"
                        className="text-xs font-bold text-slate-600 uppercase tracking-wider cursor-pointer select-none"
                      >
                        Use personalised store settings
                      </label>
                    </div>
                    {usePersonalised && onNavigateToSettings && (
                      <button
                        onClick={onNavigateToSettings}
                        className="text-indigo-600 hover:text-indigo-800 hover:underline text-xs font-black uppercase tracking-wider cursor-pointer transition-colors"
                      >
                        Change
                      </button>
                    )}
                  </div>
                </div>

                {cheaperAlternatives.length === 0 ? (
                  <div className="bg-white border border-slate-200/80 rounded-2xl p-6 text-center space-y-2 shadow-xs">
                    <p className="text-sm font-bold text-slate-600">No cheaper alternatives found for the selected filter.</p>
                    <p className="text-xs text-slate-400 font-medium">Try choosing another supermarket or "All Supermarkets".</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {cheaperAlternatives.map(({ product: altProd, store: altStore, price: altPrice, saving }) => {

                        <div
                          key={`${altProd.id}-${altStore}`}
                          className="relative bg-white border border-slate-200/80 rounded-2xl p-5 flex flex-col gap-4 shadow-xs hover:border-slate-300 transition-all"
                        >
                          <button
                            onClick={() => onTrackToggle(altProd.id)}
                            className={`absolute top-4 right-4 px-2.5 py-1.5 rounded-lg border text-[10px] font-bold uppercase tracking-wider z-10 transition-colors active:scale-97 cursor-pointer ${
                              isAltTracked
                                ? 'border-red-200 text-red-600 bg-red-50 hover:bg-red-100/50'
                                : 'border-indigo-200 text-indigo-600 bg-indigo-50 hover:bg-indigo-100/50'
                            }`}
                          >
                            {isAltTracked ? 'Remove' : 'Add to list'}
                          </button>

                          <div className="flex gap-5">
                            <div className="flex flex-col gap-2 items-center flex-shrink-0">
                              <div className="w-24 h-24 rounded-xl flex items-center justify-center overflow-hidden select-none">
                                <ProductImage src={altProd.image} alt={altProd.name} className="w-full h-full object-contain" />
                              </div>

                              {(() => {
                                const meta = getStoreLogoMetaModal(altStore);
                                return (
                                  <div className="flex items-center gap-1 bg-slate-50 border border-slate-100 rounded-lg px-2 py-1 max-w-[96px] justify-center">

                                    <div className="flex -space-x-1.5 overflow-hidden">
                                      <div
                                        key={altStore}
                                        title={getStoreDisplayName(altStore)}
                                        className={`w-5 h-5 rounded-full flex items-center justify-center text-[8px] font-black border border-white select-none shadow-xs ${meta.bg} ${meta.text}`}
                                      >
                                        {meta.short}
                                      </div>
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>

                            <div className="flex-grow flex flex-col justify-between py-1 pr-24 min-w-0">
                              <div className="space-y-1">
                                <p className="text-[10px] font-black uppercase tracking-wider text-indigo-600">

                                  <span className="text-slate-400 text-[10px] font-bold uppercase tracking-wider whitespace-nowrap">Lowest price:</span>
                                  <span className="text-base font-black text-slate-900 font-mono">
                                    ${altPrice.toFixed(2)}
                                  </span>
                                </div>
                              </div>
                            </div>
                          </div>

                          <div className="border-t border-slate-100 pt-3">
                            <a
                              href={getStoreProductUrl(altStore, altProd.name)}
                              target="_blank"
                              rel="noopener noreferrer"
